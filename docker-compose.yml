services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be passed at BUILD time — they're inlined into
        # the client bundle. Set in .env (compose auto-loads it) or here.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: warranty-vault:local
    container_name: warranty-vault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── DB & uploads → /data volume ───────────────────────────────
      DATABASE_URL: "file:/data/dev.db"
      PRIVATE_UPLOAD_ROOT: "/data/private-uploads"

      # ── Required ──────────────────────────────────────────────────
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (>=32 chars)}
      FILE_MASTER_KEY: ${FILE_MASTER_KEY:?FILE_MASTER_KEY must be set (32-byte base64)}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}

      # ── Push notifications (optional, but if you set one set all) ─
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

      # ── Email (optional — without it, reset links print to logs) ──
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

      NODE_ENV: production
    volumes:
      - warranty-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  warranty-data:
