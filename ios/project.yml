name: Warrly
options:
  bundleIdPrefix: com.warrly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # APNs dùng hai môi trường khác nhau: build Debug đăng ký token với
    # gateway sandbox, build Release/TestFlight với gateway production.
    # Entitlement phải khớp, nếu không APNs từ chối token và push im lặng.
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  WarrlyKit:
    path: .

targets:
  Warrly:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Warrly.entitlements
    dependencies:
      - package: WarrlyKit
        product: WarrlyKit
      # The share sheet's host. `embed: true` puts it in the app's
      # "Embed App Extensions" copy phase; without that the extension builds but
      # never appears in the share sheet.
      - target: ShareExtension
        embed: true
        # Re-sign the embedded appex as part of the app copy phase, so the
        # archive carries one signature/identity even if the extension target
        # was built separately.
        codeSign: true
    # Per-configuration API endpoint. These feed `WV_API_BASE_URL`, which the
    # generated Info.plist exposes as `WVAPIBaseURL` and WarrlyKit's
    # `BaseURLResolver` reads at launch. Debug: http://localhost:4000.
    # Release: https://api.warrly.com. See ios/Config/Base.xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: App/Warrly.entitlements
      properties:
        # Biến theo configuration: Debug = development, Release = production.
        # Xcode thay $(...) trong file entitlements lúc build, nên MỘT file
        # phục vụ cả hai. Hardcode 'development' thì archive cho TestFlight sẽ
        # mang entitlement development, và APNs production từ chối token.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared container for the Share Extension queue. The SAME group must be
        # in ShareExtension/ShareExtension.entitlements below and enabled for
        # both bundle ids in the Apple developer portal, otherwise
        # `containerURL(forSecurityApplicationGroupIdentifier:)` returns nil.
        com.apple.security.application-groups:
          - group.com.warrly
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Warrly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resolved at build time from Config/{Debug,Release}.xcconfig. A
        # TestFlight build has no launch environment, so this key (not
        # `WV_BASE_URL`) is what makes production builds point at production.
        WVAPIBaseURL: $(WV_API_BASE_URL)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # No blanket ATS exception: production traffic is HTTPS and needs none.
        # The only cleartext allowance is `localhost`, for the Go API a Debug
        # build talks to on the simulator. `NSAllowsArbitraryLoads` was removed
        # because Apple requires a justification for it and rejects apps that
        # leave it on without one.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSFaceIDUsageDescription: Warrly dùng Face ID để mở khoá ứng dụng và bảo vệ dữ liệu bảo hành của bạn. Sinh trắc học chỉ được xác thực trên thiết bị, không gửi đi đâu cả.
        # Quét serial/IMEI bằng DataScannerViewController (VisionKit). Chuỗi
        # nhận được chỉ là bản nháp điền vào biểu mẫu — người dùng vẫn kiểm tra
        # và bấm lưu; hình ảnh camera không rời khỏi thiết bị.
        NSCameraUsageDescription: Warrly dùng camera để quét mã vạch hoặc đọc serial/IMEI in trên hộp hay mặt máy, giúp bạn điền đúng số mà không phải gõ tay. Hình ảnh chỉ được xử lý trên thiết bị và không gửi đi đâu cả.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrly
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RNCMNPBA9L

  # Share Extension: the OS-level path into the capture-first inbox.
  #
  # It accepts images (JPEG/PNG/HEIC) and PDFs, writes the file into the App
  # Group queue (`SharedInboxStore`) and exits. It deliberately has no network
  # client and no Keychain access: the app drains the queue on next launch.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShareExtension.entitlements
    dependencies:
      - package: WarrlyKit
        product: WarrlyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrly.ShareExtension
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # No UIApplication / UIApplication.shared usage is reachable from this
        # target; keeping this on makes an accidental one a compile error.
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RNCMNPBA9L
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Warrly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # $(PRODUCT_MODULE_NAME) expands to `ShareExtension`, so the class
          # stays linkable without an @objc name.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Images come from Photos/Mail as `public.image`; PDFs and other
            # files arrive as a file. The extension itself narrows the file path
            # to JPEG/PNG/HEIC/PDF and shows a clear message for anything else —
            # the sheet cannot express "only these UTIs" with the dictionary
            # form, so a bare `.txt` reaches the extension and is rejected there.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.warrly

schemes:
  # XcodeGen does not create a shared scheme for an extension target by default,
  # which would make "build the extension's scheme" impossible in CI. Declare
  # one explicitly; the app's own scheme stays Xcode-managed.
  ShareExtension:
    build:
      targets:
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
