name: Warrly
options:
  bundleIdPrefix: com.warrly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "5.10"
    # 1.0.0 — bản phát hành đầu tiên. Build number phải TĂNG mỗi lần upload lên
    # App Store Connect, kể cả khi marketing version không đổi: TestFlight từ chối
    # một build trùng số. Tăng CURRENT_PROJECT_VERSION, không sửa pbxproj tay —
    # file đó sinh ra từ chính project.yml này.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # APNs dùng hai môi trường khác nhau: build Debug đăng ký token với
    # gateway sandbox, build Release/TestFlight với gateway production.
    # Entitlement phải khớp, nếu không APNs từ chối token và push im lặng.
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  WarrlyKit:
    path: .
  # Google Mobile Ads (AdMob) — the free tier's banner. `exactVersion`, not
  # `from`: an ad SDK upgrade can change ad serving behaviour, plist keys and
  # the SKAdNetwork id list, so it should be a reviewed change with a build
  # behind it, never a silent resolve.
  #
  # The GoogleMobileAds package already depends on GoogleUserMessagingPlatform
  # (UMP) transitively, but UMP is declared explicitly as well so that
  # `import UserMessagingPlatform` resolves in our own sources instead of
  # relying on a transitive binary being visible.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 3.1.0

targets:
  Warrly:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Warrly.entitlements
    dependencies:
      - package: WarrlyKit
        product: WarrlyKit
      # AdMob + UMP are app-target only. They are NOT added to WarrlyKit's
      # Package.swift: that library is also built for macOS by `swift test`,
      # and both of these are iOS binaries. The consent ordering logic lives in
      # WarrlyKit without either import; the app target maps the SDK enums onto
      # it (see App/Ads/AdsController.swift).
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      # The share sheet's host. `embed: true` puts it in the app's
      # "Embed App Extensions" copy phase; without that the extension builds but
      # never appears in the share sheet.
      - target: ShareExtension
        embed: true
        # Re-sign the embedded appex as part of the app copy phase, so the
        # archive carries one signature/identity even if the extension target
        # was built separately.
        codeSign: true
      # The home-screen deadline widget. Same App Group as the share queue; the
      # app is the only writer (see `App/Core/Surface/DeadlineSurface.swift`).
      - target: WarrlyWidget
        embed: true
        codeSign: true
    # Per-configuration API endpoint. These feed `WV_API_BASE_URL`, which the
    # generated Info.plist exposes as `WVAPIBaseURL` and WarrlyKit's
    # `BaseURLResolver` reads at launch. Debug: http://localhost:4000.
    # Release: https://api.warrly.com. See ios/Config/Base.xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    entitlements:
      path: App/Warrly.entitlements
      properties:
        # Biến theo configuration: Debug = development, Release = production.
        # Xcode thay $(...) trong file entitlements lúc build, nên MỘT file
        # phục vụ cả hai. Hardcode 'development' thì archive cho TestFlight sẽ
        # mang entitlement development, và APNs production từ chối token.
        aps-environment: $(APS_ENVIRONMENT)
        # Shared container for the Share Extension queue, the widget snapshot
        # and the Spotlight/intent hand-off. The SAME group must be in
        # ShareExtension/ShareExtension.entitlements and
        # WidgetExtension/WarrlyWidget.entitlements below, and enabled for all
        # three bundle ids in the Apple developer portal, otherwise
        # `containerURL(forSecurityApplicationGroupIdentifier:)` returns nil.
        com.apple.security.application-groups:
          - group.com.warrly
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Warrly
        # Export compliance. The app implements no encryption of its own: TLS
        # and the Keychain are the OS's, and the AES-256-GCM for receipt blobs
        # runs in the Go API, never on the device. Declaring it here means App
        # Store Connect stops asking the "App Encryption Documentation" question
        # on every upload, and the answer it records is the true one.
        #
        # If client-side encryption is ever added (an encrypted local store, a
        # custom cipher), this must become true and the CCATS/self-classification
        # path applies. Leaving it false when that changes is a compliance defect,
        # not a formality.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Resolved at build time from Config/{Debug,Release}.xcconfig. A
        # TestFlight build has no launch environment, so this key (not
        # `WV_BASE_URL`) is what makes production builds point at production.
        WVAPIBaseURL: $(WV_API_BASE_URL)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # `warrly://device/<id>` — the widget's tap target and the URL half of
        # the "open this device" flow. Parsed by `WarrlyDeepLink`; the
        # Spotlight path uses `NSUserActivity` instead of this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.warrly.device
            CFBundleURLSchemes:
              - warrly
        # No blanket ATS exception: production traffic is HTTPS and needs none.
        # The only cleartext allowance is `localhost`, for the Go API a Debug
        # build talks to on the simulator. `NSAllowsArbitraryLoads` was removed
        # because Apple requires a justification for it and rejects apps that
        # leave it on without one.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSFaceIDUsageDescription: Warrly dùng Face ID để mở khoá ứng dụng và bảo vệ dữ liệu bảo hành của bạn. Sinh trắc học chỉ được xác thực trên thiết bị, không gửi đi đâu cả.
        # Quét serial/IMEI bằng DataScannerViewController (VisionKit). Chuỗi
        # nhận được chỉ là bản nháp điền vào biểu mẫu — người dùng vẫn kiểm tra
        # và bấm lưu; hình ảnh camera không rời khỏi thiết bị.
        NSCameraUsageDescription: Warrly dùng camera để quét mã vạch hoặc đọc serial/IMEI in trên hộp hay mặt máy, giúp bạn điền đúng số mà không phải gõ tay. Hình ảnh chỉ được xử lý trên thiết bị và không gửi đi đâu cả.
        # ── Google AdMob ────────────────────────────────────────────────────
        # App id. The TILDE form (`~`), not the ad-unit SLASH form — mixing the
        # two is the classic setup bug. This is the AdMob app registered for
        # Warrly; the publisher id (`pub-1055054650162014`) is shared with the
        # owner's other app, so ⛔ NEVER tap a live ad while testing.
        #
        # Without this key the Google Mobile Ads SDK kills the app on
        # `MobileAds.shared.start`, so it is present in Debug and Release both.
        # Debug never serves a live ad because the ad-UNIT id is Google's test
        # unit (Config/Debug.xcconfig), not because the app id is fake.
        GADApplicationIdentifier: ca-app-pub-1055054650162014~5553247910
        # Banner ad-unit id, resolved per configuration from
        # Config/{Debug,Release}.xcconfig:
        #   Debug   → Google's test banner unit (no revenue, no policy risk)
        #   Release → the real Warrly banner unit
        # Same mechanism as WVAPIBaseURL: an xcconfig variable expanded into the
        # generated Info.plist at build time.
        GADBannerUnitID: $(WV_ADMOB_BANNER_UNIT_ID)
        # ATT prompt copy (Vietnamese, like every other usage description in
        # this app — there is no InfoPlist.strings localisation for them).
        # It must say what the data is for and that refusing is allowed: the
        # prompt is shown only after UMP has answered, and a refusal downgrades
        # ads to non-personalised instead of removing them.
        NSUserTrackingUsageDescription: Warrly dùng mã nhận dạng thiết bị để hiển thị quảng cáo phù hợp hơn với bạn. Bạn có thể từ chối — ứng dụng vẫn hoạt động đầy đủ, chỉ là quảng cáo không còn được cá nhân hoá.
        # SKAdNetwork attribution ids: Google's FULL current list, copied from
        # https://developers.google.com/admob/ios/3p-skadnetworks ("Google and
        # select third-party buyer SKAdNetwork identifiers", last updated
        # 2026-01-30 — 50 networks). Google trims and adds to this list, so
        # re-copy it when the ads SDK is upgraded; do not hand-curate.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrly
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H572CC5N6D

  # Share Extension: the OS-level path into the capture-first inbox.
  #
  # It accepts images (JPEG/PNG/HEIC) and PDFs, writes the file into the App
  # Group queue (`SharedInboxStore`) and exits. It deliberately has no network
  # client and no Keychain access: the app drains the queue on next launch.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShareExtension.entitlements
    dependencies:
      - package: WarrlyKit
        product: WarrlyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrly.ShareExtension
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # No UIApplication / UIApplication.shared usage is reachable from this
        # target; keeping this on makes an accidental one a compile error.
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H572CC5N6D
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Warrly
        # Export compliance. The app implements no encryption of its own: TLS
        # and the Keychain are the OS's, and the AES-256-GCM for receipt blobs
        # runs in the Go API, never on the device. Declaring it here means App
        # Store Connect stops asking the "App Encryption Documentation" question
        # on every upload, and the answer it records is the true one.
        #
        # If client-side encryption is ever added (an encrypted local store, a
        # custom cipher), this must become true and the CCATS/self-classification
        # path applies. Leaving it false when that changes is a compliance defect,
        # not a formality.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # $(PRODUCT_MODULE_NAME) expands to `ShareExtension`, so the class
          # stays linkable without an @objc name.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Images come from Photos/Mail as `public.image`; PDFs and other
            # files arrive as a file. The extension itself narrows the file path
            # to JPEG/PNG/HEIC/PDF and shows a clear message for anything else —
            # the sheet cannot express "only these UTIs" with the dictionary
            # form, so a bare `.txt` reaches the extension and is rejected there.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.warrly

  # WidgetKit extension: small + medium home-screen widget fed by the App
  # Group snapshot. It has no network client, no Keychain access group and no
  # bearer token on purpose — the app writes what it needs, and the widget says
  # "as of …" once that snapshot is old.
  #
  # No `.accessory*` family is listed in the widget configuration, so this
  # extension never renders on the Lock Screen. See the privacy note in
  # `WidgetExtension/WarrlyDeadlineWidget.swift`.
  WarrlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
          - WarrlyWidget.entitlements
    dependencies:
      - package: WarrlyKit
        product: WarrlyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warrly.WarrlyWidget
        PRODUCT_NAME: WarrlyWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H572CC5N6D
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Warrly
        # Export compliance. The app implements no encryption of its own: TLS
        # and the Keychain are the OS's, and the AES-256-GCM for receipt blobs
        # runs in the Go API, never on the device. Declaring it here means App
        # Store Connect stops asking the "App Encryption Documentation" question
        # on every upload, and the answer it records is the true one.
        #
        # If client-side encryption is ever added (an encrypted local store, a
        # custom cipher), this must become true and the CCATS/self-classification
        # path applies. Leaving it false when that changes is a compliance defect,
        # not a formality.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/WarrlyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.warrly

schemes:
  # XcodeGen does not create a shared scheme for an extension target by default,
  # which would make "build the extension's scheme" impossible in CI. Declare
  # one explicitly; the app's own scheme stays Xcode-managed.
  ShareExtension:
    build:
      targets:
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release

  WarrlyWidget:
    build:
      targets:
        WarrlyWidget: all
    run:
      config: Debug
    archive:
      config: Release
