<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WarrantyVault — Quản lý bảo hành & gói đăng ký</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<style>
  /* Tweaks panel position */
  .tp-panel { left: auto !important; right: 20px !important; }
</style>
</head>
<body>
  <div class="app-bg"></div>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks starter (must register before app uses it) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Foundation -->
  <script type="text/babel" src="js/icons.jsx"></script>
  <script src="js/data.js"></script>
  <script type="text/babel" src="js/components.jsx"></script>

  <!-- Pages — landing & auth -->
  <script type="text/babel" src="js/pages/landing.jsx"></script>
  <script type="text/babel" src="js/pages/auth.jsx"></script>

  <!-- App pages — stubs registered first, real pages override -->
  <script type="text/babel" src="js/pages/_stubs.jsx"></script>
  <script type="text/babel" src="js/pages/dashboard.jsx"></script>
  <script type="text/babel" src="js/pages/devices.jsx"></script>
  <script type="text/babel" src="js/pages/device-detail.jsx"></script>
  <script type="text/babel" src="js/pages/device-form.jsx"></script>
  <script type="text/babel" src="js/pages/subscriptions.jsx"></script>
  <script type="text/babel" src="js/pages/subscription-detail.jsx"></script>
  <script type="text/babel" src="js/pages/subscription-form.jsx"></script>
  <script type="text/babel" src="js/pages/wishlist.jsx"></script>
  <script type="text/babel" src="js/pages/wishlist-detail.jsx"></script>
  <script type="text/babel" src="js/pages/wishlist-form.jsx"></script>
  <script type="text/babel" src="js/pages/reminders.jsx"></script>
  <script type="text/babel" src="js/pages/stats.jsx"></script>
  <script type="text/babel" src="js/pages/settings.jsx"></script>

  <!-- Router last -->
  <script type="text/babel" src="js/app.jsx"></script>
</body>
</html>
