# Lint, typecheck và build Next.js website (backend + UI).
name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

# Cancel in-flight runs for the same ref.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: lint • typecheck • build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # src/lib/auth-cookie.ts throws at import when this is missing, and `next
      # build` imports it while collecting page data — so a build needs the
      # variable even though nothing encrypts a session here. This placeholder
      # only exists to let the build run; it is never used at runtime and the
      # real secret lives in the deployment's .env.
      SESSION_SECRET: "ci-build-placeholder-not-a-real-secret-0123456789"
      GO_API_URL: "http://127.0.0.1:4000/api"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
