# Build + test WarrlyKit Swift package (thư viện chia sẻ cho iOS app).
name: ios

on:
  # Manual re-run: a macOS runner can wedge in the middle of `swift test`, and
  # without this trigger the only way back was an empty commit.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

# Cancel in-flight runs for the same ref.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-build:
    name: swift build
    # macOS 14 images were retired on 2026-11-02; jobs targeting the old label
    # are rejected before a runner is assigned ("configuration ... is not
    # supported"). `macos-15` is one of the supported arm64 labels.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Swift build (WarrlyKit)
        run: swift build

      - name: Swift test (WarrlyKit)
        run: swift test
