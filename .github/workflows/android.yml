# Assemble debug APK của Android app (Kotlin + Compose, AGP 8.x).
name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

# Cancel in-flight runs for the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: assemble debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # v3 installed the legacy `tools` package, which Google removed
        # from the SDK repository, so the action itself failed before the
        # build ever started. (comment belongs to the step above)

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # compileSdk 36 is not guaranteed preinstalled on the runner image.
      # Ask for it explicitly so the build never depends on what the image
      # happens to ship.
      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # :app:testDebugUnitTest used to report NO-SOURCE (no src/test existed),
      # so a green run proved nothing. Fail loudly if the report is ever empty.
      - name: Verify unit tests actually ran
        run: |
          shopt -s nullglob
          results=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::error:::app:testDebugUnitTest produced no test results (NO-SOURCE) — refusing to pass silently."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "${results[@]}" | grep -o '[0-9]*' | awk '{n+=$1} END {print n+0}')
          echo "Executed $total unit tests across ${#results[@]} classes."
          if [ "$total" -eq 0 ]; then
            echo "::error::The unit test report contains zero tests."
            exit 1
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
