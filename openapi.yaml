openapi: 3.0.3
info:
  title: WarrantyVault API
  description: |
    REST API for native mobile clients (iOS / Android) of WarrantyVault.
    Source-of-truth for client codegen:
      - iOS:     swift-openapi-generator
      - Android: openapi-generator-cli (kotlin)
    The web app continues to use Next.js Server Actions — those are NOT
    documented here.

    Auth: bearer token from POST /api/v1/auth/login (or /register). Send as
    `Authorization: Bearer <token>` on every authenticated request.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://warrantyvault.example.com
    description: Production (set when deployed)

tags:
  - { name: auth }
  - { name: devices }
  - { name: warranties }
  - { name: attachments }
  - { name: subscriptions }
  - { name: wishlist }
  - { name: push }
  - { name: catalog }
  - { name: ai }

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '200':
          description: Email already taken (returns generic message; do not infer)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, message: { type: string } }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/forgot:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset link by email
      description: |
        Always returns `{ ok: true }` regardless of whether the email is
        registered (avoids user enumeration). Sends an email containing a
        time-limited reset link to the address if it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Cập nhật hồ sơ — chỉ tên hiển thị
      description: |
        Partial profile update. `displayName` is the ONLY accepted field; the
        account email **cannot be changed here** (and is not supported anywhere
        yet — it needs a two-step verification flow, deliberately out of scope).
        A body carrying `email` / `newEmail` is rejected with 400 and a
        `fieldErrors` entry saying so, rather than silently ignored.

        Clearing: `"displayName": null`, `""`, or only whitespace all set the
        name to null. A missing `displayName` key is 400 (`Thiếu displayName`),
        not a silent no-op.

        Response mirrors `GET /api/v1/auth/me` (`{ "user": ... }`) plus a
        Vietnamese `message`, so a client can replace its cached user object
        directly from the PATCH response. Rate-limited per user like every other
        authenticated write (60 req/60s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [auth]
      summary: Permanently delete the authenticated user's account
      description: |
        Cascades the user's owned rows (Device / Subscription / Wishlist /
        Session / PasswordReset) in a single statement and best-effort
        removes the on-disk encrypted attachments. Requires the current
        password in the body for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Confirm a password-reset link by setting a new password
      description: |
        Takes the raw token from the `/forgot` link, finds the PasswordReset
        row by `sha256(token)`, updates the user's password hash, marks every
        outstanding reset row used, and revokes ALL of the user's Sessions
        (the password change kicks all devices off). Transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: Form-fill catalog (categories, brands, stores, warranty providers)
      responses:
        '200':
          description: Catalog bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }

  /api/v1/devices:
    get:
      tags: [devices]
      parameters:
        - name: q
          in: query
          description: Case- and accent-insensitive substring match on name, brand, model or serialNumber.
          schema: { type: string }
        - name: category
          in: query
          description: 'Category code. The sentinel `ALL` (or an empty value) means "no filter".'
          schema: { type: string }
        - name: status
          in: query
          description: |
            Device status. The sentinel `ALL` (or an empty value) means "no filter".
            Go does not validate this value — anything else is passed straight to the
            `status = $n` predicate, so an unknown value simply matches nothing.
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST, ALL]
        - name: sort
          in: query
          description: 'Defaults to purchaseDate; an unknown value falls back to purchaseDate (Go never rejects it).'
          schema: { type: string, enum: [purchaseDate, warrantyEndDate, price, name] }
        - name: dir
          in: query
          description: 'Defaults to desc; any value other than asc is treated as desc (Go never rejects it).'
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { device: { $ref: '#/components/schemas/Device' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [devices]
      responses:
        '200':
          description: Device with warranties + attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { device: { $ref: '#/components/schemas/Device' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/warranties:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [warranties]
      responses:
        '200':
          description: Warranties for the device
          content:
            application/json:
              schema:
                type: object
                properties:
                  warranties:
                    type: array
                    items: { $ref: '#/components/schemas/Warranty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [warranties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { warranty: { $ref: '#/components/schemas/Warranty' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/devices/{id}/attachments:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [attachments]
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentMeta' }
    post:
      tags: [attachments]
      summary: Upload an attachment (multipart/form-data)
      description: |
        Accepted types are decided by magic bytes, not the filename:
        JPEG / PNG / WEBP / GIF / HEIC / **PDF**. SVG, HTML and JS are rejected on
        purpose (they can carry executable content). Max 5 MB per file, 5 files
        per device, 100 MB total per user.

        Note: PDF is accepted *as an attachment* but is not supported by the OCR
        endpoint (`/api/v1/ai/extract-receipt`), which is image-only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/warranties/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [warranties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { warranty: { $ref: '#/components/schemas/Warranty' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [warranties]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/warranties/{id}/reminder:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [warranties]
      summary: Dismiss the expiry reminder for this warranty
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [warranties]
      summary: Restore the expiry reminder
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/v1/attachments/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [attachments]
      summary: Sửa mô tả của file đính kèm
      description: |
        Updates the attachment's `description` — the only mutable field; the file
        bytes themselves cannot be edited (delete + re-upload instead).

        Ownership is resolved through the owning `Device` (the query joins
        `Attachment.deviceId = Device.id AND Device.userId = :currentUser`), so an
        id that belongs to someone else matches no row and returns **404**, never
        403 — same "confirm nothing" policy as `GET /api/files/{id}`.

        Clearing: `"description": null`, `""` or whitespace-only all set it to
        null, mirroring the upload-time normalization. There is no length cap
        beyond the request-body size (the upload path has none either).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentDescriptionInput' }
      responses:
        '200':
          description: Updated attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [attachments]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/files/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [attachments]
      summary: Stream an encrypted attachment (decrypted on the fly)
      parameters:
        - { name: download, in: query, schema: { type: string, enum: [ '1' ] } }
      responses:
        '200':
          description: File bytes (Content-Type matches the attachment)
          content:
            'application/octet-stream':
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/subscriptions:
    get:
      tags: [subscriptions]
      parameters:
        - name: status
          in: query
          description: |
            Filter by subscription status. Omit the parameter (or send an empty value)
            to get every status. Unlike `/api/v1/devices` there is no `ALL` sentinel:
            any other value is rejected with 400 `bad_input` and a Vietnamese field
            error on `status`.
          schema: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { subscription: { $ref: '#/components/schemas/Subscription' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/subscriptions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [subscriptions]
      responses:
        '200':
          description: Subscription detail with payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { subscription: { $ref: '#/components/schemas/Subscription' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [subscriptions]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/v1/subscriptions/{id}/payments:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties: { payment: { $ref: '#/components/schemas/Payment' } }

  /api/v1/subscriptions/{id}/renew:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [subscriptions]
      summary: Manually mark subscription as renewed (logs payment + advances renewalDate)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/wishlist:
    get:
      tags: [wishlist]
      parameters:
        - name: status
          in: query
          description: |
            Filter by wishlist status. Omit the parameter (or send an empty/blank value)
            to get every status. There is no `ALL` sentinel: any other value is rejected
            with 400 `bad_input` and a Vietnamese field error on `status`.
          schema: { type: string, enum: [WATCHING, DECIDED, SKIPPED, PURCHASED] }
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WishlistItem' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [wishlist]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishlistInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { item: { $ref: '#/components/schemas/WishlistItem' } }

  /api/v1/wishlist/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [wishlist]
      summary: Item + price history (newest first)
      responses:
        '200':
          description: Item with price history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [wishlist]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishlistInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [wishlist]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/v1/wishlist/{id}/prices:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [wishlist]
      summary: Log a price observation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceLogInput' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  /api/v1/push:
    get:
      tags: [push]
      responses:
        '200':
          description: This user's registered push subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/PushSubscriptionMeta' }

  /api/v1/push/register:
    post:
      tags: [push]
      summary: Register a push token (web / apns / fcm)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/WebPushInput'
                - $ref: '#/components/schemas/NativePushInput'
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }

  /api/v1/push/test:
    post:
      tags: [push]
      summary: Send a sample notification to every registered subscription
      description: |
        Dispatches a test notification through the push fanout (web / APNs /
        FCM) to every PushSubscription the caller owns. Subscriptions the
        upstream gateway reports as gone (404/410, FCM UNREGISTERED) are
        deleted as a side effect, matching the cron's gone-detection.
      responses:
        '200':
          description: Send counts
          content:
            application/json:
              schema:
                type: object
                required: [sent, failed]
                properties:
                  sent:
                    type: integer
                    minimum: 0
                    description: Subscriptions the dispatcher accepted
                  failed:
                    type: integer
                    minimum: 0
                    description: Subscriptions that errored (including gone rows that were deleted)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/push/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      tags: [push]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/stats:
    get:
      tags: [stats]
      summary: Aggregate dashboard stats for the current user
      description: |
        Returns devices / subscriptions / wishlist totals and per-status
        breakdowns. `subscriptions.totalMonthlyVnd` is normalized to a per-month
        VND amount across MONTHLY (price), QUARTERLY (price/3), YEARLY (price/12),
        and CUSTOM (price * 30 / intervalDays); LIFETIME and non-ACTIVE subs are
        excluded. `wishlist.totalCurrentPriceWatching` sums `currentPrice` for
        items in WATCHING or DECIDED.
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup/export:
    get:
      tags: [backup]
      summary: Download the authenticated user's full data graph as JSON
      description: |
        Streams a single JSON file containing devices, warranties, reminders,
        attachments (metadata + base64 IV / wrapped key), wishlist + price
        history, subscriptions + payment history. Schema version 5.
        Response sets `Content-Disposition: attachment; filename=...`.

        The attachment BLOBS are not in the file — only metadata. The payload
        says so explicitly via `includesAttachmentBytes: false` and
        `attachmentBytesNote` (Vietnamese), so a client can warn the user that
        restoring onto a new server will not bring invoice images back.
      responses:
        '200':
          description: Backup payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupV1' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup/import:
    post:
      tags: [backup]
      summary: Restore a backup JSON into the authenticated user's account
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [merge, replace], default: merge }
          description: |
            `merge` skips rows whose ids already exist for this user.
            `replace` wipes the user's existing devices / subscriptions /
            wishlist first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupV1' }
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Body exceeded the 50 MB upload cap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/reminders:
    get:
      tags: [reminders]
      summary: Upcoming warranty reminders for the current user
      description: |
        Returns warranties whose `endDate` is within `[today, today + withinDays]`,
        whose owning device has `status = ACTIVE`, and which have not been
        dismissed via `Reminder.isDismissed`. Sorted by `endDate asc`.
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Lookahead horizon in days. Default 30, max 365.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Reminder list
          content:
            application/json:
              schema:
                type: object
                required: [reminders]
                properties:
                  reminders:
                    type: array
                    items: { $ref: '#/components/schemas/ReminderWarranty' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cron/warranty-check:
    post:
      tags: [cron]
      security: []
      summary: Run the daily warranty + subscription + wishlist notification sweep
      description: |
        Internal endpoint triggered by a scheduler (systemd timer, Vercel Cron, or
        equivalent). Authenticated via `Authorization: Bearer ${CRON_SECRET}` —
        not the user bearer scheme. Fans out warranty-expiry, wishlist target-date,
        wishlist periodic check-in, and subscription renewal notifications, plus
        auto-bills overdue ACTIVE subscriptions. Idempotent for billing
        (filters by `renewalDate <= now`); see `internal/cron/run.go` for the
        per-bucket idempotency notes.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string, example: 'Bearer <CRON_SECRET>' }
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  warrantyNotified: { type: integer }
                  wishlistTargetNotified: { type: integer }
                  wishlistIntervalNotified: { type: integer }
                  subsBilled: { type: integer }
                  subsExpired: { type: integer }
                  subsRenewalNotified: { type: integer }
        '401': { description: 'Missing or wrong CRON_SECRET' }

  /api/v1/ai/extract-receipt:
    post:
      tags: [ai]
      summary: OCR một ảnh hoá đơn / phiếu bảo hành, trả về DRAFT để người dùng xác nhận (không tự lưu)
      description: >
        Nhận ảnh (multipart file HOẶC attachmentId của ảnh đã upload), gửi qua
        dịch vụ AI để trích xuất thông tin thiết bị + bảo hành, trả về bản nháp.
        KHÔNG bao giờ tạo Device — client tự điền form và người dùng xác nhận.
        Cần ANTHROPIC_API_KEY trên server; nếu chưa cấu hình trả về 503.
        CHỈ hỗ trợ ảnh JPEG/PNG/WEBP (tối đa 5MB): file đính kèm có thể là PDF,
        GIF hoặc HEIC nhưng OCR các định dạng đó KHÔNG được hỗ trợ trong phiên
        bản này — gửi lên sẽ nhận 400 "Chỉ hỗ trợ ảnh JPEG, PNG hoặc WEBP".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentId]
              properties:
                attachmentId: { type: string, description: 'ID ảnh đã upload (reuse decrypt path). Nếu file không phải JPEG/PNG/WEBP ⇒ 400.' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'Ảnh JPEG/PNG/WEBP, tối đa 5MB' }
      responses:
        '200':
          description: Bản nháp (chưa lưu)
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: '#/components/schemas/DraftDevice' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Người dùng chưa bật opt-in AI (ai_optin_required)' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: 'Lỗi dịch vụ AI (ai_upstream)' }
        '503': { description: 'Tính năng chưa được bật (feature_disabled)' }

  /api/v1/ai/opt-in:
    get:
      tags: [ai]
      summary: Trạng thái opt-in quét hoá đơn AI của người dùng
      responses:
        '200':
          description: Trạng thái hiện tại
          content:
            application/json:
              schema:
                type: object
                properties: { aiOptIn: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [ai]
      summary: Bật/tắt opt-in quét hoá đơn AI (ảnh sẽ gửi tới dịch vụ AI bên thứ ba)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200':
          description: Trạng thái mới
          content:
            application/json:
              schema:
                type: object
                properties: { aiOptIn: { type: boolean } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
    AuthSuccess:
      description: Authenticated, returns access token + user
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresAt, user]
            properties:
              accessToken: { type: string }
              expiresAt: { type: string, format: date-time }
              user: { $ref: '#/components/schemas/User' }
    BadInput:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing / invalid / expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found (or owned by another user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Limit reached (per-user / per-resource cap exceeded)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Stable code, e.g. unauthorized, not_found, bad_input, rate_limited, limit_reached' }
        message: { type: string, description: 'Human-readable Vietnamese message' }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    DraftDevice:
      type: object
      description: >
        Bản nháp trích xuất từ ảnh hoá đơn / phiếu bảo hành. Tên trường khớp
        DeviceInput để client điền thẳng vào form. Mọi trường đều nullable. Các
        *Id chỉ được set khi map chắc chắn với danh mục; còn lại giữ free-text và
        liệt kê trong `unmatched`. Bản nháp KHÔNG bao giờ được lưu tự động.
      required: [confidence, unmatched]
      properties:
        name: { type: string, nullable: true }
        category: { type: string, nullable: true, description: 'Mã danh mục nếu map được, ngược lại free-text' }
        brand: { type: string, nullable: true }
        brandId: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber:
          type: string
          nullable: true
          description: |
            Số serial / IMEI đọc được trên ảnh hoặc phiếu — định danh bảo hành
            điện tử ở Việt Nam, nên được đưa thẳng vào `Device.serialNumber`.
            Đã trim. `null` khi ảnh không có/không đọc được, HOẶC khi giá trị dài
            bất thường (> 120 byte — rác OCR); trường hợp sau được liệt kê trong
            `unmatched` để client yêu cầu người dùng tự nhập.
        purchaseDate: { type: string, nullable: true, description: 'YYYY-MM-DD' }
        purchasePrice: { type: integer, format: int64, nullable: true, description: 'VND' }
        purchasePlace: { type: string, nullable: true }
        storeId: { type: string, nullable: true }
        warrantyMonths:
          type: integer
          minimum: 0
          maximum: 120
          nullable: true
          description: |
            Số tháng bảo hành đọc được. Bị chặn trong khoảng [0, 120] (10 năm):
            giá trị âm hoặc > 120 do model trả về sẽ bị BỎ (thành `null`) và ghi
            vào `unmatched`, không bao giờ chuyển thẳng vào form. 0 = không có
            bảo hành (đúng như form thủ công: "Để 0 nếu không có").
        warrantyProviderId: { type: string, nullable: true }
        confidence: { type: string, enum: [high, medium, low] }
        unmatched:
          type: array
          items: { type: string }
          description: |
            Tên các trường cần người dùng tự kiểm tra: free-text không khớp danh
            mục (`brand`, `purchasePlace`, `category`), hoặc giá trị bị loại vì vô
            lý (`serialNumber`, `warrantyMonths`).

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        aiOptIn: { type: boolean, description: 'Người dùng đã bật tính năng quét hoá đơn AI (mặc định false)' }

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, maxLength: 80, nullable: true }
        deviceLabel: { type: string, maxLength: 80, nullable: true }
        platform: { type: string, enum: [ios, android, web], nullable: true }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        deviceLabel: { type: string, maxLength: 80, nullable: true }
        platform: { type: string, enum: [ios, android, web], nullable: true }

    ForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    # Body of PATCH /api/v1/auth/me. Email change is NOT part of this contract.
    UpdateProfileInput:
      type: object
      description: |
        Chỉ `displayName` được chấp nhận. Đổi email chưa được hỗ trợ (cần luồng
        xác minh 2 bước) — gửi thêm `email`/`newEmail` sẽ trả 400 kèm
        `fieldErrors`.
      required: [displayName]
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 80
          description: |
            Tên hiển thị mới. `null`, chuỗi rỗng hoặc chỉ khoảng trắng ⇒ XOÁ tên
            (`User.name` trở thành null). Giới hạn 80 **byte** UTF-8, đúng bằng
            giới hạn của bước đăng ký (tên tiếng Việt có dấu tốn nhiều byte hơn
            số ký tự). Giá trị được trim trước khi lưu.

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
        confirmPassword: { type: string, minLength: 1 }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: 'Raw token from the /forgot reset link' }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, description: 'Current password — required for confirmation' }

    BackupV1:
      type: object
      description: |
        Schema version 5 of the user-data backup. Round-trip stable: an
        export can be re-imported on a fresh account in `replace` mode to
        get an identical row set.

        **Honesty about attachments (roadmap #2).** The export carries
        attachment *metadata* only — never the encrypted blob bytes. Restoring
        onto a fresh server therefore does NOT bring invoice images back; the
        blobs live under `PRIVATE_UPLOAD_ROOT` and additionally need
        `FILE_MASTER_KEY` to decrypt. `includesAttachmentBytes` /
        `attachmentBytesNote` state this inside the payload itself so a client
        can warn accurately instead of hardcoding the assumption. Both fields
        are export-only metadata: the import endpoint ignores them, and a
        payload that omits them still imports (older exports stay restorable).
      required: [version, exportedAt, devices, wishlist, subscriptions]
      properties:
        version:
          type: integer
          enum: [5]
          description: |
            Phiên bản định dạng. Import chấp nhận **mọi** phiên bản trong khoảng
            [MinBackupVersion, BackupVersion] (hiện tại 5-5) thay vì so bằng đúng,
            nên một lần tăng version sau này không làm file cũ của người dùng
            thành không đọc được. Payload mới hơn (ví dụ 6) bị từ chối với thông
            báo tiếng Việt nói rõ phiên bản nhận được; payload quá cũ cũng vậy.
        exportedAt: { type: string, format: date-time }
        includesAttachmentBytes:
          type: boolean
          enum: [false]
          description: |
            Luôn `false` ở định dạng v5: payload KHÔNG chứa nội dung ảnh/hoá đơn,
            chỉ có metadata (`fileName`, `fileType`, `fileSize`, `iv`,
            `wrappedKey`) và `storagePath` của thiết bị. Đổi thành `true` là thay
            đổi định dạng (zip kèm blob) — chưa làm.
        attachmentBytesNote:
          type: string
          description: 'Câu tiếng Việt giải thích `includesAttachmentBytes` để client hiển thị thẳng cho người dùng.'
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/BackupSubscription' }
        wishlist:
          type: array
          items: { $ref: '#/components/schemas/BackupWishlistItem' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/BackupDevice' }

    BackupSubscription:
      type: object
      required: [id, name, billingCycle, price, currency, startedAt, renewalDate, autoRenew, status, createdAt, updatedAt, payments]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string }
        intervalDays: { type: integer, nullable: true }
        price: { type: integer }
        currency: { type: string }
        startedAt: { type: string, format: date-time }
        renewalDate: { type: string, format: date-time }
        autoRenew: { type: boolean }
        status: { type: string }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        lastNotifiedRenewalAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Mốc chống trùng thông báo gia hạn của cron. Được export/import nguyên
            vẹn: nếu thiếu, lần chạy cron kế tiếp sẽ nhắc lại các mốc 3/1/0 ngày
            mà người dùng đã được nhắc. Null = chưa từng nhắc.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [id, amount, paidAt]
            properties:
              id: { type: string }
              amount: { type: integer }
              paidAt: { type: string, format: date-time }
              note: { type: string, nullable: true }

    BackupWishlistItem:
      type: object
      required: [id, name, priority, status, createdAt, updatedAt, prices]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, format: date-time, nullable: true }
        priority: { type: string }
        status: { type: string }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, nullable: true }
        lastNotifiedAt: { type: string, format: date-time, nullable: true }
        purchasedDeviceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        prices:
          type: array
          items:
            type: object
            required: [id, price, recordedAt]
            properties:
              id: { type: string }
              price: { type: integer }
              note: { type: string, nullable: true }
              recordedAt: { type: string, format: date-time }

    BackupDevice:
      type: object
      required: [id, name, category, purchaseDate, purchasePrice, status, createdAt, updatedAt, warranties, attachments]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time }
        purchasePrice: { type: integer }
        purchasePlace: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          format: date-time
          nullable: true
          description: 'Thời điểm bán (migration 0006). Vắng mặt/null trong file backup cũ = chưa bán, vẫn import được.'
        soldPrice: { type: integer, nullable: true, description: 'Giá bán, VND. Null = chưa bán.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warranties:
          type: array
          items:
            type: object
            required: [id, type, startDate, endDate, months, createdAt, updatedAt, reminders]
            properties:
              id: { type: string }
              type: { type: string }
              provider: { type: string, nullable: true }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              months: { type: integer }
              cost: { type: integer, nullable: true }
              address: { type: string, nullable: true }
              phone: { type: string, nullable: true }
              notes: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
              reminders:
                type: array
                items:
                  type: object
                  required: [id, isDismissed, createdAt]
                  properties:
                    id: { type: string }
                    isDismissed: { type: boolean }
                    lastNotifiedAt:
                      type: string
                      format: date-time
                      nullable: true
                      description: |
                        Mốc cron đã gửi nhắc lần cuối (chống trùng, migration
                        0002). Được export/import nguyên vẹn — thiếu nó thì lần
                        cron kế tiếp sẽ nhắc lại bảo hành người dùng đã được nhắc.
                        Null = chưa từng nhắc.
                    createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items:
            type: object
            required: [id, fileName, storagePath, fileType, fileSize, iv, wrappedKey, uploadedAt]
            properties:
              id: { type: string }
              fileName: { type: string }
              storagePath: { type: string, description: '<deviceId>/<uuid>.enc' }
              fileType: { type: string }
              fileSize: { type: integer }
              iv: { type: string, description: 'base64-encoded 12-byte IV' }
              wrappedKey: { type: string, description: 'base64-encoded wrapped per-file key' }
              description: { type: string, nullable: true }
              uploadedAt: { type: string, format: date-time }

    ImportResult:
      type: object
      required: [imported, skipped, wishlistImported, wishlistSkipped, subImported, subSkipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        wishlistImported: { type: integer }
        wishlistSkipped: { type: integer }
        subImported: { type: integer }
        subSkipped: { type: integer }

    DeviceStatus:
      type: string
      enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST]

    WarrantyType:
      type: string
      enum: [STANDARD, EXTENDED, THIRD_PARTY]

    Device:
      type: object
      required: [id, name, category, purchaseDate, purchasePrice, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time }
        purchasePrice: { type: integer, description: 'VND, integer' }
        purchasePlace: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Thời điểm bán (resale, roadmap #12). `null` = chưa bán hoặc chưa ghi
            nhận. Luôn đi kèm `soldPrice` — write path từ chối payload chỉ có một
            trong hai trường.

            Định dạng trả về giống hệt `purchaseDate`/`createdAt` (cột
            `timestamp without time zone`, ngữ nghĩa UTC):
            `YYYY-MM-DDTHH:MM:SS[.fff]` — **không** có hậu tố `Z`/offset. Ví dụ
            `"2026-03-01T00:00:00"`. (Trong file backup JSON thì ngược lại:
            `soldAt` ở đó dùng RFC3339 kèm `Z`.)
        soldPrice:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Giá bán, VND (số nguyên). `null` = chưa bán. Lãi/lỗ = soldPrice −
            purchasePrice (client tự tính; API không trả sẵn).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # `GET /api/v1/devices` row: the stored Device plus two projection fields
    # hydrated per row by services.ListDevices (api/internal/services/devices.go).
    DeviceListItem:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [attachmentCount]
          properties:
            attachmentCount:
              type: integer
              description: 'Number of encrypted attachments on the device (0 when there are none).'
            effectiveWarrantyEnd:
              type: string
              format: date-time
              nullable: true
              description: |
                max(Warranty.endDate) across the device's warranties. Null when the
                device has no warranty with an end date — this is a genuinely
                nullable field (`*time.Time` in Go), not a required string.

    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            attachments:
              type: array
              items: { $ref: '#/components/schemas/AttachmentMeta' }
            warranties:
              type: array
              items: { $ref: '#/components/schemas/WarrantyWithReminders' }

    DeviceInput:
      type: object
      required: [name, category, purchaseDate]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, description: 'YYYY-MM-DD or full ISO' }
        purchasePrice: { type: integer, default: 0 }
        purchasePlace: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          nullable: true
          description: |
            Ngày bán (`YYYY-MM-DD` hoặc ISO đầy đủ), nullable. PHẢI gửi kèm
            `soldPrice`: gửi đúng một trong hai trường ⇒ 400 với
            `fieldErrors.soldAt = ["Thiếu ngày bán"]` (hoặc `fieldErrors.soldPrice`
            ngược lại). Gửi cả hai = `null` để xoá ghi nhận đã bán.
            Giá trị không parse được ⇒ 400 `fieldErrors.soldAt = ["Ngày bán không hợp lệ"]`.
        soldPrice:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Giá bán, VND, nullable. Số âm ⇒ 400 `fieldErrors.soldPrice`. Ràng buộc
            cặp đôi với `soldAt` như trên. Độc lập với `status` — client có thể đặt
            `status: SOLD` mà không cần số liệu bán.
        warrantyMonths: { type: integer, minimum: 0, default: 0, description: 'If > 0, an inline STANDARD warranty is created/updated.' }
        warrantyProvider: { type: string, nullable: true }
        warrantyAddress: { type: string, nullable: true }
        warrantyPhone: { type: string, nullable: true }
        warrantyNotes: { type: string, nullable: true }
        fromWishlistId: { type: string, nullable: true, description: 'Optional. Marks the wishlist item as PURCHASED on success.' }

    Warranty:
      type: object
      required: [id, deviceId, type, startDate, endDate, months]
      properties:
        id: { type: string }
        deviceId: { type: string }
        type: { $ref: '#/components/schemas/WarrantyType' }
        provider: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        months: { type: integer, minimum: 1 }
        cost: { type: integer, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # Warranty rows on `GET /api/v1/devices/{id}` carry their Reminder rows too
    # (services.WarrantyWithReminders). Distinct from `ReminderWarranty`, which is
    # the `/api/v1/reminders` feed (warranty + embedded device).
    WarrantyWithReminders:
      allOf:
        - $ref: '#/components/schemas/Warranty'
        - type: object
          required: [reminders]
          properties:
            reminders:
              type: array
              items: { $ref: '#/components/schemas/Reminder' }

    Reminder:
      type: object
      required: [id, warrantyId, isDismissed]
      properties:
        id: { type: string }
        warrantyId: { type: string }
        isDismissed: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastNotifiedAt: { type: string, format: date-time, nullable: true }

    WarrantyInput:
      type: object
      required: [type, startDate, months]
      properties:
        type: { $ref: '#/components/schemas/WarrantyType' }
        provider: { type: string, nullable: true }
        startDate: { type: string }
        months: { type: integer, minimum: 1 }
        cost: { type: integer, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    AttachmentMeta:
      type: object
      required: [id, fileName, fileType, fileSize, uploadedAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer, description: 'plaintext bytes' }
        description: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time }

    # Body of PATCH /api/v1/attachments/{id}.
    AttachmentDescriptionInput:
      type: object
      description: |
        Chỉ `description` được chấp nhận (các trường khác ⇒ 400, kể cả tên file).
      required: [description]
      properties:
        description:
          type: string
          nullable: true
          description: |
            Mô tả mới. `null`, chuỗi rỗng hoặc chỉ khoảng trắng ⇒ XOÁ mô tả
            (`description` trở thành null). Giá trị được trim trước khi lưu.

    Subscription:
      type: object
      required: [id, name, billingCycle, price, startedAt, renewalDate, autoRenew, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string, enum: [MONTHLY, QUARTERLY, YEARLY, LIFETIME, CUSTOM] }
        intervalDays: { type: integer, nullable: true }
        price: { type: integer, description: 'VND per cycle' }
        currency: { type: string, default: 'VND' }
        startedAt: { type: string, format: date-time }
        renewalDate: { type: string, format: date-time }
        autoRenew: { type: boolean }
        status: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        lastNotifiedRenewalAt:
          type: string
          format: date-time
          nullable: true
          description: 'Set by the renewal-notification cron; null until the first renewal push goes out.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubscriptionDetail:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }

    SubscriptionInput:
      type: object
      required: [name, billingCycle, price, startedAt, autoRenew]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string, enum: [MONTHLY, QUARTERLY, YEARLY, LIFETIME, CUSTOM] }
        intervalDays: { type: integer, minimum: 1, nullable: true, description: 'Required when billingCycle=CUSTOM' }
        price: { type: integer, minimum: 0 }
        startedAt: { type: string }
        renewalDate: { type: string, nullable: true, description: 'Defaults to nextRenewalDate(startedAt, billingCycle)' }
        autoRenew: { type: boolean }
        status: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Payment:
      type: object
      required: [id, subscriptionId, amount, paidAt]
      properties:
        id: { type: string }
        subscriptionId: { type: string }
        amount: { type: integer }
        paidAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [amount, paidAt]
      properties:
        amount: { type: integer, minimum: 0 }
        paidAt: { type: string }
        note: { type: string, maxLength: 500, nullable: true }

    WishlistItem:
      type: object
      required: [id, name, priority, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, format: date-time, nullable: true }
        priority: { type: string, enum: [MUST, WANT, MAYBE] }
        status: { type: string, enum: [WATCHING, DECIDED, SKIPPED, PURCHASED] }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, nullable: true }
        lastNotifiedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Set by the wishlist check-in cron; null until the first check-in push goes out.'
        purchasedDeviceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WishlistItemDetail:
      allOf:
        - $ref: '#/components/schemas/WishlistItem'
        - type: object
          properties:
            prices:
              type: array
              items: { $ref: '#/components/schemas/WishlistPrice' }

    WishlistDetail:
      type: object
      required: [item, prices]
      properties:
        item: { $ref: '#/components/schemas/WishlistItem' }
        prices:
          type: array
          description: Price history, newest first.
          items: { $ref: '#/components/schemas/WishlistPrice' }

    WishlistPrice:
      type: object
      required: [id, itemId, price, recordedAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        price: { type: integer }
        note: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }

    WishlistInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, nullable: true }
        priority: { type: string, enum: [MUST, WANT, MAYBE] }
        status: { type: string, enum: [WATCHING, DECIDED, SKIPPED, PURCHASED] }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, minimum: 1, nullable: true }

    PriceLogInput:
      type: object
      required: [price]
      properties:
        price: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500, nullable: true }

    PushSubscriptionMeta:
      type: object
      required: [id, endpoint, platform, createdAt]
      properties:
        id: { type: string }
        endpoint: { type: string }
        platform: { type: string, enum: [web, apns, fcm] }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WebPushInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        platform: { type: string, enum: [web], default: 'web' }
        endpoint: { type: string, format: uri }
        p256dh: { type: string }
        auth: { type: string }
        userAgent: { type: string, maxLength: 500, nullable: true }

    NativePushInput:
      type: object
      required: [platform, token]
      properties:
        platform: { type: string, enum: [apns, fcm] }
        token: { type: string, minLength: 8, maxLength: 4096 }
        userAgent: { type: string, maxLength: 500, nullable: true }

    Catalog:
      type: object
      required: [categories, brands, stores, warrantyProviders]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        brands:
          type: array
          items:
            type: object
            required: [id, name, categoryCodes]
            properties:
              id: { type: string }
              name: { type: string }
              categoryCodes:
                type: array
                items: { type: string }
        stores:
          type: array
          items:
            type: object
            required: [id, name, type]
            properties:
              id: { type: string }
              name: { type: string }
              type: { type: string }
        warrantyProviders:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              phone: { type: string, nullable: true }
              address: { type: string, nullable: true }
              websiteUrl: { type: string, nullable: true }
              notes: { type: string, nullable: true }

    UserStats:
      type: object
      required: [devices, subscriptions, wishlist]
      properties:
        devices:
          type: object
          required: [total, byStatus, totalPurchasePrice, totalWarrantyCost]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST]
              properties:
                ACTIVE: { type: integer }
                EXPIRED: { type: integer }
                SOLD: { type: integer }
                BROKEN: { type: integer }
                LOST: { type: integer }
            totalPurchasePrice: { type: integer, description: 'VND, integer' }
            totalWarrantyCost:
              type: integer
              description: 'Sum of Warranty.cost across every warranty on the user''s devices (VND). Always present: 0 when the user has no device or no warranty carries a cost — a warranty row with a null cost contributes 0. int64 on the server; never narrowed to int32.'
        subscriptions:
          type: object
          required: [total, byStatus, totalMonthlyVnd]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [ACTIVE, PAUSED, CANCELED, EXPIRED]
              properties:
                ACTIVE: { type: integer }
                PAUSED: { type: integer }
                CANCELED: { type: integer }
                EXPIRED: { type: integer }
            totalMonthlyVnd:
              type: integer
              description: 'Sum of monthly-equivalent VND across ACTIVE, non-LIFETIME subs'
        wishlist:
          type: object
          required: [total, byStatus, totalCurrentPriceWatching]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [WATCHING, DECIDED, SKIPPED, PURCHASED]
              properties:
                WATCHING: { type: integer }
                DECIDED: { type: integer }
                SKIPPED: { type: integer }
                PURCHASED: { type: integer }
            totalCurrentPriceWatching:
              type: integer
              description: 'Sum of currentPrice for items in WATCHING or DECIDED'

    ReminderWarranty:
      allOf:
        - $ref: '#/components/schemas/Warranty'
        - type: object
          required: [device]
          properties:
            device:
              type: object
              required: [id, name, category]
              properties:
                id: { type: string }
                name: { type: string }
                category: { type: string }
