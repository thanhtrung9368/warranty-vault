  /api/v1/subscriptions/audit:
    get:
      tags: [subscriptions]
      summary: Tự soát subscription — gói bị bỏ quên / tăng giá / trùng nhau (chỉ tư vấn)
      description: |
        Đọc **lịch sử thanh toán** để rút ra kết luận, thay vì chỉ hiển thị nó.
        Thuần SQL + Go, **không AI**, tất định và giải thích được từng dòng.

        ### ⚠️ Endpoint này KHÔNG sửa gì cả

        Không huỷ, không tắt `autoRenew`, không đổi giá, không ghi hàng nào.
        `advisory` luôn là `true`. Biến một phát hiện thành hành động là cú click
        của người dùng, qua các endpoint subscription đã có
        (`PATCH /api/v1/subscriptions/{id}`, `POST /api/v1/subscriptions/{id}/renew`).

        ### Trung thực về "dùng" — điều dữ liệu KHÔNG nói được

        App **không có tín hiệu sử dụng nào**: không telemetry, không đọc được
        giao dịch ngân hàng (roadmap §5 đã loại vì không có API tiêu dùng công
        khai), và schema không có gì ghi "dịch vụ này đã được mở". Vì vậy phát
        hiện **không** được gọi là "bạn không dùng gói này". Nó được gọi đúng
        tên: **"lâu rồi không thấy ghi nhận gì"**.

        Hai tín hiệu duy nhất tồn tại, và cả hai nói về việc **GHI NHẬN**, không
        phải việc dùng:
          * `SubscriptionPayment.note = 'Auto-renew'` — đúng chuỗi mà cron ghi
            khi tự trừ tiền (`internal/cron/run.go`). Tách được khoản máy trừ
            với khoản người dùng tự ghi.
          * các trường của `Subscription`, chỉ đổi khi người dùng sửa.

        ### Ba luật, và ngưỡng của chúng

        | `kind` | Điều kiện | Ngưỡng (hằng số trong Go) |
        |---|---|---|
        | `QUIET_AUTO_RENEW` | `ACTIVE` · `autoRenew = true` · không `LIFETIME` · **0 khoản do người dùng tự ghi** · số khoản máy tự trừ ≥ 3 · khoản tự trừ **đầu tiên** cách đây ≥ 6 tháng | `AuditQuietMinAutoCharges = 3`, `AuditQuietMinMonths = 6` |
        | `PRICE_INCREASED` | giá tăng giữa **hai kỳ thanh toán liền kề** (LAG trên toàn bộ lịch sử). Báo **mọi** mức tăng; `material` = `false` khi dưới 5% | `AuditPriceRiseMinPercent = 5` |
        | `DUPLICATE` | hai subscription `ACTIVE` cùng người dùng, **cùng tên sau khi bỏ dấu/viết thường** (`SAME_NAME`), hoặc **cùng hãng + cùng loại** (`SAME_BRAND_CATEGORY`). Loại trừ `LIFETIME` ở **cả hai** phía | — (không có ngưỡng) |

        * Đếm một mình sẽ gắn cờ gói `QUARTERLY` sau 9 tháng và gói `MONTHLY` sau
          3 tháng; yêu cầu thêm "khoản tự trừ đầu tiên ≥ 6 tháng" khiến luật có
          cùng ý nghĩa với mọi chu kỳ.
        * `AuditUpcomingRenewalDays = 14`: cửa sổ để một phát hiện còn hành động
          được trước khi tiền bị trừ; trả về trong `nextRenewalAt`/`daysUntilRenewal`.
        * So khớp trùng tên dùng `public.wv_unaccent` — đúng hàm mà tìm kiếm
          thiết bị đang dùng — nên "iCloud+" khớp "icloud+" và "Điện thoại" khớp
          "dien thoai" mà không cần thêm một bản chuẩn hoá thứ tư.
        * "Trùng nhau" ở đây nghĩa là **cùng đang hoạt động** (`ACTIVE`); schema
          không có ngày kết thúc cho một gói đang chạy, nên đó là định nghĩa
          "chồng lấn" duy nhất dữ liệu biểu diễn được.

        ### Vì sao tính ở server

        Phần **phát hiện** ở server, phần **hiển thị** ở client. Ba lý do cụ thể:
        (1) cần `wv_unaccent`, chỉ có trong Postgres; (2) cần `LAG` trên toàn bộ
        lịch sử thanh toán — làm ở client là N+1 query; (3) ngưỡng là quyết định
        sản phẩm, và ba client phải ra **cùng một lời khuyên** cho cùng một tài
        khoản. Giá trị ngưỡng được trả về trong `thresholds` để client hiển thị
        đúng luật đã áp dụng thay vì một phán quyết vô căn cứ.
      responses:
        '200':
          description: Báo cáo tự soát (chỉ tư vấn)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionAudit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

