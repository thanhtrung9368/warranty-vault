  /api/v1/claims:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [claims]
      summary: Yêu cầu bảo hành của người gọi, mới nhất trước
      description: |
        Danh sách yêu cầu bảo hành thuộc tài khoản đang đăng nhập, sắp xếp theo
        `openedAt` **giảm dần** (mới nhất trước); hai yêu cầu mở cùng ngày được
        phân xử ổn định bằng `createdAt`. Luôn trả `claims: []` khi chưa có yêu
        cầu nào — không bao giờ `null`.

        Bộ lọc giống `GET /api/v1/devices`: giá trị rỗng (hoặc sentinel `ALL`)
        nghĩa là **không lọc**. `deviceId` lạ / không thuộc tài khoản trả danh
        sách rỗng chứ không 404. `status` không hợp lệ cũng chỉ khớp rỗng —
        endpoint không từ chối giá trị lạ (cùng chính sách với device list).
        Muốn lấy yêu cầu của một thiết bị, `GET /api/v1/devices/{id}` cũng đã
        trả `claims` lồng sẵn, cùng thứ tự.
      parameters:
        - name: deviceId
          in: query
          description: 'Chỉ lấy yêu cầu của một thiết bị. Rỗng hoặc `ALL` = không lọc.'
          schema: { type: string }
        - name: status
          in: query
          description: |
            Lọc theo trạng thái. Sentinel `ALL` (hoặc rỗng) = không lọc; giá trị
            khác enum được truyền thẳng xuống SQL và chỉ đơn giản là không khớp
            dòng nào (không phải 400).
          schema:
            type: string
            enum: [OPEN, IN_REPAIR, RESOLVED, REJECTED, CANCELLED, ALL]
      responses:
        '200':
          description: Claim list
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [claims]
      summary: Tạo yêu cầu bảo hành
      description: |
        Tạo một yêu cầu mới. `deviceId` phải là thiết bị của người gọi (không thì
        **404**, không phải 403: id của người khác không được xác nhận là tồn
        tại). `warrantyId` không bắt buộc; nếu có, gói bảo hành phải **thuộc đúng
        thiết bị đó**, không thì 400 với `fieldErrors.warrantyId` — kể cả khi gói
        thuộc người dùng nhưng gắn thiết bị khác.

        `status` bỏ trống ⇒ `OPEN`. `openedAt` bỏ trống ⇒ **bây giờ**. Nếu
        `status` đã là trạng thái kết thúc (`RESOLVED` / `REJECTED` /
        `CANCELLED`) thì `closedAt` được server đặt tự động — client **không
        được**, và không cần, gửi giá trị này.

        **Tối đa một yêu cầu `OPEN` hoặc `IN_REPAIR` trên mỗi thiết bị.** Yêu
        cầu thứ hai trả **409 `limit_reached`**. Luật được bảo đảm bằng partial
        unique index `Claim_one_open_per_device_idx` (migration 0021) nên hai
        request đồng thời cũng không thể cùng lọt; service chỉ kiểm tra trước để
        trả lời thân thiện. Trần mỗi người dùng là **1000** yêu cầu, cũng trả 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { claim: { $ref: '#/components/schemas/Claim' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `limit_reached`. Hai trường hợp, cùng một code:

            * thiết bị đã có yêu cầu đang mở (`OPEN`/`IN_REPAIR`) — một chiếc
              máy không thể nằm ở hai cửa hàng cùng lúc;
            * tài khoản đã đạt trần **1000** yêu cầu.

            `message` được dịch theo ngôn ngữ của request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/claims/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [claims]
      summary: Một yêu cầu bảo hành
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema:
                type: object
                properties: { claim: { $ref: '#/components/schemas/Claim' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [claims]
      summary: Thay thế toàn bộ yêu cầu bảo hành
      description: |
        **Full replacement**, cùng quy ước với các PATCH khác: trường nullable bỏ
        trống (hoặc `null`) là **xoá**. Hai ngoại lệ có chủ ý, vì chúng là lịch
        sử chứ không phải cấu hình:

        * `openedAt` bỏ trống ⇒ **giữ ngày mở đã lưu** (không đặt lại thành bây
          giờ). Gửi giá trị cụ thể thì thay.
        * `status` bỏ trống ⇒ **giữ trạng thái đã lưu**. Nếu không, một client
          cũ/PATCH thiếu trường sẽ vô tình mở lại hoặc đóng yêu cầu.

        `deviceId` bắt buộc và phải là thiết bị của người gọi; đổi sang thiết bị
        khác được phép, miễn là thiết bị đó thuộc tài khoản. `warrantyId` nếu có
        phải thuộc **thiết bị mới** — không thì 400 `fieldErrors.warrantyId`.

        **`closedAt` do server quản lý.** Khi `status` chuyển vào
        `RESOLVED`/`REJECTED`/`CANCELLED`, server đặt `closedAt`; khi chuyển lại
        `OPEN`/`IN_REPAIR`, server xoá về `null`. Giữ nguyên trạng thái kết thúc
        thì ngày kết thúc cũ được giữ, không bị đẩy về hiện tại. Client gửi
        `closedAt` cũng được chấp nhận nhưng **bị bỏ qua** trên đường API (bản
        backup thì bảo toàn giá trị đã lưu — xem `BackupClaim`).

        Chuyển sang `OPEN`/`IN_REPAIR` khi thiết bị đích đã có yêu cầu đang mở
        khác trả **409 `limit_reached`**; áp dụng cả khi đổi `deviceId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { claim: { $ref: '#/components/schemas/Claim' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `limit_reached`. Yêu cầu đang được chuyển sang `OPEN`/`IN_REPAIR`
            nhưng thiết bị đích đã có một yêu cầu đang mở khác (kể cả khi yêu cầu
            đó vừa được chuyển sang thiết bị này). Cùng partial unique index với
            POST, nên hai PATCH đồng thời cũng không thể cùng lọt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [claims]
      summary: Xoá yêu cầu bảo hành
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    patch:
      tags: [attachments]
      summary: Sửa mô tả của file đính kèm
      description: |
        Updates the attachment's `description` — the only mutable field; the file
        bytes themselves cannot be edited (delete + re-upload instead). In
        particular this endpoint still REJECTS a `deviceId`: gán thiết bị là
        `POST /api/v1/attachments/{id}/file`, một endpoint riêng.

        Ownership is stored on the row (`Attachment.userId`, migration 0018), so
        this works for an **inbox item** (`deviceId` NULL) exactly like a filed
        one, and an id that belongs to someone else matches no row and returns
        **404**, never 403 — same "confirm nothing" policy as
        `GET /api/files/{id}`.

        Clearing: `"description": null`, `""` or whitespace-only all set it to
        null, mirroring the upload-time normalization. There is no length cap
        beyond the request-body size (the upload path has none either).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentDescriptionInput' }
      responses:
        '200':
          description: Updated attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [attachments]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/files/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [attachments]
      summary: Stream an encrypted attachment (decrypted on the fly)
      parameters:
        - { name: download, in: query, schema: { type: string, enum: [ '1' ] } }
      responses:
        '200':
          description: File bytes (Content-Type matches the attachment)
          content:
            'application/octet-stream':
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/subscriptions:
    # `lang` on this path is part of Phase 1 of docs/I18N_PLAN.md: the
    # subscriptions slice renders `message` / `fieldErrors` in the request's
    # language, so the parameter is no longer an auth-only switch.
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [subscriptions]
      parameters:
        - name: status
          in: query
          description: |
            Filter by subscription status. Omit the parameter (or send an empty value)
            to get every status. Unlike `/api/v1/devices` there is no `ALL` sentinel:
            any other value is rejected with 400 `bad_input` and a `status` field
            error in the language of the request (`Invalid status` / `Trạng thái
            không hợp lệ`).
          schema: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { subscription: { $ref: '#/components/schemas/Subscription' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/subscriptions/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [subscriptions]
      responses:
        '200':
          description: Subscription detail with payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: '#/components/schemas/SubscriptionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '200':
