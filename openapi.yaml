    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    patch:
      tags: [attachments]
      summary: Sửa mô tả của file đính kèm
      description: |
        Updates the attachment's `description` — the only mutable field; the file
        bytes themselves cannot be edited (delete + re-upload instead). In
        particular this endpoint still REJECTS a `deviceId`: gán thiết bị là
        `POST /api/v1/attachments/{id}/file`, một endpoint riêng.

        Ownership is stored on the row (`Attachment.userId`, migration 0018), so
        this works for an **inbox item** (`deviceId` NULL) exactly like a filed
        one, and an id that belongs to someone else matches no row and returns
        **404**, never 403 — same "confirm nothing" policy as
        `GET /api/files/{id}`.

        Clearing: `"description": null`, `""` or whitespace-only all set it to
        null, mirroring the upload-time normalization. There is no length cap
        beyond the request-body size (the upload path has none either).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentDescriptionInput' }
      responses:
