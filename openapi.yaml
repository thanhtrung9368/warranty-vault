  /api/v1/stats:
    get:
      tags: [stats]
      summary: Aggregate dashboard stats for the current user
      description: |
        Returns devices / subscriptions / wishlist totals and per-status
        breakdowns. `subscriptions.totalMonthlyVnd` is normalized to a per-month
        VND amount across MONTHLY (price), QUARTERLY (price/3), YEARLY (price/12),
        and CUSTOM (price * 30 / intervalDays); LIFETIME and non-ACTIVE subs are
        excluded. `wishlist.totalCurrentPriceWatching` sums `currentPrice` for
        items in WATCHING or DECIDED.
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/forecast:
    get:
      tags: [stats]
      summary: Dự báo chi tiêu các tháng tới (subscription + mốc bảo hành + wishlist)
      description: |
        Nửa **nhìn về phía trước** của app. Trả về một cửa sổ `months` tháng kể từ
        hôm nay, chia theo từng tháng, gồm: các kỳ gia hạn subscription sắp bị trừ,
        các gói bảo hành sắp hết hạn, và các mốc ngày của wishlist.

        **Endpoint riêng, không nhét vào `/api/v1/stats`.** `/stats` là một round
        trip mà cả ba client đang dùng và hình dạng của nó không được đổi; phép tính
        ở đây cần thêm ba query và một vòng lặp theo từng kỳ gia hạn, nên client nào
        không mở thẻ dự báo thì không phải trả giá cho nó.

        ### Quy tắc tiền tệ

        * Một kỳ gia hạn tính đúng `price` **một lần**, không quy đổi ra tháng. Nhịp
          gia hạn lấy từ `nextRenewalDate` — cùng một hàm mà cron và cả ba client
          dùng.
        * `LIFETIME` đóng góp **0** và không bao giờ xuất hiện như một khoản bị trừ
          (kể cả khoản 0) — đúng như `MonthlyEquivalent` và `stats.sql`.
        * `CUSTOM` thiếu `intervalDays` (hoặc <= 0) bị **bỏ hoàn toàn**: không có
          lịch thì không có khoản nào, kể cả kỳ hiện tại.
        * Chỉ subscription `ACTIVE` được tính.
        * `subscriptionTotalVnd` là tổng **int64** (giá từng hàng là int32, tổng
          không bao giờ bị thu hẹp).
        * `subscriptionMonthlyAverageVnd` là con số **quy đổi tháng** theo đúng công
          thức canonical — nó **bằng** `subscriptions.totalMonthlyVnd` của
          `GET /api/v1/stats` với cùng dữ liệu. Dùng nó cho dòng "~X/tháng"; **không**
          dùng nó để tính tổng 12 tháng.

        ### Quy tắc chia tháng (bucket)

        * Cửa sổ là `[windowStart, windowEnd)` = `[hôm nay, hôm nay + months tháng]`
          theo đúng phép cộng tháng của `nextRenewalDate` (cuối tháng tràn ngày giống
          nhau ở cả ba client).
        * `buckets` gồm **các tháng lịch (UTC) mà cửa sổ chạm tới**, bắt đầu từ tháng
          hiện tại: thường là `months + 1` phần tử (tháng hiện tại tính một phần, cộng
          `months` tháng đủ), và đúng `months` phần tử khi thời điểm gọi rơi đúng
          00:00 ngày 1. Tháng lẻ phía cuối được liệt kê có chủ ý: nếu cắt ở mốc
          `startOfMonth + months` thì một gói MONTHLY gia hạn ngày 1 sẽ chỉ hiện 11
          trong 12 kỳ.
        * Mỗi bucket là **nửa khoảng** `[đầu tháng, đầu tháng sau)`: một khoản rơi
          đúng 00:00 ngày 1 thuộc **tháng đó**, không phải tháng trước.
        * Khoản rơi đúng `windowEnd` **không thuộc bucket nào** (cửa sổ đóng ở bên
          phải).
        * **Tháng hiện tại là một phần**: chỉ tính từ `windowStart` trở đi, nên một
          khoản đã trừ hôm mùng 1 là quá khứ, không phải dự báo. Tháng cuối cũng là
          một phần nếu `windowEnd` rơi giữa tháng.
        * `renewalDate` đã ở quá khứ được **cuộn tới kỳ kế tiếp** (giống cron khi
          auto-charge), nên khoản đầu tiên luôn là khoản sắp xảy ra.

        ### Chắc chắn trả hay có thể phát sinh

        `subscriptionAutoRenewVnd` là phần **sẽ bị trừ tự động**
        (`autoRenew = true`); chênh lệch so với `subscriptionVnd` là các gói người
        dùng phải tự gia hạn. `warrantyExpiringVnd` (giá gói cũ, tham chiếu để dành
        tiền) và `wishlistTargetVnd` (giá ghi nhận gần nhất) là **có thể phát sinh**,
        không phải khoản chắc chắn trả — đừng cộng chúng vào tổng subscription khi
        hiển thị.
      parameters:
        - name: months
          in: query
          required: false
          description: |
            Độ dài cửa sổ tính bằng tháng, `1`–`24`. Mặc định `12`. Giá trị không
            phải số, ngoài khoảng, hoặc có phần thập phân → 400 kèm `fieldErrors.months`
            (không âm thầm dùng mặc định).
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Forecast window with per-month buckets and upcoming milestones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup/export:
    get:
      tags: [backup]
      summary: Download the authenticated user's full data graph (JSON, or .zip kèm ảnh)
      description: |
        Mặc định (`includeBlobs` vắng mặt hoặc `false`): stream **một file JSON**
        chứa devices, warranties, reminders, attachments (metadata + IV /
        wrappedKey base64), wishlist + lịch sử giá, subscriptions + lịch sử thanh
        toán. Phiên bản schema **5** — không đổi so với trước. Response có
        `Content-Disposition: attachment; filename=...`.

        Với `includeBlobs=true`: stream **một file .zip** (`application/zip`,
        filename `.zip`) chứa:
          * `attachments/<storagePath>` — nội dung **đã mã hoá** (AES-256-GCM) của
            từng file đính kèm, đúng byte như trên đĩa (không base64, không nén);
          * `data.json` — envelope phiên bản **6** với
            `includesAttachmentBytes: true` và `attachmentBytesNote` tiếng Việt.
        Nhờ vậy khôi phục sang máy chủ mới mang theo được ảnh hoá đơn — thứ mà bản
        JSON chỉ có metadata không làm được.

        **Sự thật không đổi:** blob là ciphertext, khoá riêng của từng file được
        bọc bằng `FILE_MASTER_KEY`. Khôi phục sang máy chủ thiếu hoặc khác
        `FILE_MASTER_KEY` vẫn ghi lại được dòng dữ liệu và byte, nhưng **không giải
        mã được** — `attachmentBytesNote` nói rõ điều này và kết quả import trả về
        `attachmentsUnreadable`. Đừng hứa với người dùng rằng file backup là tự đủ.

        Nếu một blob không còn trên đĩa lúc export, nó **không** được đưa vào
        archive; id của nó nằm trong `missingAttachmentIds` (và được nhắc trong
        `attachmentBytesNote`) thay vì âm thầm biến mất.
      parameters:
        - name: includeBlobs
          in: query
          required: false
          description: |
            `true` để nhận file `.zip` kèm nội dung ảnh/hoá đơn đã mã hoá thay vì
            JSON chỉ có metadata. Mặc định `false` — hành vi và định dạng JSON y
            như trước. Chỉ nhận `true`/`false` (và `1`/`0`); giá trị khác trả 400.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: |
            `includeBlobs` vắng/false ⇒ JSON (BackupV1, version 5).
            `includeBlobs=true` ⇒ ZIP: `data.json` (version 6) + các entry
            `attachments/...`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupV1' }
            application/zip:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup/import:
    post:
      tags: [backup]
      summary: Restore a backup (JSON metadata, hoặc .zip kèm nội dung ảnh)
      description: |
        Nhận **một trong hai** định dạng, phân biệt bằng magic bytes (`PK\x03\x04`)
        chứ không bằng Content-Type (client hay gửi `application/octet-stream`):

          * **JSON** (`BackupV1`, version 5 hoặc 6) — như trước, chỉ metadata.
            Giới hạn body **50 MB**.
          * **ZIP** do `GET /api/v1/backup/export?includeBlobs=true` tạo ra —
            `data.json` + các entry `attachments/<storagePath>`. Giới hạn body
            **110 MB** (trần upload mỗi người dùng là 100 MB + manifest).

        Import **riêng file `data.json`** của một archive như vậy bị từ chối 400
        kèm hướng dẫn chọn chính file `.zip`: envelope đó khai báo
        `includesAttachmentBytes: true`, nên nhận nó một mình sẽ khôi phục dòng dữ
        liệu mà mất hết ảnh — đúng thứ định dạng blob sinh ra để tránh.

        ZIP được kiểm tra trước khi ghi bất cứ thứ gì: tên entry phải là
        `data.json` hoặc một `storagePath` hợp lệ, mỗi blob ≤ 5 MB, tổng blob
        ≤ 100 MB, `data.json` ≤ 16 MB, và mọi attachment khai báo trong manifest
        phải có entry tương ứng. Ràng buộc của write path được tôn trọng:
        **tối đa 5 file đính kèm / thiết bị** và **tổng 100 MB / người dùng** —
        file bị sửa vượt các ngưỡng này bị từ chối 400 chứ không tạo ra trạng thái
        mà upload thường không cho phép.

        **Id xung đột với tài khoản khác ⇒ 400, không phải 500.** Mọi bảng dùng
        khoá chính text **toàn cục**; file của tài khoản khác sẽ đụng khoá chính.
        Endpoint từ chối trước khi mở transaction, kèm message tiếng Việt nêu rõ
        id và loại thực thể. (Id thuộc chính người đang import được bỏ qua ở chế
        độ `merge` và bị xoá trước ở chế độ `replace`, nên không bị coi là xung
        đột.) Chọn **từ chối** thay vì **đổi id**: đổi id phải viết lại toàn bộ đồ
        thị id (device → warranty → reminder, attachment, wishlist → price,
        subscription → payment) và cả `storagePath` trên đĩa vốn chứa device id —
        sai một cạnh là hỏng âm thầm; đồng thời nó phá tính idempotent của `merge`
        (import lại cùng file sẽ nhân đôi dữ liệu).
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [merge, replace], default: merge }
          description: |
            `merge` skips rows whose ids already exist for this user.
            `replace` wipes the user's existing devices / subscriptions /
            wishlist first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupV1' }
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  result: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Body exceeded the cap (50 MB for JSON, 110 MB for a .zip)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: |
            The payload would break the per-user device ceiling. Importing adds
            device rows, so `services.assertBackupDeviceQuota` refuses a file that
            would push the account past 50 active or 500 stored devices. In
            `replace` mode the base count is zero, so restoring an at-the-limit
            account onto itself is allowed; in `merge` mode ids already owned by
            this user are not counted twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/reminders:
    get:
      tags: [reminders]
      summary: Upcoming warranty reminders for the current user
      description: |
        Mặc định (`includeDismissed` vắng mặt hoặc `false`): trả về các gói bảo
        hành có `endDate` trong `[hôm nay, hôm nay + withinDays]`, thuộc thiết bị
        `status = ACTIVE`, và chưa bị ẩn qua `Reminder.isDismissed`. Sắp xếp theo
        `endDate asc`. Đây đúng là hành vi cũ, không đổi.

        Với `includeDismissed=true`, các reminder **đã ẩn** được trả thêm vào cùng
        mảng `reminders[]`:
          * **Không áp dụng `withinDays`** cho reminder đã ẩn — một reminder ẩn từ
            nhiều năm trước vẫn nằm trong danh sách "Đã ẩn". Kích thước phản hồi
            vẫn bị chặn bởi giới hạn ghi (500 thiết bị lưu trữ, tính cả đã bán, ×
            5 bảo hành = tối đa 2500 gói bảo hành / người dùng — trần 500 mới là
            trần ràng buộc ở đây, vì thiết bị đã bán vẫn giữ bảo hành).
          * **Không áp dụng điều kiện `status = ACTIVE`** cho reminder đã ẩn — một
            reminder bị ẩn trên thiết bị sau đó đã bán / hỏng / mất vẫn hiển thị,
            kèm `device.status` để client vẽ badge.
        Các dòng KHÔNG bị ẩn vẫn giữ nguyên điều kiện cửa sổ thời gian + thiết bị
        ACTIVE ở cả hai chế độ, nên cờ này chỉ *thêm* dòng, không bao giờ làm mất
        dòng.

        Phân biệt dòng ẩn: mỗi dòng có `isDismissed` (top-level). Trường này chỉ
        xuất hiện khi `true`; client đọc thiếu trường thì hiểu là `false`. Vì vậy
        phản hồi của chế độ mặc định giữ nguyên hình dạng cũ (không có khoá
        `isDismissed`).
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Lookahead horizon in days. Default 30, max 365. Chỉ áp dụng cho reminder CHƯA bị ẩn.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: includeDismissed
          in: query
          required: false
          description: |
            `true` để trả thêm reminder đã ẩn (mục "Đã ẩn"). Mặc định `false` —
            hành vi và hình dạng phản hồi y như trước. Chỉ nhận `true`/`false`
            (và `1`/`0`); giá trị khác trả 400.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Reminder list
          content:
            application/json:
              schema:
                type: object
                required: [reminders]
                properties:
                  reminders:
                    type: array
                    items: { $ref: '#/components/schemas/ReminderWarranty' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/return-windows:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [devices]
      summary: Thiết bị còn hạn đổi/trả ("1 đổi 1"), kèm deadline đã tính sẵn
      description: |
        Danh sách thiết bị **còn cửa sổ đổi/trả** — thứ quyết định một máy lỗi
        ngay khi nhận được **đổi mới** hay chỉ được **sửa**, và là mốc duy nhất
        trong app mà bỏ lỡ thì mất tiền trực tiếp.

        ### Vì sao là endpoint riêng, không nằm trong `/api/v1/reminders`

        * `/api/v1/reminders` là cửa sổ **nhìn tới** trên `Warranty.endDate`
          ("cái gì sắp hết"). Hạn đổi/trả là "cái gì **còn đang mở**" — một
          khoảng bắt đầu từ ngày nhận hàng, có thể đã trôi qua vài tuần. Nhét
          chung vào `withinDays` sẽ khiến một tham số mang hai nghĩa.
        * Hình dạng phản hồi của `/api/v1/reminders` đã bị ba client bind cứng.
          Endpoint này **thêm** một bề mặt thay vì sửa một bề mặt đang chạy —
          cùng lý do đã sinh ra `/api/v1/forecast` thay vì nhồi thêm field vào
          `/api/v1/stats`.

        ### Deadline được TÍNH, không được lưu

        `returnDeadline = COALESCE(receivedAt, purchaseDate) + returnWindowDays ngày`

        * `receivedAt` được ưu tiên vì đơn online thường xuất hoá đơn **trước**
          khi giao máy; đếm từ ngày thực nhận mới đúng.
        * Vì là giá trị dẫn xuất, sửa `receivedAt` hay `returnWindowDays` là
          deadline đổi ngay, và không bao giờ có hai con số lệch nhau.
        * Server trả luôn `daysLeft` để ba client không phải tự chia ngày —
          cùng lý do `effectiveWarrantyEnd` được tính ở server.

        ### Số ngày là DO NGƯỜI DÙNG NHẬP, không có mặc định của server

        `returnWindowDays` là **cấu hình theo từng thiết bị**, không phải một
        hằng số toàn cục, và API **không tự suy ra** giá trị nào:

        * `null` = **chưa biết** (khác hẳn `0` = "cửa hàng không cho đổi trả").
        * Chính sách thật rất khác nhau theo nhóm hàng. Ví dụ đã đọc trực tiếp
          từ chính sách FPT Shop (hiệu lực 01/7/2024): sản phẩm ICT lỗi nhà sản
          xuất `0–30 ngày` được "1 ĐỔI 1" với phí khấu hao 0%; phụ kiện
          `0–365 ngày`; miếng dán màn hình thì không bảo hành, không đổi trả;
          tủ lạnh/máy giặt chỉ hãng Casper mới 1 đổi 1 trong 30 ngày.
        * **Đây KHÔNG phải quy định pháp luật.** Điều 30 Luật Bảo vệ quyền lợi
          người tiêu dùng 19/2023/QH15 chỉ buộc đổi mới hoặc hoàn tiền khi (a)
          hết thời gian bảo hành mà không sửa được, hoặc (b) đã bảo hành từ 3 lần
          trở lên trong thời hạn bảo hành mà vẫn không khắc phục được lỗi. Không
          có điều luật nào cho một cửa sổ đổi trả 30 ngày. Mọi con số ở đây là
          **chính sách của cửa hàng do người dùng ghi lại**.

        ### Nội dung trả về

        Chỉ thiết bị `status = ACTIVE`, chỉ `returnWindowDays > 0`, và chỉ cửa sổ
        **còn mở** (`returnDeadline >= hôm nay`). Sắp xếp theo `returnDeadline`
        tăng dần. Không áp horizon: cửa sổ còn mở thì còn hành động được, và số
        dòng bị chặn bởi hạn mức 50 thiết bị / người dùng. Cửa sổ đã đóng
        **không** được trả về (màn hình "còn hạn đổi trả" không cần lịch sử);
        deadline của một thiết bị bất kỳ vẫn xem được qua
        `GET /api/v1/devices/{id}` → `returnDeadline`.
      responses:
        '200':
          description: Danh sách thiết bị còn hạn đổi/trả
          content:
            application/json:
              schema:
                type: object
                required: [returnWindows]
                properties:
                  returnWindows:
                    type: array
                    description: 'Luôn là mảng, không bao giờ null. Rỗng khi không thiết bị nào còn hạn đổi/trả.'
                    items: { $ref: '#/components/schemas/ReturnWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/actions:
    get:
      tags: [actions]
      summary: 'Hàng đợi "Việc cần xử lý" — những việc app tự suy ra và không tự quyết được'
      description: |
        Danh sách việc **app biết đủ để hỏi nhưng không hỏi**. Mỗi việc được
        **suy ra** từ dữ liệu đã có, không có bảng "việc" nào được ghi thêm:
        bảo hành vừa hết hạn, thiết bị chưa có gói bảo hành, trạng thái thiết bị
        đã cũ, thiếu serial/IMEI, thiếu ảnh hoá đơn, hạn đổi trả sắp hết hoặc
        chưa ghi, subscription sắp bị trừ mà thiếu link huỷ, ngày gia hạn chưa
        được cập nhật sau khi đã ghi nhận thanh toán, wishlist đã qua ngày dự
        kiến mua.

        ### ⚠️ "Bảo hành hết hạn hôm qua" nằm ở ĐÂY, không nằm trong `/reminders`

        `/api/v1/reminders` chỉ nhìn **về phía trước** (`endDate >= hôm nay`), nên
        một gói hết hạn hôm qua biến mất khỏi mọi màn hình. Đó là một **query
        riêng** ở đây (`WARRANTY_EXPIRED`, lùi tối đa 90 ngày), **không** phải
        một tham số mới của feed cũ — hợp đồng của feed cũ giữ nguyên từng byte.

        ### `itemKey` là gì

        `<LOẠI_VIỆC>:<id-thực-thể>`, ví dụ `WARRANTY_EXPIRED:clx1234`. Đây là
        danh tính **ổn định** của một phép suy ra (id thực thể không đổi), và là
        thứ dùng để hoãn việc ở endpoint bên dưới.

        ### Hoãn ("hoãn") sống ở server, không ở máy

        Trạng thái hoãn lưu trong bảng riêng `DecisionSnooze`, khoá theo
        `(userId, itemKey)`, nên **một máy hoãn thì mọi máy đều thấy**.
        Cố ý **KHÔNG** tái dùng bảng `Reminder`: `Reminder.isDismissed` đang là
        **cổng chặn push bảo hành** (xem `warranties.sql`), nên một hàng hoãn
        chung chung ở đó có thể **tắt mất thông báo bảo hành thật**; và `Reminder`
        không có trường thời gian nào để diễn đạt "hoãn 90 ngày".
        `POST /api/v1/warranties/{id}/reminder` vì thế **không** bị ảnh hưởng.

        ### Mặc định và `snoozed`

        * `snoozed` vắng mặt hoặc `false` (mặc định): chỉ trả việc **đang cần
          xử lý**. `counts` đếm đúng tập này.
        * `snoozed=true`: trả **thêm** các việc đang bị hoãn, mỗi dòng có
          `snoozedUntil` (để client vẽ mục "Đang hoãn" và cho bỏ hoãn). Cờ này
          **chỉ thêm dòng, không bao giờ bớt dòng** — cùng hợp đồng với
          `includeDismissed` của `/api/v1/reminders`.
        * `counts` **luôn** đếm tập đang cần xử lý, kể cả khi `snoozed=true`, để
          badge trên dashboard không đổi nghĩa theo cờ.
      parameters:
        - name: snoozed
          in: query
          required: false
          description: |
            `true` để trả thêm các việc đang bị hoãn (kèm `snoozedUntil`).
            Mặc định `false` — chỉ việc đang cần xử lý. Chỉ nhận `true`/`false`
            (và `1`/`0`); giá trị khác trả 400.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Hàng đợi việc cần xử lý
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionQueue' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/actions/{itemKey}/snooze:
    post:
      tags: [actions]
      summary: Hoãn một việc cần xử lý (mặc định 90 ngày), có hiệu lực trên mọi thiết bị
      description: |
        Ẩn một việc khỏi hàng đợi cho tới `now + days`. Trạng thái lưu ở server
        theo `(userId, itemKey)` nên **máy khác đăng nhập cùng tài khoản thấy ngay**
        — đây là lý do không dùng cờ lưu cục bộ.

        * Không có body, hoặc `days` bằng `0`/thiếu → dùng mặc định **90 ngày**
          (đúng "để đó 90 ngày" của một lần chạm).
        * `days` phải trong khoảng `1–365`. Ngoài khoảng → 400 kèm
          `fieldErrors.days`.
        * Hoãn **lại** một việc đã hoãn là hợp lệ và chỉ dời hạn (upsert theo
          `(userId, itemKey)`), không tạo thêm hàng.
        * `itemKey` phải là một việc **thuộc chính người dùng này** và **suy ra
          được từ dữ liệu hiện tại**; nếu không, trả 404. Nhờ vậy bảng hoãn bị
          chặn theo đúng tập việc có thật, và không rò rỉ việc của tài khoản khác.
        * Sai định dạng `itemKey` (không phải `<LOẠI_VIỆC>:<id>`, hoặc loại việc
          không tồn tại) → 400, cố ý **khác** 404 để một lỗi gõ không bị báo thành
          "việc này đã biến mất".
        * **Hoãn ở đây không ảnh hưởng tới thông báo đẩy bảo hành.** Hai cơ chế
          độc lập (bảng `DecisionSnooze` so với `Reminder`).
      parameters:
        - name: itemKey
          in: path
          required: true
          description: '`<LOẠI_VIỆC>:<id>`, ví dụ `WARRANTY_EXPIRED:clx1234`. Dấu `:` hợp lệ trong một path segment nên không cần encode.'
          schema: { type: string, example: 'WARRANTY_EXPIRED:clx1234' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnoozeInput' }
      responses:
        '200':
          description: Đã hoãn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnoozeResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

    delete:
      tags: [actions]
      summary: Bỏ hoãn — việc quay lại hàng đợi ngay
      description: |
        Xoá hàng hoãn của `(userId, itemKey)`. Việc xuất hiện lại ở lần gọi
        `GET /api/v1/actions` kế tiếp. Nếu việc đó **không** đang được hoãn → 404
        (không im lặng trả 200, để client biết trạng thái đã lệch).
      parameters:
        - name: itemKey
          in: path
          required: true
          schema: { type: string, example: 'WARRANTY_EXPIRED:clx1234' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/cron/warranty-check:
    post:
      tags: [cron]
      security: []
      summary: Run the daily warranty + subscription + wishlist notification sweep
      description: |
        Internal endpoint triggered by a scheduler (systemd timer, Vercel Cron, or
        equivalent). Authenticated via `Authorization: Bearer ${CRON_SECRET}` —
        not the user bearer scheme. Fans out warranty-expiry, wishlist target-date,
        wishlist periodic check-in, and subscription renewal notifications, plus
        auto-bills overdue ACTIVE subscriptions. Idempotent for billing
        (filters by `renewalDate <= now`); see `internal/cron/run.go` for the
        per-bucket idempotency notes.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string, example: 'Bearer <CRON_SECRET>' }
      responses:
        '200':
          description: Sweep summary
          content:
            application/json:
              schema:
                type: object
                required: [ok, checkedAt, stats]
                properties:
                  ok: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  stats:
                    type: object
                    description: |
                      Bộ đếm best-effort của một lượt chạy. Một hàng lỗi bị ghi log
                      và bỏ qua, không làm hỏng phần còn lại của job — nên các con số
                      này là "đã xử lý", không phải "đã thành công".
                    required:
                      - warrantyNotices
                      - returnWindowNotices
                      - wishlistTargetHits
                      - wishlistCheckins
                      - subscriptionRenewals
                      - subscriptionExpired
                      - sessionsPruned
                      - pushesSent
                      - pushesFailed
                      - pushesGone
                    properties:
                      warrantyNotices: { type: integer, description: 'Số gói bảo hành rơi vào mốc 7 hoặc 30 ngày trước `endDate`.' }
                      returnWindowNotices: { type: integer, description: 'Số thiết bị rơi vào mốc còn 3 hoặc 1 ngày đổi/trả (`COALESCE(receivedAt, purchaseDate) + returnWindowDays`).' }
                      wishlistTargetHits: { type: integer }
                      wishlistCheckins: { type: integer }
                      subscriptionRenewals: { type: integer, description: 'Số gói đã được tự động gia hạn THẬT trong một transaction (có ghi `SubscriptionPayment`).' }
                      subscriptionExpired: { type: integer }
                      sessionsPruned: { type: integer }
                      pushesSent: { type: integer }
                      pushesFailed: { type: integer }
                      pushesGone: { type: integer, description: 'Push trả 404/410 — hàng `PushSubscription` tương ứng đã bị xoá.' }
        '401': { description: 'Missing or wrong CRON_SECRET' }

  /api/v1/ai/extract-receipt:
    post:
      tags: [ai]
      summary: OCR ảnh hoặc PDF hoá đơn / phiếu bảo hành, trả về DRAFT để người dùng xác nhận (không tự lưu)
      description: >
        Nhận tài liệu (multipart file HOẶC attachmentId của file đã upload), gửi
        qua dịch vụ AI để trích xuất thông tin thiết bị + bảo hành, trả về bản
        nháp. KHÔNG bao giờ tạo Device — client tự điền form và người dùng xác
        nhận. Cần ANTHROPIC_API_KEY trên server; nếu chưa cấu hình trả về 503.

        Hỗ trợ **JPEG/PNG/WEBP và PDF** (mỗi file tối đa 5MB theo giới hạn
        attachment). PDF được gửi dưới dạng `document` block của Anthropic
        Messages API — mọi model đang hoạt động (kể cả model mặc định
        `claude-haiku-4-5-20251001`) đều đọc được PDF, gồm cả ảnh scan từng
        trang; giới hạn phía Anthropic là 32MB và 100 trang mỗi request, và
        attachment 5MB của app luôn nằm trong ngưỡng đó. Số trang KHÔNG được
        kiểm trước (đếm trang phải parse PDF); PDF quá lớn bị phía Anthropic từ
        chối và trả về 502 `ai_upstream`.

        GIF và HEIC vẫn KHÔNG hỗ trợ OCR: upload/đính kèm được nhưng không có
        block type tương ứng, nên bị từ chối sớm bằng 400
        "Chỉ hỗ trợ ảnh JPEG, PNG, WEBP hoặc PDF" trước khi tốn một lượt gọi AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentId]
              properties:
                attachmentId: { type: string, description: 'ID file đã upload (reuse decrypt path). Nếu không phải JPEG/PNG/WEBP/PDF ⇒ 400.' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'Ảnh JPEG/PNG/WEBP hoặc PDF, tối đa 5MB' }
      responses:
        '200':
          description: Bản nháp (chưa lưu)
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: '#/components/schemas/DraftDevice' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Người dùng chưa bật opt-in AI (ai_optin_required)' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: 'Lỗi dịch vụ AI (ai_upstream)' }
        '503': { description: 'Tính năng chưa được bật (feature_disabled)' }

  /api/v1/ai/opt-in:
    get:
      tags: [ai]
      summary: Trạng thái opt-in quét hoá đơn AI của người dùng
      responses:
        '200':
          description: Trạng thái hiện tại
          content:
            application/json:
              schema:
                type: object
                properties: { aiOptIn: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [ai]
      summary: Bật/tắt opt-in quét hoá đơn AI (ảnh sẽ gửi tới dịch vụ AI bên thứ ba)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200':
          description: Trạng thái mới
          content:
            application/json:
              schema:
                type: object
                properties: { aiOptIn: { type: boolean } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

    # The language of the `message` / `fieldErrors` COPY in a response. It is not
    # a resource: it changes no status code, no error code and no field name, so a
    # client that ignores it loses nothing but the localisation.
    #
    # Precedence, first match wins:
    #   1. this parameter (`vi` | `en`)
    #   2. the `Accept-Language` request header (q-weighted, parsed by
    #      golang.org/x/text/language)
    #   3. the caller's stored preference (`User.locale`, set through PATCH
    #      /api/v1/auth/me)
    #   4. `en`
    #
    # A language we do not ship is a FALLBACK, never an error: `?lang=fr` is
    # ignored (the next level decides) and `Accept-Language: fr` gets English with
    # a 200. The response carries `Content-Language` when the request asked for a
    # language at all, so a client can see what it actually got.
    Lang:
      name: lang
      in: query
      required: false
      schema: { type: string, enum: [vi, en] }
      description: |
        Ngôn ngữ của phần chữ trong response (`message`, `fieldErrors`). Thắng cả
        header `Accept-Language` lẫn lựa chọn đã lưu. Giá trị khác `vi`/`en` bị
        bỏ qua (rơi xuống mức kế tiếp), **không** phải lỗi 400.

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean } }
    AuthSuccess:
      description: Authenticated, returns access token + user
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, expiresAt, user]
            properties:
              accessToken: { type: string }
              expiresAt: { type: string, format: date-time }
              user: { $ref: '#/components/schemas/User' }
    BadInput:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing / invalid / expired bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found (or owned by another user)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Limit reached (per-user / per-resource cap exceeded)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 'Stable code, e.g. unauthorized, not_found, bad_input, rate_limited, limit_reached' }
        message: { type: string, description: 'Human-readable message, rendered in the language of the request (see the `lang` parameter; `en` by default)' }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    DraftDevice:
      type: object
      description: >
        Bản nháp trích xuất từ ảnh hoá đơn / phiếu bảo hành. Tên trường khớp
        DeviceInput để client điền thẳng vào form. Mọi trường đều nullable. Các
        *Id chỉ được set khi map chắc chắn với danh mục; còn lại giữ free-text và
        liệt kê trong `unmatched`. Bản nháp KHÔNG bao giờ được lưu tự động.
      required: [confidence, unmatched, warnings]
      properties:
        name: { type: string, nullable: true }
        category: { type: string, nullable: true, description: 'Mã danh mục nếu map được, ngược lại free-text' }
        brand: { type: string, nullable: true }
        brandId: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber:
          type: string
          nullable: true
          description: |
            Số serial / IMEI đọc được trên ảnh hoặc phiếu — định danh bảo hành
            điện tử ở Việt Nam, nên được đưa thẳng vào `Device.serialNumber`.
            Đã trim. `null` khi ảnh không có/không đọc được, HOẶC khi giá trị dài
            bất thường (> 120 byte — rác OCR); trường hợp sau được liệt kê trong
            `unmatched` để client yêu cầu người dùng tự nhập.
        purchaseDate: { type: string, nullable: true, description: 'YYYY-MM-DD' }
        purchasePrice: { type: integer, format: int64, nullable: true, description: 'VND' }
        purchasePlace: { type: string, nullable: true }
        storeId: { type: string, nullable: true }
        warrantyMonths:
          type: integer
          minimum: 0
          maximum: 120
          nullable: true
          description: |
            Số tháng bảo hành đọc được. Bị chặn trong khoảng [0, 120] (10 năm):
            giá trị âm hoặc > 120 do model trả về sẽ bị BỎ (thành `null`) và ghi
            vào `unmatched`, không bao giờ chuyển thẳng vào form. 0 = không có
            bảo hành (đúng như form thủ công: "Để 0 nếu không có").
        warrantyProviderId: { type: string, nullable: true }
        confidence: { type: string, enum: [high, medium, low] }
        unmatched:
          type: array
          items: { type: string }
          description: |
            Tên các trường cần người dùng tự kiểm tra: free-text không khớp danh
            mục (`brand`, `purchasePlace`, `category`), hoặc giá trị bị loại vì vô
            lý (`serialNumber`, `warrantyMonths`).
        warnings:
          type: array
          description: |
            Cảnh báo **không chặn** về giá trị *vẫn được giữ* trong bản nháp — khác
            với `unmatched` (giá trị bị bỏ). Hiện chỉ có các cảnh báo quanh
            `serialNumber`: IMEI 15 số sai checksum Luhn, chuỗi toàn số dài 14/16/17
            (không phải IMEI 15 số), và serial đã tồn tại ở thiết bị khác của cùng
            người dùng. Form nên hiện cảnh báo vàng cạnh ô serial và **vẫn cho lưu**:
            serial không phải lúc nào cũng là IMEI, từ chối một serial hợp lệ còn tệ
            hơn lỗi gõ mà nó ngăn. Luôn có mặt, `[]` khi không có gì.
          items: { $ref: '#/components/schemas/DeviceWarning' }

    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        aiOptIn: { type: boolean, description: 'Người dùng đã bật tính năng quét hoá đơn AI (mặc định false)' }
        locale:
          type: string
          nullable: true
          enum: [en, vi]
          description: |
            Ngôn ngữ người dùng đã chọn (`User.locale`, migration 0014). `null`
            nghĩa là **chưa chọn** — KHÔNG phải "tiếng Anh": request vẫn quyết
            định theo thứ tự `?lang=` → `Accept-Language` → cột này → `en`.

            Field này **vắng mặt** trong response khi người dùng chưa từng chọn
            ngôn ngữ, để response của client cũ không đổi một byte nào. Chỉ nhận
            hai mã hai chữ cái; gửi `vi-VN` thì server lưu `vi`.

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, maxLength: 80, nullable: true }
        deviceLabel: { type: string, maxLength: 80, nullable: true }
        platform: { type: string, enum: [ios, android, web], nullable: true }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        deviceLabel: { type: string, maxLength: 80, nullable: true }
        platform: { type: string, enum: [ios, android, web], nullable: true }

    ForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    # Body of PATCH /api/v1/auth/me. Email change is NOT part of this contract.
    UpdateProfileInput:
      type: object
      description: |
        Chỉ `displayName` được chấp nhận. Đổi email **không** gửi ở đây — có luồng
        riêng hai bước (`POST /api/v1/auth/change-email` rồi
        `POST /api/v1/auth/confirm-email-change`). Gửi thêm `email`/`newEmail` vào
        endpoint này sẽ trả 400 kèm `fieldErrors` chỉ đúng hai endpoint đó.
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 80
          description: |
            Tên hiển thị mới. `null`, chuỗi rỗng hoặc chỉ khoảng trắng ⇒ XOÁ tên
            (`User.name` trở thành null). Giới hạn 80 **byte** UTF-8, đúng bằng
            giới hạn của bước đăng ký (tên tiếng Việt có dấu tốn nhiều byte hơn
            số ký tự). Giá trị được trim trước khi lưu.

            **Vắng mặt ⇒ giữ nguyên** tên đang có (khác hẳn `null`). Đây là quy
            ước ba trạng thái mà `locale` cũng theo, và là lý do hai field này
            độc lập nhau: client cũ chỉ gửi `displayName` vẫn không thể vô tình
            xoá ngôn ngữ đã lưu.
        locale:
          type: string
          nullable: true
          enum: [en, vi]
          description: |
            Ngôn ngữ của chính người dùng. Ba trạng thái:

            * **vắng mặt** ⇒ giữ nguyên giá trị đã lưu;
            * `null` hoặc `""` ⇒ XOÁ (về `null`), tức quay lại để request quyết
              định theo `Accept-Language`;
            * `"en"` / `"vi"` (chấp nhận cả `vi-VN`, `en-US` — lưu mã gốc) ⇒ đặt.

            Giá trị không hỗ trợ (ví dụ `"fr"`) là **400** kèm
            `fieldErrors.locale`, KHÁC với một `Accept-Language: fr` (cái đó chỉ
            rơi về mặc định): đây là một write hỏng, còn kia là một sở thích
            chúng tôi không có.

            Gửi body **rỗng** (không có cả `displayName` lẫn `locale`) là 400.

            Ảnh hưởng: ngôn ngữ của `message`/`fieldErrors` trong mọi response
            sau đó (khi request không nói gì), và ngôn ngữ của **push
            notification** — cron không có request nào để hỏi, nên cột này là
            tín hiệu duy nhất. Xem `components.parameters.Lang`.

    # Body of POST /api/v1/auth/change-email (step 1 of 2).
    ChangeEmailRequest:
      type: object
      required: [newEmail, currentPassword]
      properties:
        newEmail:
          type: string
          format: email
          description: |
            Địa chỉ muốn chuyển sang. Được trim + hạ chữ thường trước khi lưu.
            Nếu đã thuộc tài khoản khác, phản hồi vẫn là 200 trung tính và không
            có email nào được gửi (không tiết lộ địa chỉ tồn tại hay không).
        currentPassword:
          type: string
          minLength: 1
          description: 'Mật khẩu hiện tại của tài khoản. Sai ⇒ 400 với `fieldErrors.currentPassword`.'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
        confirmPassword: { type: string, minLength: 1 }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: 'Raw token from the /forgot reset link' }
        newPassword: { type: string, minLength: 8, maxLength: 200 }

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, description: 'Current password — required for confirmation' }

    BackupV1:
      type: object
      description: |
        Envelope dữ liệu người dùng. Hai định dạng cùng tồn tại:

          * **version 5** — file JSON của `GET /api/v1/backup/export` (mặc định)
            **và** mọi file người dùng đã tải trước đây. Chỉ có metadata của file
            đính kèm, `includesAttachmentBytes: false`.
          * **version 6** — `data.json` **bên trong file .zip** của
            `GET /api/v1/backup/export?includeBlobs=true`, với
            `includesAttachmentBytes: true`; nội dung ảnh nằm ở các entry
            `attachments/<storagePath>` cạnh nó trong archive.

        Round-trip ổn định: export rồi import lại trên tài khoản/database sạch
        (chế độ `replace`) cho cùng tập dòng dữ liệu.

        **Sự thật về file đính kèm.** Bản JSON (v5) KHÔNG chứa nội dung ảnh, nên
        khôi phục sang máy chủ mới sẽ mất ảnh hoá đơn. Bản ZIP (v6) CÓ chứa nội
        dung đã mã hoá, nhưng blob là ciphertext AES-256-GCM với khoá riêng từng
        file được bọc bằng `FILE_MASTER_KEY`: thiếu hoặc sai khoá thì byte vẫn còn
        mà ảnh không mở được. `includesAttachmentBytes` / `attachmentBytesNote`
        nói đúng điều đó ngay trong payload để client cảnh báo chính xác thay vì
        hardcode. Hai trường này là metadata của bản export: import bỏ qua chúng
        khi quyết định, và payload cũ thiếu chúng vẫn import được.

        Import chấp nhận **mọi** phiên bản trong khoảng
        [MinBackupVersion, BackupVersion] (hiện tại 5-6) thay vì so bằng đúng, nên
        việc nâng lên v6 không làm file v5 của người dùng thành rác. Payload mới
        hơn (ví dụ 7) bị từ chối với thông báo tiếng Việt nói rõ phiên bản nhận
        được; payload quá cũ (≤4) cũng vậy.
      required: [version, exportedAt, devices, wishlist, subscriptions]
      properties:
        version:
          type: integer
          enum: [5, 6]
          description: |
            `5` = JSON chỉ metadata (định dạng cũ, vẫn được ghi cho tới khi client
            đổi). `6` = envelope trong file .zip có kèm nội dung ảnh. Import chấp
            nhận cả hai.
        exportedAt: { type: string, format: date-time }
        includesAttachmentBytes:
          type: boolean
          description: |
            `false` ở bản JSON v5: payload KHÔNG chứa nội dung ảnh/hoá đơn, chỉ có
            metadata (`fileName`, `fileType`, `fileSize`, `iv`, `wrappedKey`) và
            `storagePath`. `true` ở `data.json` bên trong file .zip v6: nội dung
            đã mã hoá của từng attachment nằm ở entry
            `attachments/<storagePath>` trong cùng archive.
        attachmentBytesNote:
          type: string
          description: 'Câu tiếng Việt giải thích `includesAttachmentBytes` (và, với bản ZIP, cả yêu cầu `FILE_MASTER_KEY`) để client hiển thị thẳng cho người dùng.'
        missingAttachmentIds:
          type: array
          items: { type: string }
          description: |
            Chỉ có ở bản ZIP: id của những attachment mà **blob không còn trên đĩa**
            lúc export, nên không thể đưa vào archive. Dòng dữ liệu vẫn được export
            và import lại (khôi phục metadata, thiếu byte); trường này để client
            nói thật với người dùng thay vì để họ phát hiện lúc mở hoá đơn. Vắng
            mặt khi mọi blob đều có.
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/BackupSubscription' }
        wishlist:
          type: array
          items: { $ref: '#/components/schemas/BackupWishlistItem' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/BackupDevice' }

    BackupSubscription:
      type: object
      required: [id, name, billingCycle, price, currency, startedAt, renewalDate, autoRenew, status, createdAt, updatedAt, payments]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string }
        intervalDays: { type: integer, nullable: true }
        price: { type: integer }
        currency: { type: string }
        startedAt: { type: string, format: date-time }
        renewalDate: { type: string, format: date-time }
        autoRenew: { type: boolean }
        status: { type: string }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        lastNotifiedRenewalAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Mốc chống trùng thông báo gia hạn của cron. Được export/import nguyên
            vẹn: nếu thiếu, lần chạy cron kế tiếp sẽ nhắc lại các mốc 3/1/0 ngày
            mà người dùng đã được nhắc. Null = chưa từng nhắc.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        payments:
          type: array
          items:
            type: object
            required: [id, amount, paidAt]
            properties:
              id: { type: string }
              amount: { type: integer }
              paidAt: { type: string, format: date-time }
              note: { type: string, nullable: true }

    BackupWishlistItem:
      type: object
      required: [id, name, priority, status, createdAt, updatedAt, prices]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, format: date-time, nullable: true }
        priority: { type: string }
        status: { type: string }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, nullable: true }
        lastNotifiedAt: { type: string, format: date-time, nullable: true }
        purchasedDeviceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        prices:
          type: array
          items:
            type: object
            required: [id, price, recordedAt]
            properties:
              id: { type: string }
              price: { type: integer }
              note: { type: string, nullable: true }
              recordedAt: { type: string, format: date-time }

    BackupDevice:
      type: object
      required: [id, name, category, purchaseDate, purchasePrice, status, createdAt, updatedAt, warranties, attachments]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time }
        purchasePrice: { type: integer }
        purchasePlace: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          format: date-time
          nullable: true
          description: 'Thời điểm bán (migration 0006). Vắng mặt/null trong file backup cũ = chưa bán, vẫn import được.'
        soldPrice: { type: integer, nullable: true, description: 'Giá bán, VND. Null = chưa bán.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        warranties:
          type: array
          items:
            type: object
            required: [id, type, startDate, endDate, months, createdAt, updatedAt, reminders]
            properties:
              id: { type: string }
              type: { type: string }
              provider: { type: string, nullable: true }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              months: { type: integer }
              cost: { type: integer, nullable: true }
              address: { type: string, nullable: true }
              phone: { type: string, nullable: true }
              notes: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
              reminders:
                type: array
                items:
                  type: object
                  required: [id, isDismissed, createdAt]
                  properties:
                    id: { type: string }
                    isDismissed: { type: boolean }
                    lastNotifiedAt:
                      type: string
                      format: date-time
                      nullable: true
                      description: |
                        Mốc cron đã gửi nhắc lần cuối (chống trùng, migration
                        0002). Được export/import nguyên vẹn — thiếu nó thì lần
                        cron kế tiếp sẽ nhắc lại bảo hành người dùng đã được nhắc.
                        Null = chưa từng nhắc.
                    createdAt: { type: string, format: date-time }
        attachments:
          type: array
          items:
            type: object
            required: [id, fileName, storagePath, fileType, fileSize, iv, wrappedKey, uploadedAt]
            properties:
              id: { type: string }
              fileName: { type: string }
              storagePath: { type: string, description: '<deviceId>/<uuid>.enc' }
              fileType: { type: string }
              fileSize: { type: integer }
              iv: { type: string, description: 'base64-encoded 12-byte IV' }
              wrappedKey: { type: string, description: 'base64-encoded wrapped per-file key' }
              description: { type: string, nullable: true }
              uploadedAt: { type: string, format: date-time }

    ImportResult:
      type: object
      required: [imported, skipped, wishlistImported, wishlistSkipped, subImported, subSkipped, attachmentsImported, attachmentsSkipped, attachmentsUnreadable]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        wishlistImported: { type: integer }
        wishlistSkipped: { type: integer }
        subImported: { type: integer }
        subSkipped: { type: integer }
        attachmentsImported:
          type: integer
          description: |
            Số file đính kèm đã ghi ra `PRIVATE_UPLOAD_ROOT` (chỉ khác 0 khi import
            file .zip có kèm nội dung ảnh). Import JSON chỉ metadata luôn trả 0.
        attachmentsSkipped:
          type: integer
          description: |
            Số file đính kèm bị bỏ qua cùng thiết bị của chúng (chế độ `merge`,
            thiết bị đã tồn tại trong tài khoản) — byte cũng không được ghi, nên
            không sinh file mồ côi.
        attachmentsUnreadable:
          type: integer
          description: |
            Số file đính kèm **không dùng được**: hoặc không giải mã được bằng
            `FILE_MASTER_KEY` của máy chủ đang import (kể cả khi máy chủ chưa cấu
            hình khoá — bản backup đến từ máy chủ khác), hoặc manifest đã đánh dấu
            là thiếu blob từ lúc export (`missingAttachmentIds`). Dòng dữ liệu và
            byte vẫn được khôi phục; con số này để client cảnh báo người dùng.

    DeviceStatus:
      type: string
      enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST]

    WarrantyType:
      type: string
      enum: [STANDARD, EXTENDED, THIRD_PARTY]

    Device:
      type: object
      required: [id, name, category, purchaseDate, purchasePrice, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time }
        purchasePrice: { type: integer, description: 'VND, integer' }
        purchasePlace: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Thời điểm bán (resale, roadmap #12). `null` = chưa bán hoặc chưa ghi
            nhận. Luôn đi kèm `soldPrice` — write path từ chối payload chỉ có một
            trong hai trường.

            Định dạng trả về giống hệt `purchaseDate`/`createdAt` (cột
            `timestamp without time zone`, ngữ nghĩa UTC):
            `YYYY-MM-DDTHH:MM:SS[.fff]` — **không** có hậu tố `Z`/offset. Ví dụ
            `"2026-03-01T00:00:00"`. (Trong file backup JSON thì ngược lại:
            `soldAt` ở đó dùng RFC3339 kèm `Z`.)
        soldPrice:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Giá bán, VND (số nguyên). `null` = chưa bán. Lãi/lỗ = soldPrice −
            purchasePrice (client tự tính; API không trả sẵn).
        returnWindowDays:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3650
          description: |
            Số ngày của cửa sổ đổi/trả ("1 đổi 1") của **cửa hàng** đối với thiết
            bị này. Cấu hình **theo từng thiết bị**; API không có giá trị mặc
            định và không tự suy ra từ loại thiết bị.

            * `null` = **chưa biết** (khác hẳn `0`).
            * `0` = cửa hàng **không cho đổi trả**.
            * `> 0` = số ngày kể từ `receivedAt` (hoặc `purchaseDate` nếu chưa có
              `receivedAt`).

            Con số này **không phải quy định pháp luật**: Điều 30 Luật Bảo vệ
            quyền lợi người tiêu dùng 19/2023/QH15 chỉ buộc đổi mới/hoàn tiền khi
            hết hạn bảo hành mà không sửa được, hoặc đã bảo hành ≥ 3 lần mà vẫn
            lỗi. Đây là chính sách của cửa hàng, do người dùng ghi lại. Thực tế
            rất khác nhau (30 ngày cho ICT, 365 ngày cho phụ kiện, 0 cho miếng
            dán màn hình, và với tủ lạnh/máy giặt thì phụ thuộc hãng).
        receivedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Ngày người dùng **thực nhận** thiết bị. Tách khỏi `purchaseDate` vì
            đơn online thường xuất hoá đơn trước khi giao. Khi có, đây là mốc bắt
            đầu của cửa sổ đổi/trả; khi `null`, deadline tính từ `purchaseDate`.
            `null` nghĩa là "chưa ghi", **không** phải "nhận đúng ngày mua".
        returnWindowNotifiedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Dấu chống trùng của cron: lần gần nhất đã đẩy thông báo "sắp hết hạn
            đổi trả" cho thiết bị này. Là chi tiết vận hành — client hiển thị
            hay không đều được. Cùng vai trò với `Reminder.lastNotifiedAt`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # `GET /api/v1/devices` row: the stored Device plus two projection fields
    # hydrated per row by services.ListDevices (api/internal/services/devices.go).
    DeviceListItem:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [attachmentCount]
          properties:
            attachmentCount:
              type: integer
              description: 'Number of encrypted attachments on the device (0 when there are none).'
            effectiveWarrantyEnd:
              type: string
              format: date-time
              nullable: true
              description: |
                max(Warranty.endDate) across the device's warranties. Null when the
                device has no warranty with an end date — this is a genuinely
                nullable field (`*time.Time` in Go), not a required string.
            returnDeadline:
              type: string
              format: date-time
              nullable: true
              description: |
                Hạn đổi/trả **đã tính sẵn**:
                `COALESCE(receivedAt, purchaseDate) + returnWindowDays ngày`.
                `null` khi chưa biết số ngày, khi số ngày là 0, hoặc thiếu
                `purchaseDate`. Tính ở server để ba client không tự chia ngày
                theo ba cách khác nhau.

    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            returnDeadline:
              type: string
              format: date-time
              nullable: true
              description: 'Giống `DeviceListItem.returnDeadline`: hạn đổi/trả đã tính sẵn, `null` khi chưa biết/không áp dụng.'
            attachments:
              type: array
              items: { $ref: '#/components/schemas/AttachmentMeta' }
            warranties:
              type: array
              items: { $ref: '#/components/schemas/WarrantyWithReminders' }

    DeviceInput:
      type: object
      required: [name, category, purchaseDate]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, description: 'YYYY-MM-DD or full ISO' }
        purchasePrice: { type: integer, default: 0 }
        purchasePlace: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        notes: { type: string, nullable: true }
        soldAt:
          type: string
          nullable: true
          description: |
            Ngày bán (`YYYY-MM-DD` hoặc ISO đầy đủ), nullable. PHẢI gửi kèm
            `soldPrice`: gửi đúng một trong hai trường ⇒ 400 với
            `fieldErrors.soldAt = ["Missing sale date"]` (hoặc `fieldErrors.soldPrice`
            ngược lại). Gửi cả hai = `null` để xoá ghi nhận đã bán.
            Giá trị không parse được ⇒ 400 `fieldErrors.soldAt = ["Invalid sale date"]`.

            Chuỗi trong `message`/`fieldErrors` phụ thuộc ngôn ngữ của request
            (`lang`, mặc định `en`) — khoá của `fieldErrors` thì không đổi. Bản
            tiếng Việt của hai câu trên: `["Thiếu ngày bán"]` và
            `["Ngày bán không hợp lệ"]`.
        soldPrice:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Giá bán, VND, nullable. Số âm ⇒ 400 `fieldErrors.soldPrice`. Ràng buộc
            cặp đôi với `soldAt` như trên. Độc lập với `status` — client có thể đặt
            `status: SOLD` mà không cần số liệu bán.
        returnWindowDays:
          type: integer
          nullable: true
          minimum: 0
          maximum: 3650
          description: |
            Số ngày đổi/trả của cửa hàng cho thiết bị này (cấu hình **theo từng
            thiết bị**, không có mặc định của server — xem
            `GET /api/v1/return-windows`). `null` = chưa biết, `0` = không cho đổi
            trả. Ngoài khoảng `0–3650` ⇒ 400
            `fieldErrors.returnWindowDays`. Độc lập với `receivedAt`: gửi cái này
            mà không gửi cái kia vẫn hợp lệ.

            ⚠️ `PATCH /api/v1/devices/{id}` **thay thế toàn bộ** các trường, đúng
            như `soldAt`/`soldPrice`: không gửi `returnWindowDays`/`receivedAt`
            nghĩa là **xoá** cửa sổ đổi/trả đã ghi. Client nào có hiển thị hai
            trường này phải gửi lại đủ.
        receivedAt:
          type: string
          nullable: true
          description: |
            Ngày thực nhận máy (`YYYY-MM-DD` hoặc ISO đầy đủ), nullable. Không
            parse được ⇒ 400 `fieldErrors.receivedAt = ["Invalid delivery
            date"]` (`["Ngày nhận hàng không hợp lệ"]` khi `lang=vi`). Gửi `null`
            để xoá.
        warrantyMonths: { type: integer, minimum: 0, default: 0, description: 'If > 0, an inline STANDARD warranty is created/updated.' }
        warrantyProvider: { type: string, nullable: true }
        warrantyAddress: { type: string, nullable: true }
        warrantyPhone: { type: string, nullable: true }
        warrantyNotes: { type: string, nullable: true }
        fromWishlistId: { type: string, nullable: true, description: 'Optional. Marks the wishlist item as PURCHASED on success.' }

    Warranty:
      type: object
      required: [id, deviceId, type, startDate, endDate, months]
      properties:
        id: { type: string }
        deviceId: { type: string }
        type: { $ref: '#/components/schemas/WarrantyType' }
        provider: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        months: { type: integer, minimum: 1 }
        cost: { type: integer, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # Warranty rows on `GET /api/v1/devices/{id}` carry their Reminder rows too
    # (services.WarrantyWithReminders). Distinct from `ReminderWarranty`, which is
    # the `/api/v1/reminders` feed (warranty + embedded device).
    WarrantyWithReminders:
      allOf:
        - $ref: '#/components/schemas/Warranty'
        - type: object
          required: [reminders]
          properties:
            reminders:
              type: array
              items: { $ref: '#/components/schemas/Reminder' }

    Reminder:
      type: object
      required: [id, warrantyId, isDismissed]
      properties:
        id: { type: string }
        warrantyId: { type: string }
        isDismissed: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastNotifiedAt: { type: string, format: date-time, nullable: true }

    WarrantyInput:
      type: object
      required: [type, startDate, months]
      properties:
        type: { $ref: '#/components/schemas/WarrantyType' }
        provider: { type: string, nullable: true }
        startDate: { type: string }
        months: { type: integer, minimum: 1 }
        cost: { type: integer, nullable: true }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    AttachmentMeta:
      type: object
      required: [id, fileName, fileType, fileSize, uploadedAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        fileType: { type: string }
        fileSize: { type: integer, description: 'plaintext bytes' }
        description: { type: string, nullable: true }
        uploadedAt: { type: string, format: date-time }

    # Body of PATCH /api/v1/attachments/{id}.
    AttachmentDescriptionInput:
      type: object
      description: |
        Chỉ `description` được chấp nhận (các trường khác ⇒ 400, kể cả tên file).
      required: [description]
      properties:
        description:
          type: string
          nullable: true
          description: |
            Mô tả mới. `null`, chuỗi rỗng hoặc chỉ khoảng trắng ⇒ XOÁ mô tả
            (`description` trở thành null). Giá trị được trim trước khi lưu.

    Subscription:
      type: object
      required: [id, name, billingCycle, price, startedAt, renewalDate, autoRenew, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string, enum: [MONTHLY, QUARTERLY, YEARLY, LIFETIME, CUSTOM] }
        intervalDays: { type: integer, nullable: true }
        price: { type: integer, description: 'VND per cycle' }
        currency: { type: string, default: 'VND' }
        startedAt: { type: string, format: date-time }
        renewalDate: { type: string, format: date-time }
        autoRenew: { type: boolean }
        status: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        lastNotifiedRenewalAt:
          type: string
          format: date-time
          nullable: true
          description: 'Set by the renewal-notification cron; null until the first renewal push goes out.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubscriptionDetail:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }

    SubscriptionInput:
      type: object
      required: [name, billingCycle, price, startedAt, autoRenew]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        plan: { type: string, nullable: true }
        billingCycle: { type: string, enum: [MONTHLY, QUARTERLY, YEARLY, LIFETIME, CUSTOM] }
        intervalDays: { type: integer, minimum: 1, nullable: true, description: 'Required when billingCycle=CUSTOM' }
        price: { type: integer, minimum: 0 }
        startedAt: { type: string }
        renewalDate: { type: string, nullable: true, description: 'Defaults to nextRenewalDate(startedAt, billingCycle)' }
        autoRenew: { type: boolean }
        status: { type: string, enum: [ACTIVE, PAUSED, CANCELED, EXPIRED] }
        accountEmail: { type: string, nullable: true }
        paymentMethod: { type: string, nullable: true }
        manageUrl: { type: string, nullable: true }
        cancelUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    Payment:
      type: object
      required: [id, subscriptionId, amount, paidAt]
      properties:
        id: { type: string }
        subscriptionId: { type: string }
        amount: { type: integer }
        paidAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [amount, paidAt]
      properties:
        amount: { type: integer, minimum: 0 }
        paidAt: { type: string }
        note: { type: string, maxLength: 500, nullable: true }

    WishlistItem:
      type: object
      required: [id, name, priority, status]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, format: date-time, nullable: true }
        priority: { type: string, enum: [MUST, WANT, MAYBE] }
        status: { type: string, enum: [WATCHING, DECIDED, SKIPPED, PURCHASED] }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, nullable: true }
        lastNotifiedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Set by the wishlist check-in cron; null until the first check-in push goes out.'
        purchasedDeviceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WishlistItemDetail:
      allOf:
        - $ref: '#/components/schemas/WishlistItem'
        - type: object
          properties:
            prices:
              type: array
              items: { $ref: '#/components/schemas/WishlistPrice' }

    WishlistDetail:
      type: object
      required: [item, prices]
      properties:
        item: { $ref: '#/components/schemas/WishlistItem' }
        prices:
          type: array
          description: Price history, newest first.
          items: { $ref: '#/components/schemas/WishlistPrice' }

    WishlistPrice:
      type: object
      required: [id, itemId, price, recordedAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        price: { type: integer }
        note: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }

    WishlistInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        initialPrice: { type: integer, nullable: true }
        currentPrice: { type: integer, nullable: true }
        buyUrl: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        targetDate: { type: string, nullable: true }
        priority: { type: string, enum: [MUST, WANT, MAYBE] }
        status: { type: string, enum: [WATCHING, DECIDED, SKIPPED, PURCHASED] }
        notes: { type: string, nullable: true }
        reminderIntervalDays: { type: integer, minimum: 1, nullable: true }

    PriceLogInput:
      type: object
      required: [price]
      properties:
        price: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500, nullable: true }

    PushSubscriptionMeta:
      type: object
      required: [id, endpoint, platform, createdAt]
      properties:
        id: { type: string }
        endpoint: { type: string }
        platform: { type: string, enum: [web, apns, fcm] }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WebPushInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        platform: { type: string, enum: [web], default: 'web' }
        endpoint: { type: string, format: uri }
        p256dh: { type: string }
        auth: { type: string }
        userAgent: { type: string, maxLength: 500, nullable: true }

    NativePushInput:
      type: object
      required: [platform, token]
      properties:
        platform: { type: string, enum: [apns, fcm] }
        token: { type: string, minLength: 8, maxLength: 4096 }
        userAgent: { type: string, maxLength: 500, nullable: true }

    Catalog:
      type: object
      required: [categories, brands, stores, warrantyProviders, brandServiceInfo]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
        brands:
          type: array
          items:
            type: object
            required: [id, name, categoryCodes]
            properties:
              id: { type: string }
              name: { type: string }
              categoryCodes:
                type: array
                items: { type: string }
        stores:
          type: array
          items:
            type: object
            required: [id, name, type]
            properties:
              id: { type: string }
              name: { type: string }
              type: { type: string }
        warrantyProviders:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              phone: { type: string, nullable: true }
              address: { type: string, nullable: true }
              websiteUrl: { type: string, nullable: true }
              notes: { type: string, nullable: true }
        brandServiceInfo:
          type: array
          description: |
            Danh bạ theo **hãng**: trang tra cứu trung tâm bảo hành uỷ quyền của chính
            hãng (FEATURE_IDEAS #15, migration 0012). Cùng một cache 60 giây với bốn
            catalog kia, nên `InvalidateCatalogCache` áp cho tất cả.

            Đây là dữ liệu tra cứu, **không** phải dữ liệu để chọn: `brandId` khớp
            `brands[].id`. Endpoint `GET /api/v1/devices/{id}/service-directory` là chỗ
            luật khớp chuỗi tự do → dòng danh bạ được áp dụng; client đọc thẳng mảng này
            thì phải tự khớp, và luật đó (hoà thì không khớp) nằm trong mô tả endpoint kia.
          items: { $ref: '#/components/schemas/BrandServiceInfo' }

    # ─── Session management (GET/DELETE /api/v1/auth/sessions) ──────────────

    SessionSummary:
      type: object
      description: |
        Một phiên đăng nhập đang hoạt động. `id` là khoá chính của hàng `Session`
        (cuid) — KHÔNG phải bearer token và không phải hash của nó; `tokenHash`
        không bao giờ rời server.
      required: [id, current, lastSeenAt, createdAt, expiresAt]
      properties:
        id: { type: string, description: 'Dùng cho DELETE /api/v1/auth/sessions/{id}' }
        deviceLabel:
          type: string
          nullable: true
          description: 'Nhãn do client gửi lúc đăng nhập (tối đa 80 ký tự). `null` với client cũ không gửi nhãn — hiện "Không rõ thiết bị".'
        platform: { type: string, nullable: true, enum: [web, ios, android, null] }
        current:
          type: boolean
          description: 'true = phiên đang gọi request này ("thiết bị này").'
        lastSeenAt: { type: string, format: date-time, description: 'Lần hoạt động cuối (RFC3339, UTC). Được cập nhật tối đa 5 phút một lần.' }
        createdAt: { type: string, format: date-time, description: 'Thời điểm đăng nhập.' }
        expiresAt: { type: string, format: date-time, description: 'Hết hạn hiện tại. TTL trượt: mỗi lần dùng sau 7 ngày lại đẩy thêm 30 ngày.' }

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          description: 'Chỉ các phiên chưa thu hồi và chưa hết hạn, mới dùng gần nhất trước, tối đa 100 dòng. Luôn là `[]`, không bao giờ `null`.'
          items: { $ref: '#/components/schemas/SessionSummary' }

    SessionRevokeResult:
      type: object
      required: [ok, current, alreadyRevoked, message]
      properties:
        ok: { type: boolean }
        current:
          type: boolean
          description: 'true = phiên bị thu hồi chính là phiên đang gọi. Client PHẢI xoá token đang giữ: request kế tiếp sẽ 401.'
        alreadyRevoked:
          type: boolean
          description: 'true = phiên đã bị thu hồi từ trước; lần gọi này không đổi gì (idempotent).'
        message: { type: string, description: 'Câu tiếng Việt hiển thị thẳng cho người dùng.' }

    # ─── Serial/IMEI advisories (FEATURE_IDEAS #6) ───────────────────────────

    DeviceWarning:
      type: object
      description: |
        Cảnh báo **không chặn** kèm theo một giá trị đã được lưu. Client hiện cảnh
        báo vàng cạnh ô tương ứng; KHÔNG được coi là thất bại và KHÔNG được tự ý
        xoá giá trị.
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [IMEI_CHECKSUM, IMEI_LENGTH, SERIAL_DUPLICATE]
          description: |
            `IMEI_CHECKSUM` — 15 chữ số nhưng sai checksum Luhn (thường là gõ sai
            một số). `IMEI_LENGTH` — chuỗi toàn số dài 14/16/17, không phải IMEI 15
            số. `SERIAL_DUPLICATE` — đã có ở thiết bị KHÁC của cùng người dùng
            (`Device.serialNumber` không có unique index nên đây chỉ là cảnh báo).
        field: { type: string, description: 'Tên trường trong request/draft, hiện luôn là `serialNumber`.' }
        message: { type: string, description: 'Câu tiếng Việt hiển thị thẳng cho người dùng.' }

    # ─── Spending forecast (GET /api/v1/forecast) ────────────────────────────

    ForecastBucket:
      type: object
      description: |
        Một tháng lịch (UTC) trong cửa sổ dự báo. Mọi trường tiền là tổng VND
        (int64); mọi trường đếm là int64. Tháng không có gì vẫn có mặt với các giá
        trị 0.
      required:
        - month
        - subscriptionVnd
        - subscriptionAutoRenewVnd
        - subscriptionCount
        - warrantyExpiringVnd
        - warrantyExpiringCount
        - wishlistTargetVnd
        - wishlistTargetCount
      properties:
        month: { type: string, description: '`YYYY-MM` theo UTC.' }
        subscriptionVnd: { type: integer, format: int64, description: 'Tổng các kỳ gia hạn rơi vào tháng này.' }
        subscriptionAutoRenewVnd: { type: integer, format: int64, description: 'Phần sẽ bị trừ TỰ ĐỘNG (autoRenew = true). Chênh lệch so với `subscriptionVnd` là các gói phải tự gia hạn.' }
        subscriptionCount: { type: integer, format: int64, description: 'Số kỳ gia hạn trong tháng (một gói QUARTERLY có thể góp 1 kỳ ở đây).' }
        warrantyExpiringVnd: { type: integer, format: int64, description: 'Tổng giá các gói bảo hành hết hạn trong tháng — tiền CÓ THỂ phát sinh, không phải khoản chắc chắn trả.' }
        warrantyExpiringCount: { type: integer, format: int64 }
        wishlistTargetVnd: { type: integer, format: int64, description: 'Tổng giá ghi nhận gần nhất của các món wishlist tới mốc trong tháng — tiền CÓ THỂ phát sinh.' }
        wishlistTargetCount: { type: integer, format: int64 }

    ForecastWarranty:
      type: object
      required: [id, deviceId, deviceName, type, endDate, month, months]
      properties:
        id: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        type: { type: string, enum: [STANDARD, EXTENDED, THIRD_PARTY] }
        provider: { type: string, nullable: true }
        endDate: { type: string, format: date-time }
        month: { type: string, description: 'Bucket mà khoản này được tính vào.' }
        months: { type: integer }
        costVnd: { type: integer, format: int64, nullable: true, description: 'Giá gói bảo hành đang hết hạn, để tham chiếu khi để dành tiền. `null` = chưa ghi giá (khác 0đ). Đây KHÔNG phải một khoản bị trừ.' }

    ForecastWishlistItem:
      type: object
      required: [id, name, targetDate, month, priority, status]
      properties:
        id: { type: string }
        name: { type: string }
        targetDate: { type: string, format: date-time }
        month: { type: string }
        priority: { type: string, enum: [MUST, WANT, MAYBE] }
        status: { type: string, enum: [WATCHING, DECIDED] }
        currentPriceVnd: { type: integer, format: int64, nullable: true, description: 'Giá ghi nhận gần nhất. `null` = chưa từng nhập giá.' }

    Forecast:
      type: object
      required:
        - generatedAt
        - windowStart
        - windowEnd
        - months
        - currency
        - subscriptionTotalVnd
        - subscriptionAutoRenewTotalVnd
        - subscriptionMonthlyAverageVnd
        - subscriptionsCount
        - chargesCount
        - buckets
        - upcomingWarranties
        - upcomingWishlist
        - note
      properties:
        generatedAt: { type: string, format: date-time, description: 'Thời điểm `now` mà phép tính dùng (UTC). Mọi mốc khác trong payload đều tương đối với nó.' }
        windowStart: { type: string, format: date-time, description: 'Bằng `generatedAt`; bao gồm (left-closed).' }
        windowEnd: { type: string, format: date-time, description: 'Không bao gồm (right-open): một khoản rơi đúng mốc này không thuộc bucket nào.' }
        months: { type: integer, description: 'Độ dài cửa sổ theo tháng (1–24).' }
        currency: { type: string, enum: [VND] }
        subscriptionTotalVnd: { type: integer, format: int64, description: 'Tổng các kỳ gia hạn trong cửa sổ (int64, không bao giờ bị thu hẹp về int32).' }
        subscriptionAutoRenewTotalVnd: { type: integer, format: int64 }
        subscriptionMonthlyAverageVnd: { type: integer, format: int64, description: 'Quy đổi tháng theo công thức canonical — BẰNG `subscriptions.totalMonthlyVnd` của `GET /api/v1/stats` với cùng dữ liệu.' }
        subscriptionsCount: { type: integer, format: int64, description: 'Số gói đóng góp ít nhất một kỳ trong cửa sổ.' }
        chargesCount: { type: integer, format: int64, description: 'Số kỳ gia hạn (một gói QUARTERLY góp 4).' }
        buckets:
          type: array
          description: 'Các tháng lịch mà cửa sổ chạm tới: thường `months + 1` phần tử, đúng `months` khi gọi đúng 00:00 ngày 1. Xem mô tả endpoint.'
          items: { $ref: '#/components/schemas/ForecastBucket' }
        upcomingWarranties:
          type: array
          items: { $ref: '#/components/schemas/ForecastWarranty' }
        upcomingWishlist:
          type: array
          items: { $ref: '#/components/schemas/ForecastWishlistItem' }
        note: { type: string, description: 'Câu tiếng Việt giải thích mô hình (LIFETIME không bị trừ, tháng đầu/cuối là một phần, đâu là tiền chắc chắn trả). Hiển thị thẳng.' }

    UserStats:
      type: object
      required: [devices, subscriptions, wishlist]
      properties:
        devices:
          type: object
          required: [total, byStatus, totalPurchasePrice, totalWarrantyCost]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST]
              properties:
                ACTIVE: { type: integer }
                EXPIRED: { type: integer }
                SOLD: { type: integer }
                BROKEN: { type: integer }
                LOST: { type: integer }
            totalPurchasePrice: { type: integer, description: 'VND, integer' }
            totalWarrantyCost:
              type: integer
              description: 'Sum of Warranty.cost across every warranty on the user''s devices (VND). Always present: 0 when the user has no device or no warranty carries a cost — a warranty row with a null cost contributes 0. int64 on the server; never narrowed to int32.'
        subscriptions:
          type: object
          required: [total, byStatus, totalMonthlyVnd]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [ACTIVE, PAUSED, CANCELED, EXPIRED]
              properties:
                ACTIVE: { type: integer }
                PAUSED: { type: integer }
                CANCELED: { type: integer }
                EXPIRED: { type: integer }
            totalMonthlyVnd:
              type: integer
              description: 'Sum of monthly-equivalent VND across ACTIVE, non-LIFETIME subs'
        wishlist:
          type: object
          required: [total, byStatus, totalCurrentPriceWatching]
          properties:
            total: { type: integer }
            byStatus:
              type: object
              required: [WATCHING, DECIDED, SKIPPED, PURCHASED]
              properties:
                WATCHING: { type: integer }
                DECIDED: { type: integer }
                SKIPPED: { type: integer }
                PURCHASED: { type: integer }
            totalCurrentPriceWatching:
              type: integer
              description: 'Sum of currentPrice for items in WATCHING or DECIDED'

    # GET /api/v1/search — cross-entity search (roadmap #7). Each group is a plain
    # projection of the same rows the per-entity list endpoints return, capped at
    # the `limit` query parameter.
    SearchResults:
      type: object
      required: [query, devices, subscriptions, wishlist]
      properties:
        query:
          type: string
          description: 'Từ khoá đã trim, đúng như server đã dùng để khớp. Chuỗi rỗng khi client không truyền `q`.'
        devices:
          type: array
          description: 'Thiết bị khớp, sắp xếp theo `createdAt` giảm dần. Luôn là mảng, không bao giờ null.'
          items: { $ref: '#/components/schemas/Device' }
        subscriptions:
          type: array
          description: 'Subscription khớp (name/brand/plan/accountEmail), sắp xếp theo `renewalDate` tăng dần. Luôn là mảng.'
          items: { $ref: '#/components/schemas/Subscription' }
        wishlist:
          type: array
          description: 'Món wishlist khớp (name/brand/notes), sắp xếp theo `createdAt` giảm dần. Luôn là mảng.'
          items: { $ref: '#/components/schemas/WishlistItem' }

    ReminderWarranty:
      allOf:
        - $ref: '#/components/schemas/Warranty'
        - type: object
          required: [device]
          properties:
            isDismissed:
              type: boolean
              description: |
                `true` khi reminder này đã bị ẩn (`Reminder.isDismissed`). Chỉ
                xuất hiện khi `true` — trường vắng mặt nghĩa là `false`. Chỉ có
                dòng `true` khi gọi `GET /api/v1/reminders?includeDismissed=true`;
                ở chế độ mặc định mọi dòng đều đang hoạt động nên khoá này không
                bao giờ xuất hiện (giữ nguyên hình dạng phản hồi cũ).
            device:
              type: object
              required: [id, name, category, status]
              properties:
                id: { type: string }
                name: { type: string }
                category: { type: string }
                status:
                  type: string
                  enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST]
                  description: |
                    Trạng thái thiết bị. Có mặt để client vẽ badge "Đã bán" /
                    "Hỏng" / "Mất" cho reminder đã ẩn trên thiết bị không còn
                    ACTIVE (những dòng này được trả về khi
                    `includeDismissed=true`).

    # ─── Hạn đổi trả ("1 đổi 1") — GET /api/v1/return-windows ────────────────
    ReturnWindow:
      type: object
      required: [deviceId, name, category, status, purchaseDate, returnWindowDays, returnDeadline, daysLeft]
      properties:
        deviceId: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        purchaseDate: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, nullable: true, description: 'Ngày thực nhận, `null` nếu chưa ghi (deadline khi đó tính từ `purchaseDate`).' }
        returnWindowDays: { type: integer, description: 'Số ngày đổi/trả người dùng đã ghi. Luôn `> 0` ở endpoint này (0 và null bị lọc).' }
        returnDeadline:
          type: string
          format: date-time
          description: 'Hạn cuối còn được đổi/trả = `COALESCE(receivedAt, purchaseDate) + returnWindowDays ngày`.'
        daysLeft:
          type: integer
          description: |
            Số ngày còn lại, tính theo **ngày lịch**: `0` nghĩa là **hôm nay là
            ngày cuối cùng**. Không bao giờ âm ở endpoint này (cửa sổ đã đóng bị
            lọc khỏi danh sách).

    # ─── "Việc cần xử lý" — GET /api/v1/actions ─────────────────────────────
    ActionItem:
      type: object
      required: [itemKey, kind, severity, title, detail]
      properties:
        itemKey:
          type: string
          description: |
            `<LOẠI_VIỆC>:<id>`. Danh tính ổn định của việc này — dùng nguyên văn
            khi gọi `POST/DELETE /api/v1/actions/{itemKey}/snooze`.
          example: 'WARRANTY_EXPIRED:clx1234'
        kind:
          type: string
          enum:
            - WARRANTY_EXPIRED
            - DEVICE_NO_WARRANTY
            - DEVICE_STATUS_STALE
            - DEVICE_MISSING_SERIAL
            - DEVICE_MISSING_RECEIPT
            - RETURN_WINDOW_CLOSING
            - RETURN_WINDOW_UNKNOWN
            - SUBSCRIPTION_RENEWING_NO_CANCEL_URL
            - SUBSCRIPTION_PAID_NOT_ADVANCED
            - WISHLIST_TARGET_PASSED
          description: |
            Loại việc. **Client nên switch trên trường này** để quyết định hiện
            nút nào; `title`/`detail` chỉ để hiển thị.

            * `WARRANTY_EXPIRED` — bảo hành hết hạn trong vòng 90 ngày qua, trên
              thiết bị còn `ACTIVE`. Đây là những dòng đã rơi khỏi mọi màn hình.
            * `DEVICE_NO_WARRANTY` — thiết bị `ACTIVE` không có gói bảo hành nào.
            * `DEVICE_STATUS_STALE` — `status` vẫn `ACTIVE` nhưng bảo hành cuối đã
              hết **quá** 90 ngày (bổ sung, không trùng `WARRANTY_EXPIRED`).
            * `DEVICE_MISSING_SERIAL` — thiếu `serialNumber`.
            * `DEVICE_MISSING_RECEIPT` — không có `Attachment` nào.
            * `RETURN_WINDOW_CLOSING` — hạn đổi/trả còn ≤ 7 ngày.
            * `RETURN_WINDOW_UNKNOWN` — mua trong 30 ngày qua mà chưa ghi
              `returnWindowDays`.
            * `SUBSCRIPTION_RENEWING_NO_CANCEL_URL` — sắp tự gia hạn trong 14 ngày
              mà thiếu `cancelUrl`.
            * `SUBSCRIPTION_PAID_NOT_ADVANCED` — đã ghi nhận thanh toán cho một
              `renewalDate` đã qua nhưng ngày gia hạn chưa được đẩy tiếp.
            * `WISHLIST_TARGET_PASSED` — `targetDate` đã qua mà món vẫn đang theo dõi.
        severity: { type: string, enum: [HIGH, MEDIUM, LOW], description: 'Thứ tự hiển thị gợi ý: `HIGH` trước. `HIGH` = mốc thời gian hoặc tiền sắp mất.' }
        title: { type: string, description: 'Tiêu đề tiếng Việt, hiển thị thẳng.' }
        detail: { type: string, description: 'Một câu tiếng Việt giải thích vì sao việc này xuất hiện, kèm ngày/số tiền liên quan.' }
        deviceId: { type: string, nullable: true }
        warrantyId: { type: string, nullable: true }
        subscriptionId: { type: string, nullable: true }
        wishlistItemId: { type: string, nullable: true }
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: 'Ngày mà việc này nói tới (hết hạn BH, hạn đổi trả, ngày gia hạn, ngày dự kiến mua). Vắng mặt khi việc không gắn với một ngày cụ thể.'
        amountVnd:
          type: integer
          format: int64
          nullable: true
          description: 'Số tiền liên quan (VND, int64), khi có. Vắng mặt khi việc không gắn với tiền.'
        snoozedUntil:
          type: string
          format: date-time
          nullable: true
          description: 'Chỉ xuất hiện khi gọi `?snoozed=true` và việc này đang bị hoãn. Vắng mặt = việc đang cần xử lý.'

    # Số lượng theo mức độ. Dùng chung cho hàng đợi việc cần xử lý và cho báo cáo
    # tự soát subscription — hai tập hợp khác nhau, cùng một cách đếm.
    ActionCounts:
      type: object
      required: [total, high, medium, low]
      properties:
        total: { type: integer, description: 'Tổng số mục trong tập đang được đếm. Với `ActionQueue` đây là số việc **đang cần xử lý** (không tính việc bị hoãn, kể cả khi gọi `?snoozed=true`); với `SubscriptionAudit` là tổng số phát hiện.' }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }

    ActionQueue:
      type: object
      required: [generatedAt, items, counts, snoozedCount, note]
      properties:
        generatedAt: { type: string, format: date-time, description: 'Thời điểm server dựng hàng đợi. Mọi phép đếm ngày trong `items` đều tương đối với nó.' }
        items:
          type: array
          description: 'Luôn là mảng, không bao giờ null. Đã sắp xếp: `severity` giảm dần, rồi tới `dueDate` tăng dần (không có ngày thì xuống cuối), rồi `kind`/`itemKey` để thứ tự ổn định giữa hai lần gọi.'
          items: { $ref: '#/components/schemas/ActionItem' }
        counts:
          allOf: [{ $ref: '#/components/schemas/ActionCounts' }]
          description: 'Luôn đếm tập **đang cần xử lý**: cờ `snoozed` chỉ thêm dòng vào `items`, không bao giờ đổi nghĩa của badge này.'
        snoozedCount: { type: integer, description: 'Số việc đang bị hoãn, kể cả khi chúng không nằm trong `items`. Dùng để vẽ lối vào mục "Đang hoãn".' }
        note: { type: string, description: 'Câu tiếng Việt nói rõ hàng đợi này là gì và **không** phải gì (không phải thông báo đẩy; hoãn ở đây không ảnh hưởng nhắc bảo hành). Hiển thị thẳng.' }

    SnoozeInput:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: 'Số ngày hoãn. Bỏ trống hoặc `0` ⇒ dùng mặc định `90`. Ngoài khoảng `1–365` ⇒ 400 kèm `fieldErrors.days`.'

    SnoozeResult:
      type: object
      required: [itemKey, snoozedUntil, days]
      properties:
        itemKey: { type: string }
        snoozedUntil: { type: string, format: date-time, description: 'Thời điểm việc này hiện lại trong hàng đợi.' }
        days: { type: integer, description: 'Số ngày đã áp dụng (hữu ích khi client không gửi `days` và cần biết mặc định là bao nhiêu).' }

    # ─── Tự soát subscription — GET /api/v1/subscriptions/audit ─────────────
    SubscriptionAuditThresholds:
      type: object
      required: [quietMinAutoCharges, quietMinMonths, upcomingRenewalDays, priceRiseMinPercent, duplicateNormalized]
      properties:
        quietMinAutoCharges: { type: integer, description: 'Số khoản tự động trừ tối thiểu để xét `QUIET_AUTO_RENEW` (3).' }
        quietMinMonths: { type: integer, description: 'Khoản tự trừ ĐẦU TIÊN phải cách đây ít nhất bao nhiêu tháng (6).' }
        upcomingRenewalDays: { type: integer, description: 'Cửa sổ để một phát hiện còn hành động được trước khi bị trừ tiền (14 ngày).' }
        priceRiseMinPercent: { type: integer, description: 'Mức tăng (%) từ đó `material` = true. Mọi mức tăng vẫn được báo; ngưỡng này chỉ để client quyết định độ nổi bật (5).' }
        duplicateNormalized: { type: boolean, description: 'Luôn `true`: so khớp trùng tên có bỏ dấu và không phân biệt hoa/thường (`public.wv_unaccent`).' }

    SubscriptionAuditFinding:
      type: object
      required: [findingKey, kind, severity, title, detail, subscriptionIds, names, monthlyVnd, chargedTotalVnd, chargeCount]
      properties:
        findingKey: { type: string, description: '`<LOẠI_PHÁT_HIỆN>:<id hoặc cặp id>`. Ổn định giữa các lần gọi.' }
        kind: { type: string, enum: [QUIET_AUTO_RENEW, PRICE_INCREASED, DUPLICATE] }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        title: { type: string }
        detail: { type: string, description: 'Câu tiếng Việt nêu đúng số liệu đã dẫn tới kết luận này.' }
        subscriptionIds: { type: array, items: { type: string }, description: 'Một id cho hai luật đầu, hai id cho `DUPLICATE`.' }
        names: { type: array, items: { type: string } }
        monthlyVnd: { type: integer, format: int64, description: 'Tổng quy đổi tháng của các gói liên quan (VND, int64). `0` với `LIFETIME`.' }
        chargedTotalVnd: { type: integer, format: int64, description: 'Tổng tiền **máy đã tự trừ** (`QUIET_AUTO_RENEW`). Không phải tổng mọi thanh toán.' }
        chargeCount: { type: integer, format: int64, description: 'Số khoản máy đã tự trừ.' }
        lastRecordedAt: { type: string, format: date-time, nullable: true, description: 'Ngày thanh toán mới nhất được ghi nhận. ⚠️ Đây **không** phải ngày dùng cuối — app không có dữ liệu đó.' }
        nextRenewalAt: { type: string, format: date-time, nullable: true }
        daysUntilRenewal: { type: integer, nullable: true }
        previousAmountVnd: { type: integer, format: int64, nullable: true, description: '`PRICE_INCREASED`: giá kỳ trước.' }
        amountVnd: { type: integer, format: int64, nullable: true, description: '`PRICE_INCREASED`: giá kỳ này.' }
        increaseVnd: { type: integer, format: int64, nullable: true }
        increasePercent: { type: integer, nullable: true, description: 'Mức tăng làm tròn theo %, `null` khi kỳ trước là 0 (không chia được).' }
        material: { type: boolean, nullable: true, description: '`false` khi mức tăng dưới `priceRiseMinPercent`. Phát hiện vẫn được trả về; chỉ độ nổi bật là do client quyết định.' }
        reason: { type: string, nullable: true, enum: [SAME_NAME, SAME_BRAND_CATEGORY], description: '`DUPLICATE`: tín hiệu nào đã khớp.' }

    SubscriptionAudit:
      type: object
      required: [generatedAt, findings, counts, advisory, thresholds, note]
      properties:
        generatedAt: { type: string, format: date-time }
        findings:
          type: array
          description: 'Luôn là mảng, không bao giờ null. Sắp xếp: `severity` giảm dần, rồi `monthlyVnd` giảm dần (tiền là lý do tính năng này tồn tại), rồi `findingKey`.'
          items: { $ref: '#/components/schemas/SubscriptionAuditFinding' }
        counts: { $ref: '#/components/schemas/ActionCounts' }
        advisory:
          type: boolean
          description: 'Luôn `true`. Có mặt để client khẳng định với người dùng rằng **không có gì bị sửa hay huỷ tự động** — endpoint này không có đường ghi nào.'
        thresholds: { $ref: '#/components/schemas/SubscriptionAuditThresholds' }
        note: { type: string, description: 'Câu tiếng Việt nói rõ giới hạn của phân tích (không đọc được giao dịch ngân hàng, không biết gói có đang được dùng hay không). Hiển thị thẳng.' }

    # ─── Warranty directory (FEATURE_IDEAS #15) ─────────────────────────────

    ServiceDirectory:
      type: object
      required: [deviceId, deviceName, category, centres, disclaimer]
      description: |
        Danh bạ bảo hành cho **một** thiết bị. `phoneSource` và các trường `null`
        không phải lỗi — chúng là cách app nói thẳng nó biết gì và không biết gì.
      properties:
        deviceId: { type: string }
        deviceName: { type: string }
        category: { type: string, description: 'Mã loại thiết bị (vd `PHONE`). Nhãn tiếng Việt do client giữ, như mọi payload khác.' }
        brandInput:
          type: string
          nullable: true
          description: '`Device.brand` nguyên văn người dùng gõ. `null` khi chưa ghi.'
        brand:
          allOf: [{ $ref: '#/components/schemas/BrandServiceInfo' }]
          nullable: true
          description: |
            Dòng danh bạ của hãng, hoặc `null` khi app **không có** thông tin cho hãng
            đó (chỉ 16 hãng được seed — xem migration 0012) hoặc khi chuỗi khớp bị **hoà**.
            `null` là câu trả lời hợp lệ: client hiển thị `brandInput` và câu "app không
            có thông tin cho hãng này", **không** tự đoán URL.
        centres:
          type: array
          description: 'Mỗi gói bảo hành của thiết bị một dòng, kể cả gói không khớp catalog nào. Luôn là mảng.'
          items: { $ref: '#/components/schemas/WarrantyCentre' }
        disclaimer:
          type: string
          description: 'Câu tiếng Việt giải thích vì sao có nhiều `null`: app không lưu hotline/địa chỉ, số hiện ra là do người dùng tự ghi. Hiển thị thẳng.'

    BrandServiceInfo:
      type: object
      required: [brandId, name]
      description: |
        Một dòng danh bạ theo hãng (bảng `BrandServiceInfo`, migration 0012).
        **Không có `phone` và không có `address`** — bảng không có hai cột đó, vì repo
        này không kiểm chứng được hotline và một hotline sai còn tệ hơn không có.
        Đây cũng là lý do `GET /api/v1/catalog` trả về mảng `brandServiceInfo` cùng
        hình dạng này.
      properties:
        brandId: { type: string, description: 'Khoá `Brand.id` (vd `samsung`).' }
        name: { type: string, description: 'Tên hãng hiển thị (từ bảng `Brand`).' }
        serviceLocatorUrl: { type: string, nullable: true, description: 'Trang tra cứu trung tâm bảo hành uỷ quyền **của chính hãng**. `null` khi không có URL nào kiểm chứng được.' }
        supportUrl: { type: string, nullable: true, description: 'Trang hỗ trợ chung của hãng.' }
        notes: { type: string, nullable: true, description: 'Ghi chú tiếng Việt: link dùng để làm gì.' }

    WarrantyCentre:
      type: object
      required: [warrantyId, warrantyType, isActive, phoneSource]
      properties:
        warrantyId: { type: string }
        warrantyType: { type: string, enum: [STANDARD, EXTENDED, THIRD_PARTY] }
        endDate: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean, description: '`endDate` còn ở tương lai hay không, tính ở server.' }
        providerInput:
          type: string
          nullable: true
          description: '`Warranty.provider` nguyên văn người dùng gõ/nhập. **Luôn** hiển thị trường này, kể cả khi `provider` là `null`.'
        provider:
          allOf: [{ $ref: '#/components/schemas/WarrantyProviderRef' }]
          nullable: true
          description: 'Dòng `WarrantyProvider` mà chuỗi tự do khớp được, hoặc `null`. `null` là bình thường, không phải lỗi.'
        address: { type: string, nullable: true, description: '`Warranty.address` — do **người dùng** ghi. App không tự điền.' }
        phone: { type: string, nullable: true, description: '`Warranty.phone` — do **người dùng** ghi. App không tự điền.' }
        phoneSource:
          type: string
          enum: [user, none]
          description: '`user` khi `phone` có giá trị, `none` khi không. Không có giá trị thứ ba: app **không bao giờ** là nguồn của số điện thoại.'

    WarrantyProviderRef:
      type: object
      required: [id, name]
      description: 'Một dòng của catalog `WarrantyProvider`. `phone`/`address` là `null` với mọi dòng được seed (migration 0008) — hiển thị `WarrantyCentre.phone`/`.address` thay vì hai trường này.'
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    # ─── Handover certificate / share link (FEATURE_IDEAS #2) ───────────────

    DeviceShare:
      type: object
      required: [id, deviceId, expiresAt, includeSerial, viewCount, createdAt]
      description: |
        Link chia sẻ ở góc nhìn **chủ máy**. Không chứa `token` (chỉ trả về một lần
        lúc tạo) và không chứa `tokenHash` (không bao giờ rời server).
      properties:
        id: { type: string, description: 'Dùng cho `DELETE /api/v1/shares/{id}`.' }
        deviceId: { type: string }
        expiresAt: { type: string, format: date-time, description: 'Hết hạn. Không có link vĩnh viễn.' }
        revokedAt: { type: string, format: date-time, nullable: true }
        includeSerial: { type: boolean, description: 'Link này có kèm serial đầy đủ hay chỉ serial che giữa.' }
        viewCount: { type: integer, description: 'Số lần phiếu được mở. Chỉ chủ máy thấy.' }
        lastViewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CreatedDeviceShare:
      allOf:
        - { $ref: '#/components/schemas/DeviceShare' }
        - type: object
          required: [token, sharePath]
          properties:
            token:
              type: string
              description: |
                **Credential. Chỉ xuất hiện đúng một lần, trong response này.** Server
                chỉ lưu sha256 hex của nó. Mất token = phải tạo link mới.
            sharePath:
              type: string
              description: 'Đường dẫn công khai (`/api/v1/public/shares/<token>`) để client ghép với base URL của chính nó. Server cố ý không dựng URL tuyệt đối vì nó không biết client đi qua host nào.'

    SharedWarranty:
      type: object
      required: [type, startDate, endDate, months]
      description: 'Một gói bảo hành trong phiếu. **Không** có `cost` và **không** có `notes`: người nhận cần thời hạn và nơi bảo hành, không cần biết người bán đã trả bao nhiêu.'
      properties:
        type: { type: string, enum: [STANDARD, EXTENDED, THIRD_PARTY] }
        provider: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        months: { type: integer }
        address: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    SharedCertificate:
      type: object
      required: [deviceName, category, purchaseDate, status, warranties, expiresAt, issuedAt, disclaimer]
      description: |
        **Toàn bộ** những gì một link chia sẻ để lộ ra cho người không đăng nhập.

        Danh sách này là hợp đồng bảo mật: thêm một trường vào đây là mở rộng thứ mà
        một người lạ đọc được. Những gì **cố ý vắng mặt**: `id` thiết bị, `notes`,
        `purchasePrice`, `soldPrice`, `Warranty.cost`, `Warranty.notes`, danh sách
        `Attachment`/ảnh hoá đơn, và mọi thiết bị khác của chủ máy.
      properties:
        deviceName: { type: string }
        category: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        purchaseDate: { type: string, format: date-time }
        purchasePlace: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST] }
        soldAt: { type: string, format: date-time, nullable: true, description: 'Ngày bàn giao, nếu chủ máy có ghi.' }
        serialNumber:
          type: string
          nullable: true
          description: 'CHỈ có khi chủ máy chọn `includeSerial: true`. Mặc định `null`.'
        serialNumberMasked:
          type: string
          nullable: true
          description: 'Luôn có khi máy có serial: giữ tối đa 4 ký tự đầu và 4 ký tự cuối, che giữa bằng `*` (độ dài giữ nguyên). Luôn che ít nhất 1 ký tự, nên không độ dài nào dựng lại được số đầy đủ.'
