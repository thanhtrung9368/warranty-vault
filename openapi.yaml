  /api/v1/search:
    get:
      tags: [search]
      summary: Tìm kiếm xuyên thực thể (thiết bị, subscription, wishlist, văn bản OCR)
      description: |
        Roadmap #7. Trước endpoint này, `q` chỉ tồn tại trên `GET /api/v1/devices`,
        nên gõ "samsung" không tìm được subscription "Samsung Cloud" hay món
        wishlist "Galaxy Buds".

        **Roadmap #13 — nhóm `attachments`:** văn bản OCR mà người dùng đã quét
        trên một file đính kèm (lưu ở `Attachment.extractedText`, migration 0019)
        được tìm như một nhóm thứ tư. Nhờ vậy câu hỏi thật — "hoá đơn nào là củ
        sạc 65W", "hoá đơn nào có gói bảo hành mở rộng" — trả lời được dù người
        dùng chưa từng gõ hai chữ đó vào trường nào. Chỉ `extractedText` được
        tìm trong nhóm này; `fileName`/`description` không nằm trong index.
        File chưa từng quét OCR (hoặc lần quét không đọc được chữ) có
        `extractedText` NULL nên không bao giờ khớp — đúng nghĩa "chưa có gì để
        tìm".

        **Quyền riêng tư — đọc kỹ:** file đính kèm vẫn được mã hoá AES-256-GCM
        trên đĩa, nhưng `extractedText` là **plaintext trong Postgres**. Đây là
        cái giá của tìm kiếm: index trigram (và predicate `LIKE`) buộc phải đọc
        được giá trị đã giải mã, nếu không sẽ phải giải mã toàn bộ bảng mỗi lần
        query. Văn bản chỉ được ghi sau khi người dùng đã bật opt-in AI (tức là
        đã đồng ý gửi bản giải mã tới Anthropic), mọi truy vấn đều giới hạn theo
        người dùng, và văn bản **không** nằm trong bản sao lưu (xem `BackupV1`).
        Nếu cần mã hoá at-rest cho cột này thì phải đổi cả cách tìm kiếm, không
        chỉ đổi kiểu cột.

        **Vì sao thêm endpoint mới thay vì mở rộng 3 endpoint danh sách:** một
        truy vấn trả cả bốn nhóm (client không phải gọi 4 lần rồi tự trộn), không
        đụng vào hành vi `q` hiện có của từng danh sách (không rủi ro hồi quy cho
        web/iOS/Android đang chạy), và hợp đồng rõ ràng cho màn hình "Tìm kiếm"
        chung. Các endpoint danh sách giữ nguyên `q`/`status` như cũ.

        **Khớp không dấu:** dùng đúng biểu thức của migration 0007 —
        `lower(public.wv_unaccent(x))` — nên `dien thoai` khớp `Điện thoại`, và
        hoạt động giống nhau trên database locale C lẫn UTF-8. KHÔNG dùng ILIKE
        trần (ILIKE không bỏ dấu tiếng Việt).

        Các trường được tìm (không dấu, không phân biệt hoa thường):
          * `devices`: `name`, `brand`, `model`, `serialNumber` (giống `GET /api/v1/devices?q=`)
          * `subscriptions`: `name`, `brand`, `plan`, `accountEmail`
          * `wishlist`: `name`, `brand`, `notes`
          * `attachments`: `extractedText` (văn bản OCR, migration 0019)

        `q` rỗng hoặc chỉ có khoảng trắng trả về 200 với **bốn** mảng rỗng (không
        phải 400) — người dùng xoá hết chữ trong ô tìm kiếm không phải là lỗi.
        `q` dài hơn 200 ký tự trả 400. Mỗi nhóm bị chặn bởi `limit` (mặc định 20,
        tối đa 50) và luôn nằm trong tài khoản đang đăng nhập. Mọi nhóm luôn là
        mảng, không bao giờ `null`.
      parameters:
        - name: q
          in: query
          required: false
          description: Từ khoá. Không dấu vẫn khớp có dấu. Rỗng ⇒ bốn mảng rỗng. Tối đa 200 ký tự.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          required: false
          description: Số dòng tối đa cho MỖI nhóm (thiết bị / subscription / wishlist / attachment). Mặc định 20, tối đa 50.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Kết quả đã nhóm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

