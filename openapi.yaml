openapi: 3.0.3
info:
  title: Warrly API
  description: |
    REST API for native mobile clients (iOS / Android) of Warrly.
    Source-of-truth for client codegen:
      - iOS:     swift-openapi-generator
      - Android: openapi-generator-cli (kotlin)
    The web app continues to use Next.js Server Actions — those are NOT
    documented here.

    Auth: bearer token from POST /api/v1/auth/login (or /register). Send as
    `Authorization: Bearer <token>` on every authenticated request.

    Ngôn ngữ: mọi chữ trong `message` / `fieldErrors` được server dịch sẵn. Thứ
    tự quyết định: `?lang=vi|en` → header `Accept-Language` → `User.locale` (đã
    lưu) → `en`. Ngôn ngữ không hỗ trợ rơi về mặc định, **không** phải lỗi 400.
    Xem `components.parameters.Lang`.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://warrly.example.com
    description: Production (set when deployed)

tags:
  - { name: auth }
  - { name: devices }
  - { name: warranties }
  - { name: attachments }
  - { name: shares, description: 'Phiếu bàn giao bảo hành + link chia sẻ có token. `GET /api/v1/public/shares/{token}` là endpoint DUY NHẤT không cần bearer.' }
  - { name: subscriptions }
  - { name: wishlist }
  - { name: push }
  - { name: catalog }
  - { name: stats }
  - { name: ai }
  - { name: actions }

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      security: []
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '200':
          description: Email already taken (returns generic message; do not infer)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, message: { type: string } }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      summary: Revoke the current session token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/forgot:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset link by email
      description: |
        Always returns `{ ok: true }` regardless of whether the email is
        registered (avoids user enumeration). Sends an email containing a
        time-limited reset link to the address if it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/me:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Cập nhật hồ sơ — tên hiển thị và ngôn ngữ
      description: |
        Partial profile update. Two fields are accepted: `displayName` and
        `locale`. The account email **cannot be changed here** — it has its own
        two-step flow (`POST /api/v1/auth/change-email`). A body carrying
        `email` / `newEmail` is rejected with 400 and a `fieldErrors` entry
        saying so, rather than silently ignored.

        Both accepted fields are **tri-state** and independent: an ABSENT key
        leaves the stored value alone, `null` (or `""`) CLEARS it, and a value
        sets it. So `{"locale": "vi"}` on its own is a valid body, and a client
        that only knows about `displayName` cannot wipe a stored language by
        editing a name.

        A body with NEITHER key is 400, so an empty or mistyped body still fails
        loudly instead of being a 200 that changed nothing.

        Response mirrors `GET /api/v1/auth/me` (`{ "user": ... }`) plus a
        Vietnamese `message`, so a client can replace its cached user object
        directly from the PATCH response. Rate-limited per user like every other
        authenticated write (60 req/60s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [auth]
      summary: Permanently delete the authenticated user's account
      description: |
        Cascades the user's owned rows (Device / Subscription / Wishlist /
        Session / PasswordReset) in a single statement and best-effort
        removes the on-disk encrypted attachments. Requires the current
        password in the body for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: List the caller's active login sessions
      description: |
        Trả về các phiên đăng nhập **đang hoạt động** của chính người gọi (chưa bị
        thu hồi và chưa hết hạn tại thời điểm gọi), mới dùng gần nhất trước, tối đa
        100 dòng.

        Vì sao có endpoint này: trước đây chỉ có đúng hai đường thu hồi — đúng token
        đang gửi lên (`POST /api/v1/auth/logout`) và thu hồi **tất cả**
        (`POST /api/v1/auth/reset-password` / `confirm-email-change`). TTL trượt 7
        ngày nghĩa là chỉ cần mở app mỗi tuần thì một phiên không bao giờ hết hạn,
        nên đưa máy cho người khác là hành động một chiều, âm thầm và không quan sát
        được.

        `id` là khoá chính của hàng `Session` (cuid) — **không phải** token và không
        phải hash của token. `tokenHash` không bao giờ được trả về; chỉ token thô
        mới xác thực được và nó không được lưu ở đâu cả.

        `current = true` đánh dấu phiên đang gọi request này, để client gắn nhãn
        "thiết bị này". `deviceLabel` có thể là `null` với client cũ không gửi nhãn
        lúc đăng nhập.

        Không liên quan tới `GET /api/v1/push` — đó là danh sách **đích nhận thông
        báo**, xoá nó chỉ ngừng push chứ không thu hồi quyền truy cập dữ liệu.
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      tags: [auth]
      summary: Revoke one of the caller's own sessions
      description: |
        Thu hồi **một** phiên của chính người gọi (theo `id` lấy từ
        `GET /api/v1/auth/sessions`). Các phiên khác giữ nguyên.

        **Kiểm tra sở hữu, và 404 chứ không 403.** Id không tồn tại và id thuộc
        người dùng khác trả về **cùng một** 404 với cùng một body, nên không thể
        dùng endpoint này để dò xem một id lạ có tồn tại hay không — đúng quy ước
        của `GET /api/files/{id}` và `DELETE /api/v1/attachments/{id}`.

        **Idempotent.** Gọi lần thứ hai trên cùng một phiên vẫn là 200, với
        `alreadyRevoked = true`; `revokedAt` không bị ghi đè.

        **Phiên hiện tại CÓ thể thu hồi qua đường này** và đó là chủ ý: nó tương
        đương `POST /api/v1/auth/logout`, và là câu trả lời đúng cho "đăng xuất
        khỏi thiết bị này" khi thiết bị đó là máy đang cầm. Khi đó response có
        `current = true` kèm `message` nhắc đăng nhập lại — client **phải** xoá
        token đang giữ, vì request kế tiếp sẽ 401.

        Rate-limited per user như mọi write đã xác thực (60 req/60s).
      responses:
        '200':
          description: Revoked (or already revoked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/reset-password:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      security: []
      summary: Confirm a password-reset link by setting a new password
      description: |
        Takes the raw token from the `/forgot` link, finds the PasswordReset
        row by `sha256(token)`, updates the user's password hash, marks every
        outstanding reset row used, and revokes ALL of the user's Sessions
        (the password change kicks all devices off). Transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/change-password:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/change-email:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      summary: Yêu cầu đổi email — bước 1/2 (gửi token xác nhận tới địa chỉ mới)
      description: |
        Bước đầu của luồng đổi email. Body gồm **địa chỉ mới** và **mật khẩu hiện
        tại** (mật khẩu để một bearer token bị đánh cắp không thể tự chuyển tài
        khoản sang địa chỉ khác).

        Endpoint này **không** sửa `User.email`. Địa chỉ cũ vẫn đăng nhập / nhận
        thông báo bình thường cho tới khi bước 2 xác nhận thành công. Server tạo
        một token dùng-một-lần, hết hạn sau **30 phút** (cùng hạ tầng
        `PasswordReset` với luồng quên mật khẩu, cột `pendingEmail`) và gửi email
        tới **địa chỉ mới** — nhận được email ở đó chính là bằng chứng sở hữu địa
        chỉ. Email chứa cả link (`{APP_URL}/confirm-email/{token}`) và mã token
        thô để client native gọi thẳng bước 2.

        **Không tiết lộ địa chỉ đã tồn tại:** nếu địa chỉ mới đã thuộc một tài
        khoản khác, phản hồi vẫn là 200 với *cùng một* `message` trung tính như
        khi thành công, và **không** có email nào được gửi (giống cách
        `POST /api/v1/auth/register` xử lý email đã tồn tại). Chỉ khi địa chỉ mới
        trùng với chính email hiện tại của bạn thì mới trả 400.

        Yêu cầu bearer token. Rate limit theo user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEmailRequest' }
      responses:
        '200':
          description: |
            Đã ghi nhận yêu cầu (hoặc địa chỉ đã được dùng — hai trường hợp trả
            cùng một thông báo trung tính).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/confirm-email-change:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [auth]
      summary: Xác nhận đổi email — bước 2/2 (tiêu thụ token)
      description: |
        Bước cuối của luồng đổi email. Body chỉ có `token` (token thô trong email
        gửi tới địa chỉ mới). **Không yêu cầu bearer token**: token là chứng thực,
        và link thường được mở trên thiết bị khác.

        Khi thành công, trong một transaction: cập nhật `User.email` sang địa chỉ
        mới, đánh dấu token đã dùng **và** huỷ mọi token còn treo khác của user
        (cả token đặt lại mật khẩu lẫn token đổi email), rồi **thu hồi toàn bộ
        session** — giống hệt luồng đặt lại mật khẩu. Vì vậy client phải đăng nhập
        lại bằng địa chỉ mới; các thiết bị khác cũng bị đăng xuất.

        Token dùng một lần và hết hạn sau 30 phút. Token đã dùng, token hết hạn,
        token không tồn tại, **và token đặt lại mật khẩu** đều trả 400
        `invalid_email_change_token` (hai loại token được phân biệt bằng cột
        `pendingEmail`, migration 0009 — token đổi email không thể dùng để đặt lại
        mật khẩu và ngược lại). Nếu địa chỉ mới bị người khác đăng ký trong lúc
        chờ xác nhận: 400 `email_in_use`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: 'Token thô trong email xác nhận.' }
      responses:
        '200':
          description: Đã đổi email (mọi session đã bị thu hồi)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: Form-fill catalog (categories, brands, stores, warranty providers)
      responses:
        '200':
          description: Catalog bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }

  /api/v1/devices:
    # `lang` on this path is part of Phase 1 of docs/I18N_PLAN.md: the devices
    # slice renders `message` / `fieldErrors` in the request's language, so the
    # parameter is no longer an auth-only switch.
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [devices]
      parameters:
        - name: q
          in: query
          description: Case- and accent-insensitive substring match on name, brand, model or serialNumber.
          schema: { type: string }
        - name: category
          in: query
          description: 'Category code. The sentinel `ALL` (or an empty value) means "no filter".'
          schema: { type: string }
        - name: status
          in: query
          description: |
            Device status. The sentinel `ALL` (or an empty value) means "no filter".
            Go does not validate this value — anything else is passed straight to the
            `status = $n` predicate, so an unknown value simply matches nothing.
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST, ALL]
        - name: sort
          in: query
          description: 'Defaults to purchaseDate; an unknown value falls back to purchaseDate (Go never rejects it).'
          schema: { type: string, enum: [purchaseDate, warrantyEndDate, price, name] }
        - name: dir
          in: query
          description: 'Defaults to desc; any value other than asc is treated as desc (Go never rejects it).'
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      summary: Create a device
      description: |
        **Hạn mức thiết bị (FEATURE_IDEAS #14) — client KHÔNG được tự đếm lại theo
        cách khác.** Có **hai** trần độc lập, và chúng đếm hai tập khác nhau:

        | Trần | Giá trị | Đếm gì |
        |---|---|---|
        | Thiết bị đang sở hữu | **50** | `status <> 'SOLD'` |
        | Lưu trữ (tổng số hàng) | **500** | **mọi** thiết bị, kể cả đã bán |

        Nghĩa là: **thiết bị đã bán (`status = 'SOLD'`) không chiếm suất 50**. Đây là
        thay đổi chính sách có chủ ý — trước đây máy đã bán vẫn tính, nên người dùng
        lâu năm chỉ còn cách xoá hồ sơ máy đã bán để thêm máy mới, tức là xoá đúng
        hoá đơn/ngày bán/lãi-lỗ mà app sinh ra để giữ.

        Vì sao vẫn cần trần 500: nếu chỉ nới trần 50 mà không có trần tổng, tài khoản
        có thể phình vô hạn bằng cách bán → thêm → bỏ đánh dấu bán → lặp lại. Trần 500
        được áp ở **cả hai** đường ghi (`POST /api/v1/devices` **và**
        `POST /api/v1/backup/import`), nên không đường nào lách được đường kia.

        Hệ quả client phải biết:
        * Đếm theo `status` — **không** đếm theo `soldAt`. `soldAt`/`soldPrice` là cặp
          tuỳ chọn của migration 0006 ("đã bán, không ghi chi tiết"), và một thiết bị
          có `soldAt` nhưng `status = 'ACTIVE'` **vẫn** chiếm suất.
        * **Bỏ đánh dấu đã bán vẫn được phép** kể cả khi đang ở trần 50. Cách này
          *không* giải phóng suất, nó lấy lại một suất, nên tài khoản có thể tạm ở 51
          máy đang sở hữu sau khi sửa một lần bán nhầm. Đó là đánh đổi có chủ ý: từ
          chối sửa một lần bán nhầm chính là cái bẫy mà tính năng này tồn tại để dỡ.
          Client hiển thị theo `status`, đừng suy ra "còn bao nhiêu suất" từ hạn mức.
        * Máy đã bán **vẫn** nằm trong danh sách, trong `GET /api/v1/stats` và trong
          lịch sử chi tiêu. Chỉ **hạn mức** thay đổi, không phải luật báo cáo.
        * Thông báo lỗi nói rõ đang chạm trần nào và còn cách nào (đánh dấu đã bán, hay
          xoá hồ sơ cũ).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201':
          description: |
            Created. `warnings` là các cảnh báo **không chặn** (advisory) về
            `serialNumber` — IMEI sai checksum Luhn, sai độ dài IMEI, hoặc serial đã
            có ở thiết bị khác của cùng người dùng (FEATURE_IDEAS #6). Thiết bị **đã
            được tạo**; client chỉ nên hiện cảnh báo vàng, không được coi là thất bại.
            Mảng luôn có mặt, rỗng khi không có gì đáng lưu ý.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/Device' }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWarning' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices/{id}:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [devices]
      responses:
        '200':
          description: Device with warranties + attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: |
            Updated. `warnings` giống `POST /api/v1/devices`; thiết bị đang sửa được
            loại trừ khỏi phép dò trùng, nên lưu lại chính serial cũ không tạo cảnh
            báo "trùng với chính nó".
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/Device' }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWarning' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/warranties:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [warranties]
      responses:
        '200':
          description: Warranties for the device
          content:
            application/json:
              schema:
                type: object
                properties:
                  warranties:
                    type: array
                    items: { $ref: '#/components/schemas/Warranty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [warranties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { warranty: { $ref: '#/components/schemas/Warranty' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/devices/{id}/attachments:
    # `lang` on this path is part of Phase 1 of docs/I18N_PLAN.md: the attachment
    # pipeline renders `message` / `fieldErrors` in the request's language (the
    # MIME refusals come from internal/files and are translated at the service
    # boundary), so the parameter is no longer an auth-only switch.
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [attachments]
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentMeta' }
    post:
      tags: [attachments]
      summary: Upload an attachment (multipart/form-data)
      description: |
        Accepted types are decided by magic bytes, not the filename:
        JPEG / PNG / WEBP / GIF / HEIC / **PDF**. SVG, HTML and JS are rejected on
        purpose (they can carry executable content). Max 5 MB per file, 5 files
        per device, 100 MB total per user.

        Note: PDF is accepted as an attachment **and** is supported by the OCR
        endpoint (`/api/v1/ai/extract-receipt`), which sends it as a `document`
        block. GIF/HEIC are the types OCR refuses (there is no block for them).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/attachments:
    # Capture-first inbox (migration 0018, roadmap #12). One upload endpoint:
    # with a `deviceId` it behaves exactly like the device-scoped route above;
    # without one it creates an inbox item.
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    post:
      tags: [attachments]
      summary: Upload an attachment with an OPTIONAL deviceId (inbox when omitted)
      description: |
        Ảnh/hoá đơn được lưu **trước**, gán thiết bị **sau** — đây là điều kiện
        để không bỏ dở việc chụp hoá đơn ngay tại quầy, khi người dùng chưa biết
        (hoặc chưa có) hàng thiết bị tương ứng.

        `deviceId` là trường **tuỳ chọn** trong form:
          * vắng mặt, chuỗi rỗng, hoặc chuỗi `"null"` ⇒ tạo **mục trong hộp
            thư**: `deviceId` của hàng là NULL, file thuộc sở hữu người gọi và
            xuất hiện ở `GET /api/v1/inbox`;
          * có giá trị ⇒ gắn thẳng vào thiết bị đó, y hệt
            `POST /api/v1/devices/{deviceId}/attachments` (route cũ vẫn còn và
            vẫn bắt buộc thiết bị trên path).

        Mọi thứ khác **không đổi**: cùng whitelist magic-byte
        (JPG/PNG/WEBP/GIF/HEIC/PDF), cùng trần 5 MB/file, cùng trần 100 MB mỗi
        người dùng, cùng pipeline mã hoá AES-256-GCM. **Mục trong hộp thư vẫn
        tính vào 100 MB** (đó là dung lượng thật trên đĩa) nhưng **không** chiếm
        một trong 5 suất của bất kỳ thiết bị nào cho tới khi được gán.

        Ghi chú trạng thái: trần 5 file/thiết bị trên đường UPLOAD vẫn trả
        **400** như từ trước (đường device ở trên cũng vậy — mô tả 409 ở đó là
        lệch có từ trước, không phải hợp đồng mới). Riêng endpoint gán
        `POST /api/v1/attachments/{id}/file` trả **409** đúng như mô tả của nó.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                deviceId:
                  type: string
                  nullable: true
                  description: |
                    Thiết bị đích. Vắng mặt / rỗng / `null` ⇒ mục trong hộp thư.
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Uploaded (filed to a device, or created as an inbox item)
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'File larger than 5 MB (multipart envelope capped at 50 MB)' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/inbox:
    parameters: [{ $ref: '#/components/parameters/Lang' }]
    get:
      tags: [attachments]
      summary: The caller's unassigned attachments (capture-first inbox)
      description: |
        **"Attachment chưa có thiết bị"** — chính là các hàng `Attachment` có
        `deviceId` NULL, không phải một bảng file thứ hai. Mới nhất trước
        (`uploadedAt DESC`).

        Hình dạng trả về giống hệt `GET /api/v1/devices/{id}/attachments`: cùng
        key `attachments`, cùng `AttachmentMeta`, nên client dùng chung một
        decoder. **Không có dữ liệu thiết bị** vì chưa có thiết bị nào.

        Mục rời danh sách khi được gán bằng
        `POST /api/v1/attachments/{id}/file` hoặc bị xoá bằng
        `DELETE /api/v1/attachments/{id}`. Trần 5 file/thiết bị **không** áp
        dụng ở đây; trần 100 MB mỗi người dùng thì **có** (tính cả mục trong hộp
        thư).
      responses:
        '200':
          description: Inbox items, newest first (empty array when there are none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/attachments/{id}/file:
    parameters:
      - { $ref: '#/components/parameters/IdPath' }
      - { $ref: '#/components/parameters/Lang' }
    post:
      tags: [attachments]
      summary: File an attachment under a device, or return it to the inbox
      description: |
        Body `{ "deviceId": "<id>" }` gán file vào thiết bị đó. `deviceId: null`
        đưa file **về hộp thư** (bỏ gắn thiết bị). Đây là endpoint **duy nhất**
        thay đổi nơi lưu của một file; `PATCH /api/v1/attachments/{id}` vẫn chỉ
        nhận `description` — bất biến đã tài liệu hoá.

        Luật:
          * **404** nếu file không thuộc người gọi **hoặc** thiết bị không thuộc
            người gọi (không bao giờ 403 — không xác nhận id lạ tồn tại).
          * **409 `limit_reached`** nếu thiết bị đích đã có
            `MAX_ATTACHMENTS_PER_DEVICE` = **5** file đã gắn. Mã trên đường dây là
            **chữ thường**: `handlers.writeServiceError` gọi `strings.ToLower`
            trước khi ghi envelope, nên hằng số nội bộ `LIMIT_REACHED` không bao
            giờ xuất hiện trong JSON. Client phải so **không phân biệt hoa thường**.
            Mục bị từ chối **vẫn ở hộp thư** (hoặc ở thiết bị cũ), không mất dữ liệu.
          * Gán một file **đã gắn** sang một thiết bị **khác** là hợp lệ (chọn
            nhầm thiết bị là lỗi thật) và **tính vào suất của thiết bị đích**.
          * Gán lại vào đúng thiết bị nó đang ở là no-op thành công — file không
            tự tính mình là file thứ 6.
          * Blob đi theo hàng: đường dẫn đổi giữa `<deviceId>/<uuid>.enc` và
            `_inbox/<uuid>.enc` để `storagePath` trong bản backup vẫn trỏ đúng
            byte. File đã mất trên đĩa không chặn việc gán (hàng vẫn chuyển; bản
            export sau đó báo qua `missingAttachmentIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentFileInput' }
      responses:
        '200':
          description: Updated attachment metadata (now filed, or back in the inbox)
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices/{id}/service-directory:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [devices]
      summary: Warranty directory for one device — "mang máy đi bảo hành ở đâu"
      description: |
        Trả lời câu hỏi thật lúc đứng ở quầy: *"giờ tôi mang máy đi đâu"*, cho **một**
        thiết bị (FEATURE_IDEAS #15).

        Câu trả lời có ba tầng và chúng **không** được trộn vào nhau:

        1. `brand` — trang tra cứu trung tâm uỷ quyền **của chính hãng**, lấy từ
           catalog `BrandServiceInfo` (migration 0012) và được cache chung với
           `GET /api/v1/catalog` (60 giây, `InvalidateCatalogCache`). Đây là URL do
           hãng tự duy trì, không phải hotline chép tay.
        2. `centres[].address` / `centres[].phone` — **do người dùng tự ghi** cho
           từng gói bảo hành (`Warranty.address` / `Warranty.phone`), kèm
           `phoneSource`. Đây là thông tin liên hệ **duy nhất** mà app dám hiển thị
           như thông tin liên hệ.
        3. `brand: null` / `provider: null` — app **không biết**. Không đoán.

        App **không** lưu hotline hay địa chỉ trung tâm bảo hành: migration 0008 đã
        cố ý để `WarrantyProvider.phone`/`.address` là NULL vì *"a wrong hotline is
        worse than an empty one"*, và migration 0012 giữ nguyên quyết định đó —
        bảng `BrandServiceInfo` **không có cột phone/address** nào.

        Khớp chuỗi: `Device.brand` và `Warranty.provider` là văn bản tự do, được
        chuẩn hoá bỏ dấu (`ai.Normalize`) rồi so theo **tập token**. Một ứng viên chỉ
        khớp khi tập token của bên này chứa trọn tập token của bên kia, và **hoà thì
        không khớp** (`provider: null`): "Trung tâm bảo hành" khớp mười mấy dòng như
        nhau, chọn bừa một dòng là đoán — đúng thứ tính năng này phải tránh. Vì vậy
        client **luôn** hiển thị `providerInput` bên cạnh `provider`.
      responses:
        '200':
          description: Directory bundle
          content:
            application/json:
              schema:
                type: object
                required: [directory]
                properties:
                  directory: { $ref: '#/components/schemas/ServiceDirectory' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/shares:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [shares]
      summary: List share links of a device (owner only)
      description: |
        Chỉ các link của thiết bị **thuộc người gọi**. Thiết bị của người khác trả
        `[]`, không phải 404 — cùng lượng thông tin mà một danh sách rỗng cho biết.

        `token` **không bao giờ** xuất hiện ở đây: server chỉ lưu sha256 của token,
        nên sau lúc tạo không ai — kể cả chủ máy — đọc lại được token. Muốn link mới
        thì tạo link mới.
      responses:
        '200':
          description: Share list
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    description: 'Mới nhất trước, tối đa 50 dòng. Luôn là `[]`, không bao giờ `null`.'
                    items: { $ref: '#/components/schemas/DeviceShare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [shares]
      summary: Create a read-only share link (handover certificate)
      description: |
        Tạo **phiếu bàn giao bảo hành**: một link chỉ-đọc, không cần đăng nhập, cho
        đúng **một** thiết bị (FEATURE_IDEAS #2). Dùng lúc bán máy hoặc lúc đưa máy
        cho người khác đi bảo hành.

        **Token chỉ trả về MỘT LẦN** trong response này. Server lưu sha256 hex của
        token (`auth.NewTokenAndHash`, cùng khuôn `PasswordReset`/`Session`), nên
        token không thể đọc lại từ DB, từ log hay từ `GET .../shares`. Hãy đưa
        `share.token` (hoặc `share.sharePath`) cho người nhận ngay.

        Body rỗng là hợp lệ = mặc định 30 ngày + serial che giữa. Trường lạ bị từ
        chối (`400`) để một lỗi gõ như `expiresInDay` không âm thầm tạo link mặc định.

        Bảo mật (tóm tắt, chi tiết ở `GET /api/v1/public/shares/{token}`):
        * quyền đọc nằm ở token, **không** ở `userId` — link không đọc được thiết bị
          nào khác, và không có tham số nào để trỏ sai;
        * link **luôn** hết hạn (1–90 ngày, mặc định 30), thu hồi được, và bị xoá
          theo thiết bị (`ON DELETE CASCADE`);
        * tối đa 10 link còn hiệu lực cho mỗi thiết bị.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 90
                  description: 'Số ngày link còn hiệu lực. Bỏ trống = 30. Không có giá trị "vĩnh viễn".'
                includeSerial:
                  type: boolean
                  default: false
                  description: |
                    `false` (mặc định): phiếu chỉ có `serialNumberMasked` (giữ đầu/cuối,
                    che giữa). `true`: phiếu có thêm `serialNumber` đầy đủ — cần khi
                    trung tâm bảo hành tra cứu theo IMEI, nhưng nghĩa là link (nếu bị
                    chuyển tiếp) mang theo định danh đầy đủ của máy.
      responses:
        '201':
          description: Created — `share.token` is shown once and never again
          content:
            application/json:
              schema:
                type: object
                required: [share]
                properties:
                  share: { $ref: '#/components/schemas/CreatedDeviceShare' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/shares/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      tags: [shares]
      summary: Revoke a share link (owner only)
      description: |
        Thu hồi ngay lập tức. **Idempotent**: gọi lại lần hai vẫn `200`.

        Link của người khác = `404`, không phân biệt được với id không tồn tại.

        Link **không** tự thu hồi khi thiết bị được đánh dấu `SOLD`: phiếu bàn giao
        chính là thứ người mua cần **sau** khi mua, nên thu hồi lúc bán sẽ vô hiệu
        hoá đúng mục đích của nó. Ba đường thu hồi thật là: gọi endpoint này, để link
        hết hạn, hoặc xoá thiết bị (xoá theo, `ON DELETE CASCADE`).
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/public/shares/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: 'Token 32 byte ngẫu nhiên (base64url) do `POST /api/v1/devices/{id}/shares` trả về. Không đoán được, không dò được.'
        schema: { type: string }
      # Level 1 of this path's OWN precedence chain — see the "Ngôn ngữ" block in
      # the description. It is the shared `Lang` parameter because the meaning is
      # the same one (`vi`/`en` only, anything else falls through, never a 400).
      - { $ref: '#/components/parameters/Lang' }
    get:
      tags: [shares]
      summary: Public handover certificate (NO authentication)
      security: []
      description: |
        **Đây là đường đọc DUY NHẤT của service không cần bearer token.** Token trong
        path *chính là* quyền truy cập, nên endpoint được thiết kế như một capability
        URL và mọi chi tiết dưới đây là quyết định bảo mật, không phải trang trí.

        **Nội dung trả về (projection hẹp, cố định).** Đúng những trường trong
        `SharedCertificate`: tên máy, loại, hãng, model, ngày mua, nơi mua, trạng
        thái, `soldAt`, serial (che giữa; đầy đủ chỉ khi chủ máy chọn
        `includeSerial`), danh sách gói bảo hành (loại, **bộ phận**, nhà bảo hành,
        thời gian, địa chỉ/số điện thoại **do người dùng ghi**),
        `effectiveWarrantyEnd`, ngày hết hạn của link và disclaimer.

        **Không bao giờ** có: `id` thiết bị, `notes`, `purchasePrice`, `soldPrice`,
        `Warranty.cost`, `Warranty.notes`, ảnh/hoá đơn (`Attachment`), hay bất kỳ
        thiết bị nào khác của chủ máy. Trong chín trường điều khoản của migration
        0017, **chỉ `component`** có mặt (để người nhận biết một mốc thuộc bộ phận
        nào); `cap`, `deductible`, `exclusions`, `region`, `transferable`,
        `claimsAllowed`, `claimsUsed` và `scope` bị loại. Việc lọc nằm ở **câu SQL**
        (không select cột đó), không phải ở một bộ lọc Go mà lần sửa sau có thể bỏ
        quên.

        **Ảnh hoá đơn: chưa hỗ trợ, có chủ ý.** Một route file công khai sẽ là bề mặt
        không xác thực thứ hai, và ảnh hoá đơn chứa nhiều dữ liệu cá nhân của người
        bán (tên, địa chỉ, số điện thoại, có khi cả món khác) — nhiều hơn hẳn thứ
        phiếu bàn giao cần.

        **Ba kiểu hỏng trả về ĐÚNG MỘT câu trả lời.** Token sai, token hết hạn và
        token đã thu hồi đều là `404` với body **giống hệt nhau** — endpoint không
        phải một oracle để dò xem token nào từng tồn tại.

        **Header trên MỌI response** (kể cả 404): `Cache-Control: no-store`, `Pragma:
        no-cache`, `X-Robots-Tag: noindex, nofollow, noarchive`, `Referrer-Policy:
        no-referrer` (token nằm trong path, không được rò qua Referer khi người nhận
        bấm link của hãng), `X-Frame-Options: DENY`, và CSP `default-src 'none'`.

        **Rate limit** theo IP: 60 request / 15 phút (`429` + `Retry-After`).

        **Log**: token bị thay bằng `{token}` trước khi ghi access log
        (`httpx.RedactPath`) — log không phải nơi giữ một credential sống.

        **Nội dung trả về chọn theo `Accept`:**
        * mặc định (trình duyệt, `Accept: text/html,...`) → **một trang HTML in được**,
          tự chứa (không script, không CSS/ảnh ngoài), có `@media print`.
          Không cần web app, nên link vẫn mở được kể cả khi web đổi phiên bản.
        * `Accept: application/json` (và không có `text/html`) → JSON
          `{"certificate": …}` cho client lập trình.

        **Ngôn ngữ của phiếu — chuỗi riêng, KHÔNG dùng `User.locale`.** Người nhận
        là bên thứ ba được chuyển tiếp link: họ chưa từng chọn ngôn ngữ trong app
        này, và `User.locale` là lựa chọn của **chủ máy**, không phải của họ. Nên
        thứ tự ở đây là:
        1. `?lang=vi|en` — thắng tất cả, và là cách duy nhất để một người nhận có
           trình duyệt không gửi gì yêu cầu được;
        2. `Accept-Language` — chính trình duyệt của người nhận (điện thoại tiếng
           Việt gửi `vi`);
        3. **`vi`** — khác với mặc định `en` của phần còn lại của API, và có chủ ý:
           phiếu này ra đời trước i18n với lời miễn trừ tiếng Việt, nó là tài liệu
           in/lưu PDF, và mọi link cũ hay công cụ không phải trình duyệt đều không
           gửi `Accept-Language`. Đổi mặc định sẽ lật ngôn ngữ của một phiếu người
           nhận đã in ra — thứ không ai sửa lại được.
        Ngôn ngữ không hỗ trợ **rơi xuống mức kế tiếp**, không bao giờ là 400.
        `Content-Language` trên response nói đúng ngôn ngữ đã render.

        **Ngôn ngữ KHÔNG phải một oracle.** Bốn kiểu hỏng (token sai / hết hạn / đã
        thu hồi / thiết bị đã xoá) trả body **giống hệt nhau trong cùng một ngôn
        ngữ**, và ngôn ngữ là do client gửi nên không nói lên điều gì về token.
      responses:
        '200':
          description: |
            Phiếu bàn giao. `text/html` là mặc định; `application/json` khi client
            yêu cầu rõ ràng.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [certificate]
                properties:
                  certificate: { $ref: '#/components/schemas/SharedCertificate' }
        '404':
          description: |
            Token không tồn tại, đã hết hạn, đã bị thu hồi, hoặc thiết bị của nó đã
            bị xoá — **không phân biệt được** (cùng status, cùng body). HTML: một
            trang lỗi; JSON: envelope `ApiError`. Câu trả lời giống hệt nhau trong
            **cùng một ngôn ngữ**; ngôn ngữ theo chuỗi ở trên.
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }

