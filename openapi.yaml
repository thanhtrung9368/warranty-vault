openapi: 3.0.3
info:
  title: WarrantyVault API
  description: |
    REST API for native mobile clients (iOS / Android) of WarrantyVault.
    Source-of-truth for client codegen:
      - iOS:     swift-openapi-generator
      - Android: openapi-generator-cli (kotlin)
    The web app continues to use Next.js Server Actions — those are NOT
    documented here.

    Auth: bearer token from POST /api/v1/auth/login (or /register). Send as
    `Authorization: Bearer <token>` on every authenticated request.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://warrantyvault.example.com
    description: Production (set when deployed)

tags:
  - { name: auth }
  - { name: devices }
  - { name: warranties }
  - { name: attachments }
  - { name: subscriptions }
  - { name: wishlist }
  - { name: push }
  - { name: catalog }
  - { name: stats }
  - { name: ai }

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '200':
          description: Email already taken (returns generic message; do not infer)
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean }, message: { type: string } }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session token
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/forgot:
    post:
      tags: [auth]
      security: []
      summary: Request a password-reset link by email
      description: |
        Always returns `{ ok: true }` regardless of whether the email is
        registered (avoids user enumeration). Sends an email containing a
        time-limited reset link to the address if it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties: { user: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Cập nhật hồ sơ — chỉ tên hiển thị
      description: |
        Partial profile update. `displayName` is the ONLY accepted field; the
        account email **cannot be changed here** (and is not supported anywhere
        yet — it needs a two-step verification flow, deliberately out of scope).
        A body carrying `email` / `newEmail` is rejected with 400 and a
        `fieldErrors` entry saying so, rather than silently ignored.

        Clearing: `"displayName": null`, `""`, or only whitespace all set the
        name to null. A missing `displayName` key is 400 (`Thiếu displayName`),
        not a silent no-op.

        Response mirrors `GET /api/v1/auth/me` (`{ "user": ... }`) plus a
        Vietnamese `message`, so a client can replace its cached user object
        directly from the PATCH response. Rate-limited per user like every other
        authenticated write (60 req/60s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [auth]
      summary: Permanently delete the authenticated user's account
      description: |
        Cascades the user's owned rows (Device / Subscription / Wishlist /
        Session / PasswordReset) in a single statement and best-effort
        removes the on-disk encrypted attachments. Requires the current
        password in the body for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      summary: List the caller's active login sessions
      description: |
        Trả về các phiên đăng nhập **đang hoạt động** của chính người gọi (chưa bị
        thu hồi và chưa hết hạn tại thời điểm gọi), mới dùng gần nhất trước, tối đa
        100 dòng.

        Vì sao có endpoint này: trước đây chỉ có đúng hai đường thu hồi — đúng token
        đang gửi lên (`POST /api/v1/auth/logout`) và thu hồi **tất cả**
        (`POST /api/v1/auth/reset-password` / `confirm-email-change`). TTL trượt 7
        ngày nghĩa là chỉ cần mở app mỗi tuần thì một phiên không bao giờ hết hạn,
        nên đưa máy cho người khác là hành động một chiều, âm thầm và không quan sát
        được.

        `id` là khoá chính của hàng `Session` (cuid) — **không phải** token và không
        phải hash của token. `tokenHash` không bao giờ được trả về; chỉ token thô
        mới xác thực được và nó không được lưu ở đâu cả.

        `current = true` đánh dấu phiên đang gọi request này, để client gắn nhãn
        "thiết bị này". `deviceLabel` có thể là `null` với client cũ không gửi nhãn
        lúc đăng nhập.

        Không liên quan tới `GET /api/v1/push` — đó là danh sách **đích nhận thông
        báo**, xoá nó chỉ ngừng push chứ không thu hồi quyền truy cập dữ liệu.
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    delete:
      tags: [auth]
      summary: Revoke one of the caller's own sessions
      description: |
        Thu hồi **một** phiên của chính người gọi (theo `id` lấy từ
        `GET /api/v1/auth/sessions`). Các phiên khác giữ nguyên.

        **Kiểm tra sở hữu, và 404 chứ không 403.** Id không tồn tại và id thuộc
        người dùng khác trả về **cùng một** 404 với cùng một body, nên không thể
        dùng endpoint này để dò xem một id lạ có tồn tại hay không — đúng quy ước
        của `GET /api/files/{id}` và `DELETE /api/v1/attachments/{id}`.

        **Idempotent.** Gọi lần thứ hai trên cùng một phiên vẫn là 200, với
        `alreadyRevoked = true`; `revokedAt` không bị ghi đè.

        **Phiên hiện tại CÓ thể thu hồi qua đường này** và đó là chủ ý: nó tương
        đương `POST /api/v1/auth/logout`, và là câu trả lời đúng cho "đăng xuất
        khỏi thiết bị này" khi thiết bị đó là máy đang cầm. Khi đó response có
        `current = true` kèm `message` nhắc đăng nhập lại — client **phải** xoá
        token đang giữ, vì request kế tiếp sẽ 401.

        Rate-limited per user như mọi write đã xác thực (60 req/60s).
      responses:
        '200':
          description: Revoked (or already revoked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRevokeResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      security: []
      summary: Confirm a password-reset link by setting a new password
      description: |
        Takes the raw token from the `/forgot` link, finds the PasswordReset
        row by `sha256(token)`, updates the user's password hash, marks every
        outstanding reset row used, and revokes ALL of the user's Sessions
        (the password change kicks all devices off). Transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/change-email:
    post:
      tags: [auth]
      summary: Yêu cầu đổi email — bước 1/2 (gửi token xác nhận tới địa chỉ mới)
      description: |
        Bước đầu của luồng đổi email. Body gồm **địa chỉ mới** và **mật khẩu hiện
        tại** (mật khẩu để một bearer token bị đánh cắp không thể tự chuyển tài
        khoản sang địa chỉ khác).

        Endpoint này **không** sửa `User.email`. Địa chỉ cũ vẫn đăng nhập / nhận
        thông báo bình thường cho tới khi bước 2 xác nhận thành công. Server tạo
        một token dùng-một-lần, hết hạn sau **30 phút** (cùng hạ tầng
        `PasswordReset` với luồng quên mật khẩu, cột `pendingEmail`) và gửi email
        tới **địa chỉ mới** — nhận được email ở đó chính là bằng chứng sở hữu địa
        chỉ. Email chứa cả link (`{APP_URL}/confirm-email/{token}`) và mã token
        thô để client native gọi thẳng bước 2.

        **Không tiết lộ địa chỉ đã tồn tại:** nếu địa chỉ mới đã thuộc một tài
        khoản khác, phản hồi vẫn là 200 với *cùng một* `message` trung tính như
        khi thành công, và **không** có email nào được gửi (giống cách
        `POST /api/v1/auth/register` xử lý email đã tồn tại). Chỉ khi địa chỉ mới
        trùng với chính email hiện tại của bạn thì mới trả 400.

        Yêu cầu bearer token. Rate limit theo user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEmailRequest' }
      responses:
        '200':
          description: |
            Đã ghi nhận yêu cầu (hoặc địa chỉ đã được dùng — hai trường hợp trả
            cùng một thông báo trung tính).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/confirm-email-change:
    post:
      tags: [auth]
      summary: Xác nhận đổi email — bước 2/2 (tiêu thụ token)
      description: |
        Bước cuối của luồng đổi email. Body chỉ có `token` (token thô trong email
        gửi tới địa chỉ mới). **Không yêu cầu bearer token**: token là chứng thực,
        và link thường được mở trên thiết bị khác.

        Khi thành công, trong một transaction: cập nhật `User.email` sang địa chỉ
        mới, đánh dấu token đã dùng **và** huỷ mọi token còn treo khác của user
        (cả token đặt lại mật khẩu lẫn token đổi email), rồi **thu hồi toàn bộ
        session** — giống hệt luồng đặt lại mật khẩu. Vì vậy client phải đăng nhập
        lại bằng địa chỉ mới; các thiết bị khác cũng bị đăng xuất.

        Token dùng một lần và hết hạn sau 30 phút. Token đã dùng, token hết hạn,
        token không tồn tại, **và token đặt lại mật khẩu** đều trả 400
        `invalid_email_change_token` (hai loại token được phân biệt bằng cột
        `pendingEmail`, migration 0009 — token đổi email không thể dùng để đặt lại
        mật khẩu và ngược lại). Nếu địa chỉ mới bị người khác đăng ký trong lúc
        chờ xác nhận: 400 `email_in_use`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: 'Token thô trong email xác nhận.' }
      responses:
        '200':
          description: Đã đổi email (mọi session đã bị thu hồi)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadInput' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/catalog:
    get:
      tags: [catalog]
      summary: Form-fill catalog (categories, brands, stores, warranty providers)
      responses:
        '200':
          description: Catalog bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }

  /api/v1/devices:
    get:
      tags: [devices]
      parameters:
        - name: q
          in: query
          description: Case- and accent-insensitive substring match on name, brand, model or serialNumber.
          schema: { type: string }
        - name: category
          in: query
          description: 'Category code. The sentinel `ALL` (or an empty value) means "no filter".'
          schema: { type: string }
        - name: status
          in: query
          description: |
            Device status. The sentinel `ALL` (or an empty value) means "no filter".
            Go does not validate this value — anything else is passed straight to the
            `status = $n` predicate, so an unknown value simply matches nothing.
          schema:
            type: string
            enum: [ACTIVE, EXPIRED, SOLD, BROKEN, LOST, ALL]
        - name: sort
          in: query
          description: 'Defaults to purchaseDate; an unknown value falls back to purchaseDate (Go never rejects it).'
          schema: { type: string, enum: [purchaseDate, warrantyEndDate, price, name] }
        - name: dir
          in: query
          description: 'Defaults to desc; any value other than asc is treated as desc (Go never rejects it).'
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201':
          description: |
            Created. `warnings` là các cảnh báo **không chặn** (advisory) về
            `serialNumber` — IMEI sai checksum Luhn, sai độ dài IMEI, hoặc serial đã
            có ở thiết bị khác của cùng người dùng (FEATURE_IDEAS #6). Thiết bị **đã
            được tạo**; client chỉ nên hiện cảnh báo vàng, không được coi là thất bại.
            Mảng luôn có mặt, rỗng khi không có gì đáng lưu ý.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/Device' }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWarning' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/devices/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [devices]
      responses:
        '200':
          description: Device with warranties + attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: |
            Updated. `warnings` giống `POST /api/v1/devices`; thiết bị đang sửa được
            loại trừ khỏi phép dò trùng, nên lưu lại chính serial cũ không tạo cảnh
            báo "trùng với chính nó".
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/Device' }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceWarning' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/devices/{id}/warranties:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [warranties]
      responses:
        '200':
          description: Warranties for the device
          content:
            application/json:
              schema:
                type: object
                properties:
                  warranties:
                    type: array
                    items: { $ref: '#/components/schemas/Warranty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [warranties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { warranty: { $ref: '#/components/schemas/Warranty' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/devices/{id}/attachments:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [attachments]
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/AttachmentMeta' }
    post:
      tags: [attachments]
      summary: Upload an attachment (multipart/form-data)
      description: |
        Accepted types are decided by magic bytes, not the filename:
        JPEG / PNG / WEBP / GIF / HEIC / **PDF**. SVG, HTML and JS are rejected on
        purpose (they can carry executable content). Max 5 MB per file, 5 files
        per device, 100 MB total per user.

        Note: PDF is accepted *as an attachment* but is not supported by the OCR
        endpoint (`/api/v1/ai/extract-receipt`), which is image-only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, nullable: true }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties: { attachment: { $ref: '#/components/schemas/AttachmentMeta' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/warranties/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [warranties]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties: { warranty: { $ref: '#/components/schemas/Warranty' } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [warranties]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/warranties/{id}/reminder:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [warranties]
