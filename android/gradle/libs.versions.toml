[versions]
agp = "8.9.1"
playPublisher = "4.1.1"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitKotlinSerializationConverter = "1.0.0"
coroutines = "1.9.0"
securityCrypto = "1.1.0-alpha06"
# App lock ("Khoá bằng sinh trắc học"). `biometric` is the AndroidX wrapper over
# the framework BiometricPrompt: it ships the pre-API-30 compat dialog and the
# device-credential fallback, so unlocking is biometrics-with-PIN everywhere.
# It asks for androidx.fragment 1.2.5 transitively; `fragment` is pinned to a
# newer release here because 1.2.5 predates the Activity Result fix that lint's
# InvalidFragmentVersionForActivityResult requires (MainActivity uses
# registerForActivityResult).
biometric = "1.2.0-alpha05"
fragment = "1.5.7"
coil = "2.7.0"
viewmodelCompose = "2.8.7"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
junit = "4.13.2"

# Serial / IMEI scanning (AddDeviceSheet.kt → SerialScannerDialog.kt).
#
# `mlkitBarcode` is the BUNDLED ML Kit artifact (com.google.mlkit:barcode-scanning),
# not the Play-Services variant (com.google.android.gms:play-services-mlkit-…): the
# model ships inside the APK, so a scan works offline, on a phone without Google
# Play Services, and without a first-use model download on a shop's Wi-Fi.
# The formats the scanner asks for are Code128 / EAN-13 / EAN-8 / QR / DataMatrix
# — IMEI labels are Code128, phone boxes carry EAN-13, and some brands print a
# DataMatrix next to the S/N.
#
# `mlkitTextRecognition` is the second model, added on purpose: the serial is
# often PRINTED text (S/N on a laptop box, IMEI under the battery) rather than a
# barcode, so barcode-only would miss the case this feature exists for. It is the
# bundled Latin model, so it is offline too. It is NOT small: the OCR native
# pipeline is ~11 MB per ABI in the release APK (measured, not guessed). The app
# ships as an App Bundle, which splits by ABI, so a phone downloads one ABI's
# worth; the reasoning is repeated where both models are used
# (SerialScannerDialog.kt).
#
# CameraX supplies the preview and the frame pipeline that feeds ML Kit. It is
# the AndroidX camera stack already in the ecosystem — no vendor SDK, no
# deprecated Camera1 API.
camerax = "1.4.2"
mlkitBarcode = "17.3.0"
mlkitTextRecognition = "16.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "viewmodelCompose" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinSerializationConverter" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# ---- Serial / IMEI scanner: camera preview + the two ML Kit models ----
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitTextRecognition" }

# ---- JVM unit tests (src/test) ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
