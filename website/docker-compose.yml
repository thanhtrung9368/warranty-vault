# ─────────────────────────────────────────────────────────────────────────────
# website/docker-compose.yml — web + Go API + Postgres, volumes RIÊNG.
#
# ⚠️ Đây KHÔNG phải file compose chính. File canonical ở repo root
#    (`../docker-compose.yml`) — đó là file `deploy/README.md` và
#    `deploy/PRODUCTION_CHECKLIST.md` hướng dẫn. Hai file dùng tên volume
#    khác nhau (`warranty-pg`/`warranty-data` ở đây vs `pgdata`/`uploads`
#    ở root) nên ĐỪNG trộn lẫn: chạy file này rồi chạy file root sẽ tạo
#    hai bộ dữ liệu tách biệt.
#
# File này giữ lại cho ai muốn dựng nhanh bộ ba web+api+db mà không cần
# Caddy / systemd timer. Sau Phase F, `app` chỉ là UI mỏng proxy sang `api`,
# nên nó PHẢI có `GO_API_URL` — thiếu biến đó thì web không gọi được Go.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    container_name: warranty-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: warranty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: warranty_vault
    volumes:
      - warranty-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warranty -d warranty_vault"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be passed at BUILD time — they're inlined into
        # the client bundle. Set in .env (compose auto-loads it) or here.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: warranty-vault:local
    container_name: warranty-vault
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Web là UI mỏng — mọi read/write proxy sang Go. API chết thì web
      # không phục vụ được gì có ích. Đồ thị không có vòng lặp: db ← api ← app.
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # ── Go API URL ────────────────────────────────────────────────
      # PHẢI kết thúc bằng `/api`: `src/lib/api/client.ts` ghép
      # `GO_API_URL + '/v1/...'` còn Go phục vụ `/api/v1/...`. Thiếu `/api`
      # thì mọi lời gọi web → Go đều 404.
      GO_API_URL: "http://api:4000/api"

      # ── Bắt buộc ──────────────────────────────────────────────────
      # `app` chỉ thực sự đọc 2 biến: SESSION_SECRET (mã hoá cookie
      # iron-session) và NEXT_PUBLIC_VAPID_PUBLIC_KEY (inline lúc build).
      # DB, giải mã blob, gửi push/mail, cron đều là việc của `api`.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (>=32 chars)}
      NODE_ENV: production

      # ── Web push (client subscribe) ───────────────────────────────
      # Phải khớp VAPID_PUBLIC_KEY của service `api` bên dưới.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Go API service — backend canonical (Phase A–F đã xong). Sở hữu Postgres,
  # blob mã hoá, push, cron; web chỉ proxy sang đây.
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: warranty-vault-api:local
    container_name: warranty-vault-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      # ── DB & uploads ──────────────────────────────────────────────
      DATABASE_URL: "postgresql://warranty:${POSTGRES_PASSWORD}@db:5432/warranty_vault"
      PRIVATE_UPLOAD_ROOT: "/data/private-uploads"

      # ── Server ────────────────────────────────────────────────────
      PORT: "4000"
      WEB_URL: ${APP_URL:-http://localhost:3000}

      # ── Required (shared with the web container) ──────────────────
      FILE_MASTER_KEY: ${FILE_MASTER_KEY:?FILE_MASTER_KEY must be set (32-byte base64)}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}

      # ── Auth / sessions ───────────────────────────────────────────
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}

      # ── Push notifications (optional) ─────────────────────────────
      # Note: server-side var name in Go is VAPID_PUBLIC_KEY (no NEXT_PUBLIC_ prefix).
      VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.warrantyvault.app}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}

      # ── Email (Resend, optional) ──────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

      # ── Rate limit ────────────────────────────────────────────────
      RATE_LIMITER: ${RATE_LIMITER:-memory}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}

      # ── AI: OCR hoá đơn (optional) ────────────────────────────────
      # ai.NewFromEnv() đọc thẳng từ env. Thiếu key → endpoint trả 503
      # feature_disabled. Phải forward ở đây, không thì đặt trong .env vô ích.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      # Chỉ `api` cần volume blob mã hoá — `app` proxy byte stream qua HTTP,
      # không đọc đĩa.
      - warranty-data:/data
    # distroless/static không có shell, wget hay curl — nên healthcheck gọi
    # thẳng binary: `/app/server -healthcheck` probe `GET /readyz` (có ping DB)
    # rồi thoát 0/1. Probe tự timeout 4s, ngắn hơn `timeout` 5s bên dưới để nó
    # tự báo lỗi thay vì bị SIGKILL.
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  warranty-pg:
  warranty-data:
